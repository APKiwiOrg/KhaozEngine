name: Native CI scope
description: Report whether Product CI paths reach the requested native test segments.
inputs:
  segments:
    description: JSON array of segments from .github/ci-scope.txt.
    required: true
  token:
    description: Token for the shared scope action's Actions API read.
    default: ${{ github.token }}
  base-events:
    description: Optional space separated list of events whose passing runs can be a push base.
    required: false
outputs:
  selected:
    description: Whether to run native correctness.
    value: ${{ steps.route.outputs.selected }}
runs:
  using: composite
  steps:
    - id: scope
      uses: APKiwiOrg/ci-workflows/.github/actions/ci-scope@ae32b9aaede81946fdc88a02876d75e70861c728
      with:
        token: ${{ inputs.token }}
        base-events: ${{ inputs.base-events }}
    - id: route
      shell: bash
      env:
        FULL: ${{ steps.scope.outputs.full }}
        AFFECTED: ${{ steps.scope.outputs.segments }}
        REQUESTED: ${{ inputs.segments }}
        REASON: ${{ steps.scope.outputs.reason }}
      run: |
        set -euo pipefail
        if ! jq -en --argjson requested "$REQUESTED" \
          '$requested | type == "array" and length > 0 and all(.[]; type == "string")' >/dev/null; then
          printf 'Invalid native scope segments %s. Expected a nonempty array of strings.\n' "$REQUESTED" >&2
          exit 1
        fi
        if [[ -r .github/ci-scope.txt ]]; then
          catalog=$(awk -F: 'NF > 1 {
            name = $1
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
            rest = substr($0, index($0, ":") + 1)
            if (name ~ /^[A-Za-z0-9][A-Za-z0-9._-]*$/ && rest ~ /[^[:space:]]/ &&
                tolower(name) != "full" && tolower(name) != "ignore") print name
          }' .github/ci-scope.txt)
          unknown=$(jq -cn --argjson requested "$REQUESTED" --arg catalog "$catalog" \
            '$requested - ($catalog | split("\n"))')
          if [[ "$unknown" != '[]' ]]; then
            printf 'Unknown native scope segments %s.\n' "$unknown" >&2
            exit 1
          fi
        fi
        matches=$(jq -n --argjson affected "$AFFECTED" --argjson requested "$REQUESTED" \
          'any($requested[]; IN($affected[]))')
        if [[ "$FULL" == true || "$matches" == true ]]; then
          selected=true
          result="Selected native correctness"
        else
          selected=false
          result="Skipped native correctness because no changed path reached $REQUESTED"
        fi
        printf 'selected=%s\n' "$selected" >> "$GITHUB_OUTPUT"
        printf '%s. %s\n' "$result" "$REASON"
        printf '### Scope\n\n%s.\n\n%s\n' "$result" "$REASON" >> "$GITHUB_STEP_SUMMARY"
