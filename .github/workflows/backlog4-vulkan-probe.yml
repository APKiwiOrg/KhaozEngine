name: backlog4 Vulkan comparison
on:
  push:
    branches: [fix/backlog4-vulkan-probe]
permissions:
  contents: read
  packages: read
concurrency:
  group: backlog4-vulkan-probe
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}
      KE_GPU_TESTS: '1'
      KE_GRAPHICS_BACKEND: vulkan-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
      - name: Select software Vulkan device
        run: |
          icd=$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -name '*lvp*.json' 2>/dev/null | head -1)
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          mkdir -p local-feed artifacts/fxaa-probe
      - name: Compare current and original shader
        shell: bash
        run: |
          set +e
          vulkaninfo > artifacts/fxaa-probe/vulkaninfo.txt 2>&1
          for samples in 1 2 4; do
            KE_FXAA_PROBE_SAMPLES="$samples" KE_FXAA_PROBE_DIR="$PWD/artifacts/fxaa-probe/samples-$samples" dotnet test KhaozEngine.Render.Tests/KhaozEngine.Render.Tests.csproj -c Release --filter FullyQualifiedName~MsaaPostFxaaGpuTests --logger "console;verbosity=detailed" > "artifacts/fxaa-probe/samples-$samples.log" 2>&1
            echo "samples=$samples exit=$?" >> artifacts/fxaa-probe/outcomes.txt
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fxaa-probe
          path: artifacts/fxaa-probe
