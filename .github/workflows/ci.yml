name: ci
# Two paths, split by event (see docs/design/CI-SELECTIVE-TESTS-DESIGN-2026-07-18.md, Decisions 4-5):
#   * Tag pushes (refs/tags/v*) and workflow_dispatch run the FULL sequence inline: restore, build,
#     full test, determinism double-pass, pack, and (tags only) publish. This is what gates a release.
#   * Push (main) and pull_request run scripts/ci-selective-test.sh, which builds and tests only the
#     slice the diff affects (empty on a docs-only push). No pack or publish on this path.
# Cancel a superseded in-flight run on the SAME ref (rapid push series stop stacking). Grouped by ref so
# a tag run (refs/tags/v*) gets its own group and is never cancelled by a branch push - the publish leg
# (tags only) is safe.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]   # all four packages share one version + tag line
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # manual re-trigger (e.g. after a self-hosted runner change) without a dummy commit

jobs:
  # Runs on GitHub-hosted x64 ubuntu, NOT the self-hosted arm64 container. The engine test suite needs
  # x64-only native deps (notably libveldrid-spirv, which the Veldrid.SPIRV package ships for linux-x64
  # but NOT linux-arm64 - the SPIRV shader-source tests DllNotFound on the arm64 fleet). That constraint
  # is about the natives, not about cost, so it outlived the repo going public: the arm64 fleet still
  # cannot run this suite. Cost is no longer a factor either way, because a public repo's GitHub-hosted
  # standard runners are free. Every leg of cross-platform-gpu.yml is hosted now too, Metal included.
  build-test-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # nuget.config's github source reads this; CI uses the workflow token.
      GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # fetch-depth: 0 (full history) is required by the selective path: scripts/ci-selective-test.sh
        # diffs the base sha against head, and both must be present locally, which the default depth-1
        # shallow clone does not guarantee. Cost is a slower checkout. The tag/dispatch full runs pay it
        # too but do not use the diff, and a missing base just falls the script back to a FULL run.
        with:
          fetch-depth: 0
      # The three whole-tree convention guards, run unconditionally: every event, both paths, before the
      # dotnet setup below and outside ci-selective-test.sh's docs-only skip (a docs-only push is exactly
      # when the dash and prose guards matter most). They are seconds-fast text sweeps over tracked files,
      # so there is nothing to gate them on. .githooks/pre-commit covers the cheaper STAGED legs at commit
      # time, calling scripts/check-prose.sh for prose and scanning the staged diff for dashes with its own
      # inline grep (it never invokes check-dashes.sh). Tree mode is what catches a commit that bypassed
      # the hook (--no-verify, another IDE, the GitHub web UI), which no staged leg can see. Each script
      # exits 1 on a violation and 0 clean, so the default bash -e shell fails the job on the first one.
      # Both ratchets, though, exit 0 with only a stderr notice when their baseline file is missing, which
      # is right for propagating this step into a repo that has not adopted them and wrong here, where a
      # deleted baseline would silently disarm the gate rather than fail it. The two test -f lines assert
      # the baselines exist before either ratchet runs.
      # check-file-size.sh --tree earns its place next to the compile-time KESIZE analyzer because the
      # analyzer only sees what the compiler sees, and the selective path builds a slice of the solution:
      # growth in an unaffected project would otherwise reach main uninspected. Mirrors the five game
      # repos' "Repo convention checks" step in build-test.yml (issue #554).
      - name: Repo convention checks (dash ban + prose ratchet + file-size ratchet)
        run: |
          test -f .prose-baseline
          test -f .filesize-baseline
          sh scripts/check-dashes.sh --tree
          sh scripts/check-prose.sh --tree
          sh scripts/check-file-size.sh --tree
      # Fail fast if the docs' "current version" declarations drifted from Directory.Build.props. Runs
      # on every event, both paths, so a selective docs-only push is still guarded.
      - name: Check doc version consistency
        run: ./scripts/check-doc-versions.sh
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      # local-feed is git-ignored (dev inner-loop); create it so the nuget.config 'local' source resolves.
      - run: mkdir -p local-feed

      # --- Selective path: push (main) and pull_request. Builds and tests only the affected slice. ---
      # BASE is github.event.before for pushes and the PR base sha for PRs. HEAD is github.sha (for a PR
      # that is the merge commit, which is what we want to test: the code as it would land on main).
      - name: Selective build + test (push and PR)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') || github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: scripts/ci-selective-test.sh "$BASE" "$HEAD"

      # --- Full path: tag pushes (refs/tags/v*) and workflow_dispatch. Gates every release. ---
      - name: Restore (full)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: dotnet restore
      - name: Build (full)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: dotnet build -c Release --no-restore
      # Exclude live-socket smokes (real UDP, fixed port) from CI: they are a manual/local smoke, covered
      # headlessly by LoopbackTransport. Run them locally with the full (unfiltered) test command.
      - name: Test (full)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: dotnet test -c Release --no-build --filter "Category!=LiveSocket"
      # Determinism guard: the FP-scope tests must stay byte-identical under both JIT tiering modes.
      # (The default run above covers ambient tiering. These pin the two extremes explicitly.) The
      # DeterministicFp tests live in KhaozEngine.Foundation.Tests, and the fan-out tests that prove the
      # scope is actually ENTERED on a scheduler worker (issue #197) live in KhaozEngine.Server.Tests,
      # so the pass is scoped to those two projects.
      - name: Determinism under JIT tiering 0 and 1 (full)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          for tc in 0 1; do
            echo "DOTNET_TieredCompilation=$tc"
            DOTNET_TieredCompilation=$tc dotnet test KhaozEngine.Foundation.Tests/KhaozEngine.Foundation.Tests.csproj -c Release --no-build \
              --filter "FullyQualifiedName~DeterministicFp"
            DOTNET_TieredCompilation=$tc dotnet test KhaozEngine.Server.Tests/KhaozEngine.Server.Tests.csproj -c Release --no-build \
              --filter "FullyQualifiedName~FannedOutDeterminism"
          done
      - name: Pack (full)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: dotnet pack -c Release -o ./artifacts --no-build
      - name: Publish to GitHub Packages (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        # Pushes all packed packages. --skip-duplicate means only newly-versioned ones actually publish,
        # and makes each retry below safe to repeat. --timeout 1200 plus 3 attempts (60s apart) ride
        # out GitHub Packages upload slowness during degradations, instead of failing partway through
        # the ~68 packages on the default 300s per-push timeout.
        run: |
          for attempt in 1 2 3; do
            if dotnet nuget push "./artifacts/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate --timeout 1200; then
              exit 0
            fi
            echo "push attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          exit 1
