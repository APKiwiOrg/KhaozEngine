name: native-map-fixture-windows-proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa-r1-windows-fixtures-proof
  cancel-in-progress: false

jobs:
  native-fixtures-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify fixture source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor 75801a6dda6661c9e645a5929534190b780e90cf HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code 75801a6dda6661c9e645a5929534190b780e90cf HEAD -- . ':(exclude).github/workflows/ci.yml'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD
          git rev-parse HEAD^
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: MapDoc fixture cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force local-feed | Out-Null
          dotnet test KhaozEngine.MapDoc.Tests/KhaozEngine.MapDoc.Tests.csproj -c Release --filter 'FullyQualifiedName~KhaozEngine.Tests.MapDoc.NativeStorageNamespaceTests' --logger 'trx;LogFileName=mapdoc.trx' --results-directory TestResults/MapDoc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$result = Get-Content TestResults/MapDoc/mapdoc.trx
          $counts = $result.TestRun.ResultSummary.Counters
          if ([int]$counts.total -ne 22 -or [int]$counts.executed -ne 22 -or [int]$counts.passed -ne 22 -or [int]$counts.failed -ne 0) {
            throw 'MapDoc fixture count or outcome mismatch'
          }
      - name: MapEditor fixture cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test KhaozEngine.MapEditor.Tests/KhaozEngine.MapEditor.Tests.csproj -c Release --filter 'FullyQualifiedName~KhaozEngine.Tests.MapDoc.NativeLifecycleTests|FullyQualifiedName~KhaozEngine.Tests.MapDoc.NativeStorageOwnershipTests|FullyQualifiedName~KhaozEngine.Tests.MapDoc.NativeManifestAdapterTests' --logger 'trx;LogFileName=mapeditor.trx' --results-directory TestResults/MapEditor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$result = Get-Content TestResults/MapEditor/mapeditor.trx
          $counts = $result.TestRun.ResultSummary.Counters
          if ([int]$counts.total -ne 29 -or [int]$counts.executed -ne 29 -or [int]$counts.passed -ne 29 -or [int]$counts.failed -ne 0) {
            throw 'MapEditor fixture count or outcome mismatch'
          }
      - name: Retain finite proof results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-map-fixture-windows-trx
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7
