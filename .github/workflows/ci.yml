name: ci
# Paths split by event (see docs/design/CI-SELECTIVE-TESTS-DESIGN-2026-07-18.md, Decisions 4, 5 and 7):
#   * workflow_dispatch runs the FULL sequence inline: restore, build, full test, determinism double-pass,
#     pack, plus the three SQL Server jobs. A dispatch on main at the release commit is the hosted
#     pre-tag gate. It never publishes and never reuses anything.
#   * Tag pushes (refs/tags/v*) first ask scripts/ci-prior-gate.sh (the prior-gate job) for a successful
#     workflow_dispatch run of this file at the tag's exact commit. Found: restore, build, pack and
#     publish, skipping the full test, the determinism pass and the SQL Server jobs that run already
#     proved, and the run cites that run's URL. Not found, or any doubt (API error, pagination gap, a
#     response outside the query): the full sequence plus publish, as a dispatch runs it. Reuse cannot
#     chain, because only workflow_dispatch runs qualify and a dispatch always runs everything.
#   * Push (main) and pull_request run scripts/ci-selective-test.sh, which builds and tests only the
#     slice the diff affects (empty on a docs-only push). No pack or publish on this path.
# Cancel a superseded in-flight run on the SAME ref (rapid push series stop stacking). Grouped by ref so
# a tag run (refs/tags/v*) gets its own group and is never cancelled by a branch push - the publish leg
# (tags only) is safe.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]   # all four packages share one version + tag line
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # manual re-trigger (e.g. to check a hosted runner image update) without a dummy commit

jobs:
  # The tag run's reuse decision, made once so every job below reads the same answer. Only tags and
  # dispatches run it. On a dispatch it is report-only (--report-only always outputs reuse=false), which
  # proves the real API query without changing what the gate runs. Its own job, so actions: read lands
  # nowhere near the publish token. A usage error (exit 2) is a wiring bug and fails the job loudly, which
  # the pre-tag dispatch catches first. The jobs below run with !cancelled(), so a failed or skipped
  # prior-gate leaves them on the full path, never on reuse.
  prior-gate:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.lookup.outputs.reuse }}
      run_url: ${{ steps.lookup.outputs.run_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci-prior-gate.sh
          sparse-checkout-cone-mode: false
      - name: Look for a successful hosted gate at this commit
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            sh scripts/ci-prior-gate.sh --report-only "$GITHUB_SHA" || rc=$?
          else
            sh scripts/ci-prior-gate.sh "$GITHUB_SHA" || rc=$?
          fi
          [ "$rc" -le 1 ]

  # Runs on GitHub-hosted x64 ubuntu, NOT the self-hosted arm64 container. The engine test suite needs
  # x64-only native deps (notably libveldrid-spirv, which the Veldrid.SPIRV package ships for linux-x64
  # but NOT linux-arm64 - the SPIRV shader-source tests DllNotFound on the arm64 fleet). That constraint
  # is about the natives, not about cost, so it outlived the repo going public: the arm64 fleet still
  # cannot run this suite. Cost is no longer a factor either way, because a public repo's GitHub-hosted
  # standard runners are free. Every leg of cross-platform-gpu.yml is hosted now too, Metal included.
  build-test-pack:
    needs: prior-gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      # nuget.config's github source reads this; CI uses the workflow token.
      GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}
      # 'true' only on a v* tag whose commit already passed the hosted gate (see prior-gate above).
      REUSED_GATE: ${{ startsWith(github.ref, 'refs/tags/v') && needs.prior-gate.outputs.reuse == 'true' }}
      REUSED_GATE_URL: ${{ needs.prior-gate.outputs.run_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # fetch-depth: 0 (full history) is required by the selective path: scripts/ci-selective-test.sh
        # diffs the base sha against head, and both must be present locally, which the default depth-1
        # shallow clone does not guarantee. Cost is a slower checkout. The tag/dispatch full runs pay it
        # too but do not use the diff, and a missing base just falls the script back to a FULL run.
        with:
          fetch-depth: 0
      # The whole-tree convention guards, run unconditionally: every event, both paths, before the
      # dotnet setup below and outside ci-selective-test.sh's docs-only skip (a docs-only push is exactly
      # when the dash and prose guards matter most). They are seconds-fast text sweeps over tracked files,
      # so there is nothing to gate them on. .githooks/pre-commit covers the cheaper STAGED legs at commit
      # time, calling the staged modes of the same scripts. Tree mode is what catches a commit that bypassed
      # the hook (--no-verify, another IDE, the GitHub web UI), which no staged leg can see. Each script
      # exits 1 on a violation and 0 clean, so the default bash -e shell fails the job on the first one.
      # Both ratchets, though, exit 0 with only a stderr notice when their baseline file is missing, which
      # is right for propagating this step into a repo that has not adopted them and wrong here, where a
      # deleted baseline would silently disarm the gate rather than fail it. The two test -f lines assert
      # the baselines exist before either ratchet runs.
      # check-file-size.sh --tree earns its place next to the compile-time KESIZE analyzer because the
      # analyzer only sees what the compiler sees, and the selective path builds a slice of the solution:
      # growth in an unaffected project would otherwise reach main uninspected. Mirrors the game repos'
      # "Repo convention checks" step in build-test.yml (issue #554).
      - name: Repo convention checks (dash ban + prose ratchet + file-size ratchet + instruction budget + scratch check + home paths)
        run: |
          test -f .prose-baseline
          test -f .filesize-baseline
          sh scripts/check-dashes.sh --tree
          sh scripts/check-prose.sh --tree
          sh scripts/check-home-paths.sh --tree
          sh scripts/tests/check-home-paths.test.sh
          sh scripts/check-file-size.sh --tree
          sh scripts/check-agent-instructions.sh --tree
          sh scripts/check-scratch.sh --tree
          sh scripts/tests/check-scratch.test.sh
      # Fail fast if the docs' "current version" declarations drifted from Directory.Build.props. Runs
      # on every event, both paths, so a selective docs-only push is still guarded.
      - name: Check doc version consistency
        run: ./scripts/check-doc-versions.sh
      - name: Agent hook and instruction tests
        run: |
          sh scripts/tests/check-agent-instructions.test.sh
          sh scripts/tests/ci-prior-gate.test.sh
          sh scripts/tests/build-release-tests.test.sh
          sh scripts/tests/gpu-test-shards.test.sh
          sh scripts/tests/hooks-file-change-guard.test.sh
          sh scripts/tests/hooks-filesize-guard.test.sh
          sh scripts/tests/pack-local-feed.test.sh
          sh scripts/tests/release-lock.test.sh
          sh scripts/tests/tag-collision-guard.test.sh
          sh scripts/tests/version-push-guard.test.sh
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # local-feed is git-ignored (dev inner-loop); create it so the nuget.config 'local' source resolves.
      - run: mkdir -p local-feed

      # --- Selective path: push (main) and pull_request. Builds and tests only the affected slice. ---
      # BASE is github.event.before for pushes and the PR base sha for PRs. HEAD is github.sha (for a PR
      # that is the merge commit, which is what we want to test: the code as it would land on main).
      - name: Selective build + test (push and PR)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') || github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: scripts/ci-selective-test.sh "$BASE" "$HEAD"

      # --- Full path: tag pushes (refs/tags/v*) and workflow_dispatch. Gates every release. ---
      # A tag that reuses the hosted gate still restores, builds and packs here, and skips only the
      # full test and the determinism pass, which the reused dispatch ran over the same commit.
      - name: Restore (full)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: dotnet restore
      - name: Build (full)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: sh scripts/build-release-tests.sh KhaozEngine.slnx --no-restore
      # Exclude live-socket smokes (real UDP, fixed port) from CI: they are a manual/local smoke, covered
      # headlessly by LoopbackTransport. Run them locally with the full (unfiltered) test command.
      - name: Test (full)
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.REUSED_GATE != 'true'
        run: dotnet test -c Release --no-build --filter "Category!=LiveSocket"
      # Determinism guard: the FP-scope tests must stay byte-identical under both JIT tiering modes.
      # (The default run above covers ambient tiering. These pin the two extremes explicitly.) The
      # DeterministicFp tests live in KhaozEngine.Foundation.Tests, and the fan-out tests that prove the
      # scope is actually ENTERED on a scheduler worker (issue #197) live in KhaozEngine.Server.Tests,
      # so the pass is scoped to those two projects.
      - name: Determinism under JIT tiering 0 and 1 (full)
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.REUSED_GATE != 'true'
        run: |
          for tc in 0 1; do
            echo "DOTNET_TieredCompilation=$tc"
            DOTNET_TieredCompilation=$tc dotnet test KhaozEngine.Foundation.Tests/KhaozEngine.Foundation.Tests.csproj -c Release --no-build \
              --filter "FullyQualifiedName~DeterministicFp"
            DOTNET_TieredCompilation=$tc dotnet test KhaozEngine.Server.Tests/KhaozEngine.Server.Tests.csproj -c Release --no-build \
              --filter "FullyQualifiedName~FannedOutDeterminism"
          done
      - name: Reused hosted gate (tags only)
        if: env.REUSED_GATE == 'true'
        run: echo "Full test and determinism pass skipped, both passed in the hosted gate $REUSED_GATE_URL at $GITHUB_SHA"
      - name: Pack (full)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: dotnet pack -c Release -o ./artifacts --no-build
      - name: Publish to GitHub Packages (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        # Pushes all packed packages. --skip-duplicate means only newly-versioned ones actually publish,
        # and makes each retry below safe to repeat. --timeout 1200 plus 3 attempts (60s apart) ride
        # out GitHub Packages upload slowness during degradations, instead of failing partway through
        # the ~68 packages on the default 300s per-push timeout.
        run: |
          for attempt in 1 2 3; do
            if dotnet nuget push "./artifacts/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate --timeout 1200; then
              exit 0
            fi
            echo "push attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          exit 1

  # The content catalog's SQL Server facts, against a real SQL Server. Without KE_CATALOG_SQLSERVER every one
  # of them SKIPS, so the build-test-pack job above proves nothing about KhaozEngine.Catalog.SqlServer: before
  # this job they ran only through a manual leg against a cloud database. The fixture drops every catalog_
  # table it finds, so it insists on "-catalog-test-" in the database name. About two minutes of tests.
  # Manual dispatch always runs it, and so does a tag unless it reuses the hosted gate (prior-gate above),
  # whose dispatch ran these facts at the same commit. A push or a pull request runs it only when the diff
  # touches the catalog, the shared SQLite or server test projects, or this workflow. It is its own job rather
  # than a step above because it needs the service container, and it does not gate the publish leg: a red run
  # here on a tag is a release to pull, which is the same standing the cross-platform GPU matrix has.
  catalog-sqlserver:
    needs: prior-gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          # This credential belongs only to the disposable CI service, never a deployed database.
          MSSQL_SA_PASSWORD: 'KhaozEngine_CI_Catalog_41!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'KhaozEngine_CI_Catalog_41!' -C -b -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}
      KE_CATALOG_SQLSERVER: 'Server=127.0.0.1,1433;Initial Catalog=khaoz-catalog-test-ci;User ID=sa;Password=KhaozEngine_CI_Catalog_41!;Encrypt=True;TrustServerCertificate=True'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the catalog is affected
        id: affected
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REUSED_GATE: ${{ startsWith(github.ref, 'refs/tags/v') && needs.prior-gate.outputs.reuse == 'true' }}
          REUSED_GATE_URL: ${{ needs.prior-gate.outputs.run_url }}
        run: |
          run=false
          case "$REF" in refs/tags/v*) run=true ;; esac
          [ "$EVENT" = workflow_dispatch ] && run=true
          if [ "$run" = false ]; then
            # A missing or all-zero base (first push of a branch) cannot be diffed, so it runs.
            if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              run=true
            elif git diff --name-only "$BASE" "$HEAD" | grep -Eq '^(KhaozEngine\.Catalog[^/]*/|KhaozEngine\.Sqlite/|KhaozEngine\.Server\.Tests/|Directory\.Packages\.props|\.github/workflows/ci\.yml)'; then
              run=true
            fi
          fi
          # A tag whose commit passed the hosted gate skips: that dispatch ran these facts at this commit.
          if [ "$REUSED_GATE" = true ]; then
            run=false
            echo "catalog-sqlserver: reusing the hosted gate $REUSED_GATE_URL"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "catalog-sqlserver: run=$run"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.affected.outputs.run == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Create the marked test database
        if: steps.affected.outputs.run == 'true'
        run: |
          docker exec "${{ job.services.sqlserver.id }}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
            -P 'KhaozEngine_CI_Catalog_41!' -C -b -Q "CREATE DATABASE [khaoz-catalog-test-ci]"
      - name: Build the server tests
        if: steps.affected.outputs.run == 'true'
        run: |
          mkdir -p local-feed
          dotnet build KhaozEngine.Server.Tests/KhaozEngine.Server.Tests.csproj -c Release
      # A run that SKIPS is a run that proved nothing, which is the failure this job exists to end. So the
      # step fails unless every fact EXECUTED. The counter to read is executed against total: a skipped
      # xunit fact leaves notExecuted at 0, so that attribute cannot tell a full run from an empty one.
      - name: Catalog facts against SQL Server
        if: steps.affected.outputs.run == 'true'
        run: |
          dotnet test KhaozEngine.Server.Tests/KhaozEngine.Server.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~KhaozEngine.Tests.Catalog" \
            --logger "trx;LogFileName=catalog-sqlserver.trx" --results-directory "$RUNNER_TEMP/catalog"
          trx="$RUNNER_TEMP/catalog/catalog-sqlserver.trx"
          total=$(grep -o '<Counters [^/]*' "$trx" | head -1 | grep -o ' total="[0-9]*"' | grep -o '[0-9]*')
          executed=$(grep -o '<Counters [^/]*' "$trx" | head -1 | grep -o ' executed="[0-9]*"' | grep -o '[0-9]*')
          echo "catalog facts: executed ${executed:-unknown} of ${total:-unknown}"
          test -n "$total" && test "$total" -gt 0 && test "$executed" = "$total"

  # The account store's SQL Server facts (the shared conformance suite and the Grimhollow layout fixtures),
  # against a real SQL Server. Without KE_ACCOUNTS_SQLSERVER every one of them SKIPS, so build-test-pack proves
  # nothing about KhaozEngine.Accounts.SqlServer. The fixtures create and drop their own tables, so they insist on
  # "-accounts-test-" in the database name. The service's default collation is case-insensitive, which is the
  # deployment the subject column's binary collation exists for. Same gating and standing as catalog-sqlserver:
  # manual dispatch always runs it, a tag unless it reuses the hosted gate, a push or a pull request only when
  # the diff touches the account packages, the package pins or this workflow, and it does not gate the publish
  # leg.
  accounts-sqlserver:
    needs: prior-gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          # This credential belongs only to the disposable CI service, never a deployed database.
          MSSQL_SA_PASSWORD: 'KhaozEngine_CI_Accounts_41!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'KhaozEngine_CI_Accounts_41!' -C -b -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}
      KE_ACCOUNTS_SQLSERVER: 'Server=127.0.0.1,1433;Initial Catalog=khaoz-accounts-test-ci;User ID=sa;Password=KhaozEngine_CI_Accounts_41!;Encrypt=True;TrustServerCertificate=True'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the account store is affected
        id: affected
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REUSED_GATE: ${{ startsWith(github.ref, 'refs/tags/v') && needs.prior-gate.outputs.reuse == 'true' }}
          REUSED_GATE_URL: ${{ needs.prior-gate.outputs.run_url }}
        run: |
          run=false
          case "$REF" in refs/tags/v*) run=true ;; esac
          [ "$EVENT" = workflow_dispatch ] && run=true
          if [ "$run" = false ]; then
            # A missing or all-zero base (first push of a branch) cannot be diffed, so it runs.
            if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              run=true
            elif git diff --name-only "$BASE" "$HEAD" | grep -Eq '^(KhaozEngine\.Accounts[^/]*/|Directory\.Packages\.props|\.github/workflows/ci\.yml)'; then
              run=true
            fi
          fi
          # A tag whose commit passed the hosted gate skips: that dispatch ran these facts at this commit.
          if [ "$REUSED_GATE" = true ]; then
            run=false
            echo "accounts-sqlserver: reusing the hosted gate $REUSED_GATE_URL"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "accounts-sqlserver: run=$run"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.affected.outputs.run == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Create the marked test database
        if: steps.affected.outputs.run == 'true'
        run: |
          docker exec "${{ job.services.sqlserver.id }}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
            -P 'KhaozEngine_CI_Accounts_41!' -C -b -Q "CREATE DATABASE [khaoz-accounts-test-ci]"
      - name: Build the account tests
        if: steps.affected.outputs.run == 'true'
        run: |
          mkdir -p local-feed
          dotnet build KhaozEngine.Accounts.Tests/KhaozEngine.Accounts.Tests.csproj -c Release
      # A run that SKIPS proved nothing, so the step fails unless every selected fact EXECUTED, read from the
      # executed and total counters as catalog-sqlserver reads them.
      - name: Account store facts against SQL Server
        if: steps.affected.outputs.run == 'true'
        run: |
          dotnet test KhaozEngine.Accounts.Tests/KhaozEngine.Accounts.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~KhaozEngine.Tests.Accounts.SqlServer" \
            --logger "trx;LogFileName=accounts-sqlserver.trx" --results-directory "$RUNNER_TEMP/accounts"
          trx="$RUNNER_TEMP/accounts/accounts-sqlserver.trx"
          total=$(grep -o '<Counters [^/]*' "$trx" | head -1 | grep -o ' total="[0-9]*"' | grep -o '[0-9]*')
          executed=$(grep -o '<Counters [^/]*' "$trx" | head -1 | grep -o ' executed="[0-9]*"' | grep -o '[0-9]*')
          echo "account facts: executed ${executed:-unknown} of ${total:-unknown}"
          test -n "$total" && test "$total" -gt 0 && test "$executed" = "$total"

  # The mutation journal, world store and commerce SQL Server facts, against a real SQL Server. Without
  # KE_SQLSERVER_TEST_CONNSTRING and KE_COMMERCE_SQLSERVER every one of them SKIPS, so build-test-pack proves
  # nothing about KhaozEngine.WorldStore.SqlServer or KhaozEngine.Commerce.SqlServer. The journal facts reset the
  # whole journal and rotate database-global state, so they insist on "-journal-test-" in the database name, and
  # the world store conformance shares that database. The commerce facts get a database of their own, and the one
  # that rebuilds the wallet tables insists on "-commerce-test-" in its name. The service's default collation is
  # case-insensitive, which is the deployment the wallet's pinned column collation exists for. Same gating and
  # standing as catalog-sqlserver: manual dispatch always runs it, a tag unless it reuses the hosted gate, a push
  # or a pull request only when the diff touches the world store or commerce packages, their server tests, the
  # package pins or this workflow, and it does not gate the publish leg.
  server-sqlserver:
    needs: prior-gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          # This credential belongs only to the disposable CI service, never a deployed database.
          MSSQL_SA_PASSWORD: 'KhaozEngine_CI_Server_41!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'KhaozEngine_CI_Server_41!' -C -b -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}
      KE_SQLSERVER_TEST_CONNSTRING: 'Server=127.0.0.1,1433;Initial Catalog=khaoz-journal-test-ci;User ID=sa;Password=KhaozEngine_CI_Server_41!;Encrypt=True;TrustServerCertificate=True'
      KE_COMMERCE_SQLSERVER: 'Server=127.0.0.1,1433;Initial Catalog=khaoz-commerce-test-ci;User ID=sa;Password=KhaozEngine_CI_Server_41!;Encrypt=True;TrustServerCertificate=True'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the world store or commerce is affected
        id: affected
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REUSED_GATE: ${{ startsWith(github.ref, 'refs/tags/v') && needs.prior-gate.outputs.reuse == 'true' }}
          REUSED_GATE_URL: ${{ needs.prior-gate.outputs.run_url }}
        run: |
          run=false
          case "$REF" in refs/tags/v*) run=true ;; esac
          [ "$EVENT" = workflow_dispatch ] && run=true
          if [ "$run" = false ]; then
            # A missing or all-zero base (first push of a branch) cannot be diffed, so it runs.
            if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              run=true
            elif git diff --name-only "$BASE" "$HEAD" | grep -Eq '^(KhaozEngine\.WorldStore[^/]*/|KhaozEngine\.Commerce[^/]*/|KhaozEngine\.Server\.Tests/(WorldStore|Commerce)/|Directory\.Packages\.props|\.github/workflows/ci\.yml)'; then
              run=true
            fi
          fi
          # A tag whose commit passed the hosted gate skips: that dispatch ran these facts at this commit.
          if [ "$REUSED_GATE" = true ]; then
            run=false
            echo "server-sqlserver: reusing the hosted gate $REUSED_GATE_URL"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "server-sqlserver: run=$run"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.affected.outputs.run == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Create the marked test databases
        if: steps.affected.outputs.run == 'true'
        run: |
          for db in khaoz-journal-test-ci khaoz-commerce-test-ci; do
            docker exec "${{ job.services.sqlserver.id }}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
              -P 'KhaozEngine_CI_Server_41!' -C -b -Q "CREATE DATABASE [$db]"
          done
      - name: Build the server tests
        if: steps.affected.outputs.run == 'true'
        run: |
          mkdir -p local-feed
          dotnet build KhaozEngine.Server.Tests/KhaozEngine.Server.Tests.csproj -c Release
      # A run that SKIPS proved nothing, so the step fails unless every selected fact EXECUTED, read from the
      # executed and total counters as catalog-sqlserver reads them. The filter takes the whole world store
      # namespace rather than a class list, because several journal classes carry SQL Server facts beside
      # in-process ones, and those execute too. The commerce half is the SqlServer classes alone.
      - name: Journal, world store and commerce facts against SQL Server
        if: steps.affected.outputs.run == 'true'
        run: |
          dotnet test KhaozEngine.Server.Tests/KhaozEngine.Server.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~KhaozEngine.Tests.WorldStore|FullyQualifiedName~KhaozEngine.Tests.Commerce.SqlServer" \
            --logger "trx;LogFileName=server-sqlserver.trx" --results-directory "$RUNNER_TEMP/server"
          trx="$RUNNER_TEMP/server/server-sqlserver.trx"
          total=$(grep -o '<Counters [^/]*' "$trx" | head -1 | grep -o ' total="[0-9]*"' | grep -o '[0-9]*')
          executed=$(grep -o '<Counters [^/]*' "$trx" | head -1 | grep -o ' executed="[0-9]*"' | grep -o '[0-9]*')
          echo "server facts: executed ${executed:-unknown} of ${total:-unknown}"
          test -n "$total" && test "$total" -gt 0 && test "$executed" = "$total"
