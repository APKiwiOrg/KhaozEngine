name: ci
# Cancel a superseded in-flight run on the SAME ref (rapid push series stop stacking). Grouped by ref so
# a tag run (refs/tags/v*) gets its own group and is never cancelled by a branch push - the publish leg
# (tags only) is safe.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]   # all four packages share one version + tag line
  pull_request:
    branches: [ main ]

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # nuget.config's github source reads this; CI uses the workflow token.
      GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Fail fast if the docs' "current version" declarations drifted from Directory.Build.props.
      - name: Check doc version consistency
        run: ./scripts/check-doc-versions.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # local-feed is git-ignored (dev inner-loop); create it so the nuget.config 'local' source resolves.
      - run: mkdir -p local-feed
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      # Exclude live-socket smokes (real UDP, fixed port) from CI: they are a manual/local smoke, covered
      # headlessly by LoopbackTransport. Run them locally with the full (unfiltered) test command.
      - run: dotnet test -c Release --no-build --filter "Category!=LiveSocket"
      # Determinism guard: the FP-scope tests must stay byte-identical under both JIT tiering modes.
      # (The default run above covers ambient tiering; these pin the two extremes explicitly.)
      - name: Determinism under JIT tiering 0 and 1
        run: |
          for tc in 0 1; do
            echo "DOTNET_TieredCompilation=$tc"
            DOTNET_TieredCompilation=$tc dotnet test -c Release --no-build \
              --filter "FullyQualifiedName~DeterministicFp"
          done
      - run: dotnet pack -c Release -o ./artifacts --no-build
      - name: Publish to GitHub Packages (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        # Pushes all packed packages; --skip-duplicate means only newly-versioned ones actually publish.
        run: dotnet nuget push "./artifacts/*.nupkg" --source "https://nuget.pkg.github.com/APKiwi/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
