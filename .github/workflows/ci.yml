name: support-cost-windows-proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: support-cost-windows-proof
  cancel-in-progress: false

jobs:
  support-cost-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify support cost source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "HEAD=$head"
          Write-Host 'BASE=0898a431058bb3d998f2c65daddf6512c01fb3e3'
          git merge-base --is-ancestor 0898a431058bb3d998f2c65daddf6512c01fb3e3 HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code 0898a431058bb3d998f2c65daddf6512c01fb3e3 HEAD -- . ':(exclude).github/workflows/ci.yml'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: SupportCostArtifact cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force local-feed | Out-Null
          dotnet test KhaozEngine.Game.Tests/KhaozEngine.Game.Tests.csproj -c Release --filter 'FullyQualifiedName~SupportCostArtifact' --logger 'trx;LogFileName=support-cost.trx' --results-directory TestResults/SupportCost
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$result = Get-Content TestResults/SupportCost/support-cost.trx
          $counts = $result.TestRun.ResultSummary.Counters
          if ([int]$counts.total -ne 25 -or [int]$counts.executed -ne 25 -or [int]$counts.passed -ne 25 -or [int]$counts.failed -ne 0) {
            throw 'SupportCostArtifact count or outcome mismatch'
          }
      - name: Retain support cost proof results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: support-cost-windows-trx
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7
