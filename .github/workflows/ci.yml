name: Isolated point shadow seam evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-point-shadow-seam-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seam:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CODE_SHA: be72718673d79d83d34d3467a262e95bbe845151
      TEST_PROJECT: KhaozEngine.Render.Tests/KhaozEngine.Render.Tests.csproj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify isolated source and reserve fresh evidence directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'Unexpected proof HEAD' }
          $parents = ((git rev-list --parents -n 1 HEAD).Trim() -split ' ')
          if ($LASTEXITCODE -ne 0 -or $parents.Count -ne 2 -or $parents[1] -cne $env:CODE_SHA) { throw 'Proof must have exactly the approved code commit as parent' }
          $changed = @(git diff --name-only --no-renames $env:CODE_SHA HEAD)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/ci.yml') { throw 'Proof source differs outside ci.yml' }
          $dirty = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) { throw 'Proof checkout is dirty' }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read proof tree' }
          $path = Join-Path $env:RUNNER_TEMP ('point-shadow-seam-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '-' + [Guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $path) { throw 'Evidence directory already exists' }
          New-Item -ItemType Directory -Path $path | Out-Null
          foreach ($name in @('point-shadow-seam.json', 'point-shadow-seam.plain.rgba', 'point-shadow-seam.soft.rgba')) {
            if (Test-Path -LiteralPath (Join-Path $path $name)) { throw 'Evidence file already exists' }
          }
          "SEAM_EVIDENCE_DIR=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SEAM_PROOF_TREE=$tree" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Verified code $($env:CODE_SHA), proof $head, tree $tree" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Restore and compile the one affected project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path local-feed | Out-Null
          dotnet restore $env:TEST_PROJECT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $env:TEST_PROJECT -c Release --no-restore -m:1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dirty = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) { throw 'Build changed tracked source' }
      - name: Run the single unchanged WARP probe
        id: probe
        continue-on-error: true
        shell: pwsh
        env:
          KE_GPU_TESTS: '1'
          KE_GRAPHICS_BACKEND: direct3d11-native
          KE_D3D11_ADAPTER: warp
          KE_POINT_SHADOW_SEAM_EVIDENCE_DIR: ${{ env.SEAM_EVIDENCE_DIR }}
          KE_POINT_SHADOW_SEAM_SOURCE_COMMIT: ${{ github.sha }}
          KE_POINT_SHADOW_SEAM_SOURCE_TREE: ${{ env.SEAM_PROOF_TREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (@(Get-ChildItem Env: | Where-Object { $_.Name -like 'KE_UPDATE_*' }).Count -ne 0) { throw 'Update or bake environment is forbidden' }
          dotnet test $env:TEST_PROJECT -c Release --no-build --no-restore --filter 'FullyQualifiedName=KhaozEngine.Tests.Gpu.PointShadowFilterGpuTests.TheSoftEdgeCrossesACubeFaceBoundaryWithoutAStep' --results-directory TestResults --logger 'trx;LogFileName=seam.trx' --logger 'console;verbosity=detailed'
          exit $LASTEXITCODE
      - name: Verify one executed probe and complete evidence separately
        if: always()
        shell: pwsh
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$trx = Get-Content -Raw -LiteralPath TestResults/seam.trx
          $ns = [System.Xml.XmlNamespaceManager]::new($trx.NameTable)
          $ns.AddNamespace('t', 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
          $c = $trx.SelectSingleNode('//t:ResultSummary/t:Counters', $ns)
          $rows = @($trx.SelectNodes('//t:UnitTestResult', $ns))
          if ($null -eq $c -or [int]$c.total -ne 1 -or [int]$c.executed -ne 1 -or [int]$c.notExecuted -ne 0 -or $rows.Count -ne 1) { throw 'Expected exactly one executed probe and zero skips' }
          $row = $rows[0]
          if ($row.testName -cne 'KhaozEngine.Tests.Gpu.PointShadowFilterGpuTests.TheSoftEdgeCrossesACubeFaceBoundaryWithoutAStep') { throw 'Unexpected test result' }
          "Assertion verdict from TRX: $($row.outcome)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $m = Get-Content -Raw -LiteralPath (Join-Path $env:SEAM_EVIDENCE_DIR 'point-shadow-seam.json') | ConvertFrom-Json
          if ($m.schema -cne 'khaozengine.point-shadow-seam-evidence' -or $m.schemaVersion -ne 1 -or $m.status -cne 'complete') { throw 'Evidence is missing, incomplete or wrong schema' }
          if ($m.device.backend -cne 'Direct3D11Native' -or $m.device.softwareAdapter -ne $true -or $null -ne $m.device.deviceLossReason) { throw 'Expected a healthy native D3D11 software adapter' }
          if ($m.provenance.sourceCommit -cne $env:GITHUB_SHA -or $m.provenance.sourceTree -cne $env:SEAM_PROOF_TREE -or $m.provenance.revisionAgreement -cne 'agree') { throw 'Built provenance mismatch' }
          if ($m.grid.stations -ne 13 -or $m.grid.probesPerStation -ne 61 -or $m.recordedProbes -ne 793 -or @($m.stations).Count -ne 13) { throw 'Incomplete sample grid' }
          for ($s = 0; $s -lt 13; $s++) {
            if ($m.stations[$s].index -ne $s -or @($m.stations[$s].probes).Count -ne 61) { throw 'Wrong station shape' }
            for ($i = 0; $i -lt 61; $i++) {
              if ($null -eq $m.stations[$s].probes[$i] -or $m.stations[$s].probes[$i].index -ne $i) { throw 'Missing or misplaced probe' }
            }
          }
          if (@($m.fit.residuals).Count -ne 13 -or @($m.captures).Count -ne 2) { throw 'Incomplete fit or captures' }
          $expectedFiles = @('point-shadow-seam.plain.rgba', 'point-shadow-seam.soft.rgba')
          for ($i = 0; $i -lt 2; $i++) {
            $capture = $m.captures[$i]
            if ($capture.file -cne $expectedFiles[$i] -or $capture.width -ne 192 -or $capture.height -ne 192 -or $capture.bytes -ne 147456) { throw 'Unexpected capture declaration' }
            $file = Join-Path $env:SEAM_EVIDENCE_DIR $capture.file
            if ((Get-Item -LiteralPath $file).Length -ne 147456) { throw 'Wrong capture length' }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            if ($hash -cne $capture.sha256) { throw 'Capture digest mismatch' }
          }
          "Evidence verdict: complete. Bump $($m.statistic.bump), outside residual $($m.statistic.worstElsewhere). Device bytecode is not recorded." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($row.outcome -cne 'Passed' -or [int]$c.passed -ne 1 -or $env:PROBE_OUTCOME -cne 'success') { throw 'Evidence captured, but the original assertion failed. This is not a passing render proof.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: point-shadow-seam-evidence
          path: |
            ${{ env.SEAM_EVIDENCE_DIR }}
            TestResults
          if-no-files-found: warn
          retention-days: 14
