# cross-platform-gpu: desktop GPU test matrix (Win D3D11 incumbent + Win D3D11 native / Linux Vulkan incumbent
# + Linux Vulkan native / macOS Metal incumbent + macOS Metal native), plus one Vulkan
# synchronisation-validation job.
#
# BILLING: this repo is PUBLIC, so GitHub-hosted standard runners are free. ALL FIVE legs run hosted and cost
# nothing, Metal included: it moved to hosted macos-26 (#552), and no leg touches a personal machine any more.
# The suite split that follows was decided when the repo was private and hosted minutes billed
# (Linux 1x, Windows 2x, macOS 10x). It is KEPT on its merits rather than its cost: the golden subset is
# the fast signal a push wants, and the full suite is a slower sweep that belongs on the cron. Read the
# "2x billing" notes below as history explaining how the tiers were chosen, not as a live constraint. If
# a tier is ever revisited, the argument now has to be about feedback speed and lavapipe stability,
# because the money is gone. The engine went public 2026-08-06 after its private CI became the largest
# line on the org's GitHub bill.
#
# What this does (suite split by leg + trigger, decided from measured cost + lavapipe stability):
#   * The Metal leg runs the FULL test suite (every [GpuFact], golden and behavioral, plus the headless
#     suite) on GitHub-hosted macos-26, pinned to the number rather than to macos-latest so an image
#     promotion cannot move the GPU under a golden gate. It used to run on the self-hosted dev Mac, because
#     hosted macos-14 has no usable Metal device at all (#547), and macos-15 and macos-26 both do (#552). It
#     covers pull_request like every other leg now: the exclusion that used to sit here existed only to keep
#     a fork from routing work onto a personal machine, and there is no personal machine in this workflow
#     any more.
#   * The GitHub-hosted Metal NATIVE leg runs the engine's own KhaozEngine.Gpu.Metal backend
#     (KE_GRAPHICS_BACKEND=metal-native) on exactly the incumbent Metal leg's tier, which is the FULL suite on
#     every trigger, on the same hosted macos-26 image (decision M-T6). It is a GUEST in the incumbent's metal
#     golden family exactly as direct3d11-native and vulkan-native are guests in theirs (decision M-I3): it
#     VERIFIES the committed metal grids on the same real GPU and never bakes them, so KE_UPDATE_GOLDENS stays
#     empty on it for every trigger and it sits a bake dispatch out entirely.
#     THIS IS THE STRONGEST REGRESSION NET IN THE PROGRAM, and that is why it takes the expensive tier. The
#     other two native legs run golden-only on push, on software rasterizers, and the Vulkan one has no
#     swapchain coverage at all. This one runs everything, on a real GPU, every time, and the metal family is
#     the fleet's cross-backend reference, so a golden disagreement here is a fleet event rather than a leg
#     event.
#     Three things are its own rather than the incumbent Metal leg's. It sets KE_METAL_REQUIRED=1, because the
#     rows that need a native device go DORMANT when the probe refuses the machine, and a dormant row on the one
#     leg built to run them is a pass that asserted nothing which the zero-skipped criterion of rollout gate 2
#     cannot see (the same lesson as KE_VULKAN_REQUIRED, inherited by name). It arms Metal's TWO validation
#     tiers (decision M-T7), MTL_DEBUG_LAYER=1 on every run because it is an environment variable with no
#     install and no measurable cost at this scale, and MTL_SHADER_VALIDATION=1 on the deep sweep. And it sets
#     MTL_CAPTURE_ENABLED=1 on every trigger EXCEPT the deep sweep, which is the only thing that runs the
#     frame-capture interop end to end: without it Metal refuses the GPU-trace destination and the row asserts
#     that nothing started, with it the capture really starts from the native queue pointer and writes a
#     .gputrace bundle. The inverse trigger is measured, not preferred: a capture cannot share a process with
#     MTL_SHADER_VALIDATION (the manager still reports the destination as supported and startCapture returns
#     false), and the cost that was supposed to keep it off the push path does not exist (4m39s with it against
#     4m37s without, same machine, same commit). Because those two are inverses, the deep tier is a DISPATCH
#     INPUT rather than "any dispatch": every arm this leg has must be reachable on demand, and a dispatch that
#     was always deep could never start a capture. `tier` defaults to deep, so an unattended dispatch and the
#     cron are unchanged.
#     NEITHER METAL TIER IS A SYNCHRONISATION VALIDATOR, and Metal has none at all: MTL_DEBUG_LAYER is API
#     validation and MTL_SHADER_VALIDATION is in-shader bounds checking, and neither tracks read-after-write
#     hazards across encoders. That is the one place this matrix is weaker on the Metal side than on the Vulkan
#     one, and it is stated here rather than left for a reader to conclude that Metal's validation is simply
#     cheaper. It is also why that backend keeps Metal's automatic hazard tracking rather than going untracked.
#     NO ERROR-MODE VARIABLE IS SET, AND THE REASON IS A MEASUREMENT THAT CORRECTS #591. That issue records
#     the host-aborting behaviour as a property of MTL_DEBUG_LAYER_ERROR_MODE=assert, which reads as "do not set
#     it and you are fine". Row 19 measured otherwise: ASSERT IS THE DEFAULT, so plain MTL_DEBUG_LAYER=1 aborted
#     the test host on the first objection and took the run's whole signal with it (5956 of 6039 rows reported,
#     then "Test Run Aborted"). The obvious fix, MTL_DEBUG_LAYER_ERROR_MODE=nslog, was measured too and is
#     REJECTED: it stops the abort and reports nothing at all to the captured stream, not even the layer's own
#     banner, which would leave this leg with a tier that can neither fail nor testify. That is worse than no
#     tier, because the artifact would exist and be empty.
#     So the layer runs at its default and the rows that provoke it on purpose stand down in-process instead,
#     which is #591's own second option and keeps the filter out of this workflow where a filter goes stale.
#     Three rows do that today, each because the thing it does is legitimate in a test and illegitimate in a
#     shipped frame: the row-1 interop spike records offset setters on an encoder with no pipeline bound because
#     it is measuring the objc_msgSend ABI rather than drawing, the validation-reader row cannot tell an
#     in-process variable from a launch one in a process that was launched with it, and MM6's incumbent CONTROL
#     reproduces the Veldrid Metal mis-binding on purpose, which the layer sees as a draw with an unbound
#     fragment buffer. That last one is the layer confirming this program's own finding from outside it.
#   * The GitHub-hosted D3D11 leg (2x billing) runs only the golden tests
#     (FullyQualifiedName~Golden) on push / pull_request, and the FULL suite on the weekly
#     schedule and on workflow_dispatch. Rationale: the full suite on hosted Windows measured
#     17m14s vs the golden-only 7m44s (trial runs 29542939552 / 29545657401), about +19 billed
#     2x minutes per run - too much per-push for this repo's cost posture, so full hosted
#     coverage rides the weekly cron (and any manual dispatch) instead.
#   * The GitHub-hosted D3D11 NATIVE leg (2x billing) runs the engine's own KhaozEngine.Gpu.D3D11
#     backend (KE_GRAPHICS_BACKEND=direct3d11-native) on exactly the incumbent leg's tier: golden
#     tests only on push / pull_request, the FULL suite on the weekly schedule and on
#     workflow_dispatch (decision T5), with one exception: it sits a BAKE dispatch out entirely
#     (the bake note below, and the test step). It is a GUEST in the incumbent's golden family (decision I3):
#     it VERIFIES the committed direct3d11 goldens on the same WARP rasterizer and never bakes them,
#     so KE_UPDATE_GOLDENS stays empty on this leg for every trigger (see the test step). Its golden-only
#     push tier was chosen when this repo was private and Windows billed at 2x, where the leg doubled the
#     D3D11 spend on the gated paths. The repo is public and those minutes are free now, so the tier is
#     kept for feedback speed rather than money.
#   * The GitHub-hosted Vulkan NATIVE leg (1x) runs the engine's own KhaozEngine.Gpu.Vulkan backend
#     (KE_GRAPHICS_BACKEND=vulkan-native) on the incumbent Vulkan leg's tier: golden tests only on
#     push / pull_request, the FULL suite on the weekly schedule and on workflow_dispatch (decision
#     V-T8). It is a GUEST in the incumbent's vulkan golden family exactly as direct3d11-native is a
#     guest in direct3d11's (decision V-T1): it VERIFIES the committed vulkan goldens on the same
#     lavapipe rasterizer and never bakes them, so KE_UPDATE_GOLDENS stays empty on it for every
#     trigger and it sits a bake dispatch out entirely. Two things are its own rather than the D3D11
#     leg's: it sets KE_VULKAN_REQUIRED=1, because the rows that need a native device go DORMANT
#     without one and a dormant row on the one leg built to run them is a pass that asserted nothing,
#     and its scheduled full suite runs under KE_VULKAN_VALIDATION=strict, which is the first
#     validation layer this repo has ever installed anywhere (decision V-T4).
#   * The Vulkan SYNC-VALIDATION job (1x, gpu-vulkan-sync below) is the second validation tier, and it
#     is a separate job rather than a matrix leg because it runs a different suite for a different
#     reason: the golden subset plus the compute suite under KE_VULKAN_VALIDATION=sync, on the
#     schedule and on a non-bake dispatch only. Synchronisation validation tracks every access and is
#     slow, so it buys a subset rather than the serialised full suite. It is the ONE instrument in this
#     net that can see a missing barrier or a wrong image layout, which a software rasterizer executes
#     correctly anyway and which no golden and no core-validation run can catch (decision V-T4, and
#     MV5 and MV6 in the design's section 16 are both read off it).
#   * The GitHub-hosted Vulkan leg (1x) runs only the golden tests on push/pull_request, and the
#     FULL suite on the weekly schedule and on workflow_dispatch, same tier as D3D11. Chasing this
#     leg's full-suite crashes surfaced four real engine defects, all fixed: concurrent device
#     creation racing the Vulkan loader (serialized process-wide in GpuDeviceContext), mid-life
#     resource disposal racing queued async work (drained via WaitForIdle before disposing), and a
#     teardown-order pair where a wrapper outliving its device drained or destroyed against the
#     dead device (latched by a shared DeviceLiveness token). The full PARALLEL suite on lavapipe
#     still exhibits residual driver-side instability with delayed-corruption symptoms (a CoreCLR
#     fatal, deliberately not chased), so the full-suite runs serialize xUnit test collections via
#     KE_TEST_EXTRA_ARGS, one live device at a time (~22 min serialized in the validation container
#     vs minutes parallel). Golden-only runs keep their months-green parallel configuration.
#   * Committed per-backend goldens live at KhaozEngine.Render.Tests/Gpu/goldens/<name>.<backend>.txt.
#     The family in that filename is the GoldenBackendToken, not the leg name, which is how
#     direct3d11-native reads and checks the direct3d11 files instead of owning a family of its own.
#   * All five legs are committed and blocking, and they do not carry the same history. macOS Metal,
#     Windows D3D11 (WARP) and Linux Vulkan (Mesa lavapipe) are long validated, with months of green
#     runs behind them. Windows D3D11 native (WARP, pinned) blocks BY DESIGN rather than by record: it
#     is the native backend's continuous exercise (decision RO3), so it gates from its first run, and
#     its first recorded evidence is rollout gate 1 on issue #460. Linux Vulkan native (lavapipe,
#     pinned) blocks on the same grounds and for the same reason (decision V-RO1), and its first
#     recorded evidence is rollout gate 1 on issue #529.
#   * THE INCUMBENT VULKAN LEG IS DELIBERATELY NOT COUPLED TO THE NATIVE BACKEND'S HEALTH. It installs
#     no validation layer, sets no KE_VULKAN_REQUIRED, and its rows that touch a native device stay
#     dormant if the probe ever refuses the runner. That leg is the escape hatch decision V-RO2 keeps
#     selectable indefinitely, and an escape hatch that goes red whenever the thing it escapes from
#     goes red is not one.
#
# Generating goldens for a NEW scene or backend:
#   1. Run this workflow manually (Actions -> cross-platform-gpu -> Run workflow) with bake = true.
#   2. The bake legs render with KE_UPDATE_GOLDENS=1 and upload the per-backend grids as artifacts
#      named goldens-<backend> (e.g. scene2d.<backend>.txt). NEITHER GUEST LEG IS A BAKE LEG
#      (goldenGuest in the leg table below): direct3d11-native and vulkan-native each share an
#      incumbent's family, so a bake there would overwrite the very references it is being checked
#      against, and GoldenCompare.BakeRefusal makes that a hard test failure by design. On a bake
#      dispatch they skip the test step outright rather than verifying against references being replaced
#      mid-run, and the sync-validation job sits the dispatch out for the same reason.
#   3. Download the artifacts, drop the files into KhaozEngine.Render.Tests/Gpu/goldens/, and commit them.
#   4. After that, the push/PR legs VERIFY those backends, both guest legs included, which checks each
#      freshly baked family against a second implementation on the same rasterizer.
#
# Running the matrix WITHOUT the GPU shader disk caches (#614):
#   Dispatch with disableGpuDiskCache = true. Every leg's test step and the sync job then set all three
#   cache variables to `off`, so no backend reads or writes an entry for the whole run. That is the A/B
#   for a flake that could be a warm cache entry read back wrong: the same commit, cacheless. Every other
#   trigger leaves the variables blank, which is the default location and the shipped behaviour.
#
# Software rasterizers (these runners have no real GPU):
#   * Linux uses Mesa lavapipe (software Vulkan); the workflow discovers the lavapipe ICD manifest at runtime
#     (its name/path drifts across Ubuntu images) and points VK_ICD_FILENAMES/VK_DRIVER_FILES at it. Both
#     Linux legs additionally pin KE_VULKAN_DEVICE=llvmpipe (decision V-G2), for the reason both Windows
#     legs pin their adapter: the loader-level ICD pin has needed repairing before when a runner image
#     moved the manifest, and the incumbent leg creates NATIVE devices too through the capability-parity
#     test, so an unpinned native device there could pick a different physical device from the one the
#     native leg measures. The variable has exactly one reader, the native backend's own physical-device
#     selection, so the Veldrid device is unaffected. Empty on Windows and macOS.
#   * Windows D3D11 falls back to WARP (software) automatically when no hardware adapter is present. Neither
#     Windows leg rides that accident: both pin KE_D3D11_ADAPTER=warp (decision G2), so a runner image that
#     grows a paravirtual adapter cannot silently change the rasterizer under the golden gate. The incumbent
#     leg needs the pin because the parity tests create native devices there too, and the variable is read
#     only by the native backend's adapter selection, so the Veldrid device it also creates is unaffected.
#
# The headless golden tests use Render2D/3D Snapshot -> CreateHeadless (offscreen, NO window), so SDL2 is
# NOT required here (only the Vulkan/D3D11 runtime plus a (software) rasterizer). A shipped windowed game
# still needs SDL2 + libveldrid-spirv bundled per-RID; see docs/CROSS-PLATFORM.md.
#
# The fast inner-loop CI (build/test/pack/publish, GPU tests skipped) stays in ci.yml, untouched.

name: cross-platform-gpu

# The push path filter below was written as cost control, when every leg but Metal billed. On a public repo
# it costs nothing, and it stays because it is also the right behaviour: a matrix that fires on every push
# buries a real golden break in noise, and a docs push has no way to move a rendered pixel. On push it runs
# only when something that can change a GPU golden is touched (rendering stack, the GPU seam, the GPU
# test dir, or this workflow). Docs/netcode/etc. pushes skip it. PRs + manual bake still run as before.
concurrency:
  # Event name folded into the group so a gated push near the weekly cron cannot cancel the
  # weekly full-suite sweep (or vice versa): push and schedule now get separate groups.
  group: cross-platform-gpu-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'KhaozEngine.Render3D/**'
      - 'KhaozEngine.Render2D/**'
      - 'KhaozEngine.Gpu/**'
      # The native Direct3D 11 backend. Its shader path owns the FXC call, so a change here can reject HLSL
      # that SPIRV-Cross emits, or hole a vertex input signature, and the incumbent Windows leg's FXC step
      # below is the only thing that runs a compiler over the shipped programs (decision S5).
      - 'KhaozEngine.Gpu.D3D11/**'
      # The native Vulkan backend, watched for the same reason as its D3D11 sibling above and missed when
      # the package landed after the #198 sweep (#546). A sibling package does NOT ride 'KhaozEngine.Gpu/**':
      # that pattern needs the literal 'KhaozEngine.Gpu/' prefix, which is why D3D11 carries its own entry
      # too. Until this line existed, a push touching only Vulkan sources got no matrix run, and the gap
      # stayed invisible because branch merges bundle Render.Tests changes into the same push.
      - 'KhaozEngine.Gpu.Vulkan/**'
      # The native Metal backend, watched for the same reason as both siblings above and needing its own entry
      # for the same reason vulkan-native did: 'KhaozEngine.Gpu/**' needs the literal prefix and does not match a
      # sibling package. Without this line a push touching only Metal sources would get no matrix run, on the one
      # backend whose leg is the strongest net in the program.
      - 'KhaozEngine.Gpu.Metal/**'
      - 'KhaozEngine.Gui/**'
      - 'KhaozEngine.Primitives/**'
      # Render/runtime stack layer between Gpu and Render2D/Render3D (AppWindow, GLFW). Was never watched (#198).
      - 'KhaozEngine.Windowing/**'
      # 2D game-loop facade (BootScreenRenderer is drawn and captured by KhaozEngine.Render.Tests/Gpu/
      # BootScreenVisualTests.cs) plus its 3D scene adapter. Neither was watched (#198).
      - 'KhaozEngine.Game/**'
      - 'KhaozEngine.Game.Render3D/**'
      # Render-free terrain field (height/biome/noise) and its Render3D mesher. Neither was watched (#198).
      - 'KhaozEngine.Terrain/**'
      - 'KhaozEngine.Terrain.Render3D/**'
      # Render-free deterministic particle sim and its Render3D billboard adapter. Neither was watched (#198).
      - 'KhaozEngine.Particles/**'
      - 'KhaozEngine.Particles.Render3D/**'
      # Render-free telegraph style/resolve core (also draws the 2D path itself) and its Render3D ground
      # path. Neither was watched (#198).
      - 'KhaozEngine.Telegraphs/**'
      - 'KhaozEngine.Telegraphs.Render3D/**'
      # Headless snapshot runner (Shot2D) and its Shot3D extension, both driven end to end by
      # KhaozEngine.Render.Tests/Gpu/SnapshotHarnessGpuTests.cs. Neither was watched (#198).
      - 'KhaozEngine.Snapshot/**'
      - 'KhaozEngine.Snapshot.Render3D/**'
      # Map editor viewport and render tool carry their own [GpuFact] renders, and MapDoc is the document
      # model those renders load. None were watched (#198).
      - 'KhaozEngine.MapEditor/**'
      - 'KhaozEngine.MapEdit.Tool/**'
      - 'KhaozEngine.MapDoc/**'
      # GoldenCompare delegates Downsample/Compare/Serialize entirely to this package, so a bug here can
      # silently flip any golden's pass or fail. Wasn't watched (#198).
      - 'KhaozEngine.Imaging/**'
      # The GPU golden tests, the Imaging GoldenGridTests, and the Render3D/Terrain/ParticlesRender3D
      # [GpuFact] suites all live in Render.Tests now (13.0.3 monolith split), and the committed goldens
      # live under it too, so one whole-project gate covers what used to be five KhaozEngine.Tests/*
      # subdirs (the 10.18.1 LF fix shipped without a matrix run because only Tests/Gpu was watched,
      # hence whole-project gates rather than per-subdir lists).
      - 'KhaozEngine.Render.Tests/**'
      # MapEditor/MapEditTool/MapDoc tests moved here (13.0.3 split) and carry [GpuFact] renders plus the
      # sample document RenderServiceTests and ViewportWorldDisposeOrderGpuTests render (#198).
      - 'KhaozEngine.MapEditor.Tests/**'
      - '.github/workflows/cross-platform-gpu.yml'
  # No paths filter here (deliberate): pull_request already runs on every path unconditionally, a strict
  # superset of the push list above, so it already "agrees" with push and needs no separate #198 fix.
  pull_request:
    branches: [ main ]
  # Weekly full-suite pass on the four scheduled-tier legs, both D3D11 legs and both Vulkan legs (Metal runs the
  # full suite on every trigger anyway). Sunday 18:00 UTC: a quiet slot, and any breakage surfaces before the
  # working week. It is also the trigger that arms both validation tiers.
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      bake:
        description: 'Re-bake the per-backend goldens (KE_UPDATE_GOLDENS=1) and upload them as artifacts'
        type: boolean
        default: false
      # A dispatch runs the FULL suite on every leg, which was the most expensive thing this workflow did
      # while the repo was private: about 87 Windows minutes and 65 Linux minutes per dispatch, roughly
      # $1.26. Most dispatches chase ONE backend and the others buy nothing. The repo is public now so the
      # minutes are free, but the selector stays: a targeted dispatch also finishes far sooner, which is
      # the reason that outlives the billing. Default is 'all' so an unattended dispatch is unchanged.
      # `metal` is just another hosted leg here now that it runs on macos-26, so a metal dispatch carries no
      # machine access with it, and starting any dispatch already needs write access to this repo.
      legs:
        description: 'Which legs to run. Pick one backend when debugging it, "all" for the full matrix.'
        type: choice
        default: all
        options: [all, metal, metal-native, direct3d11, direct3d11-native, vulkan, vulkan-native]
      # WHICH SHAPE A DISPATCH TAKES ON THE metal-native LEG, and it exists because two of that leg's
      # variables are mutually exclusive by measurement: MTL_SHADER_VALIDATION arms on the deep tier and
      # MTL_CAPTURE_ENABLED is its inverse, since a GPU-trace capture cannot start in a process with the shader
      # rung armed. A dispatch used to be unconditionally deep, so the dispatch a human reached for to debug the
      # capture path was the one trigger that disarmed it, which is an instrument nobody can aim.
      # Default is 'deep', so an unattended dispatch still reproduces the weekly sweep exactly as before, and
      # the cron is untouched and always deep. Read by the metal-native leg alone.
      tier:
        description: 'metal-native only: "deep" arms shader validation, "push" arms the frame capture instead.'
        type: choice
        default: deep
        options: [deep, push]
      # THE DISCRIMINATING KNOB FOR #614, and the reason it is an INPUT rather than a branch edit is that the
      # thing it has to split is per-boot. The metal-native leg fails roughly one varying GPU test per boot on
      # the hosted paravirtual adapter, deterministically wrong when it is wrong, and one hypothesis is the
      # shader disk caches: a warm entry read back on an unhealthy boot is a stable wrong answer, where an
      # adapter fault would be expected to vary. Splitting those needs the SAME commit run with the caches off,
      # which a workflow input gives and a code change does not.
      #
      # ALL SIX LEGS, not the metal ones, which is what keeps the A/B honest. The three backends' caches are one
      # mechanism (KhaozEngine.Gpu/Internal/GpuDiskCache), so a dispatch that disabled one leg's cache would
      # compare a cacheless macOS run against cached Windows and Linux runs and could not say whether a
      # difference belonged to the cache or to the leg. Every leg reads the same value from the workflow-level
      # GPU_DISK_CACHE below.
      #
      # Default false, so every unattended dispatch, the cron and every push run exactly as before: blank is the
      # shipped default (the cache in its default location), not a third state.
      disableGpuDiskCache:
        description: 'Run with the GPU shader disk caches OFF on every leg (the #614 cache-vs-adapter split)'
        type: boolean
        default: false

# Least privilege: this workflow only checks out, builds, tests, and uploads run artifacts. No step
# writes back to the repo or publishes a package, so contents: read covers everything it does.
permissions:
  contents: read

# WHAT THE THREE BACKENDS' CACHE VARIABLES READ, as ONE expression, at the WORKFLOW level rather than per job.
# The other shared predicates in this file (VULKAN_VALIDATION_ARMED, METAL_DEEP_TIER) are job-level because
# they read `matrix`, which does not exist above a job. This one reads only the event and the input, and it has
# readers in TWO jobs: the matrix legs' test step and the sync job's. A copy per job is exactly how the pair
# would stop agreeing, and a dispatch where one job still cached would make the run's own name false.
#
# `off` is one of GpuDiskCache.ResolveDirectory's five disable words (off / 0 / false / no / none, trimmed and
# case-insensitive). Anything else is taken as a DIRECTORY PATH verbatim, which is why the disable side has to
# be a word from that set and not, say, an empty path: a typo lands the cache in a directory named after the
# typo and the run reads as cacheless while caching.
#
# EMPTY IS THE SHIPPED DEFAULT AND NOT A THIRD STATE. A blank value resolves to the default location under
# local-app-data exactly as an unset variable does, so every non-dispatch trigger is byte-identical to before
# this input existed.
env:
  GPU_DISK_CACHE: ${{ (github.event_name == 'workflow_dispatch' && inputs.disableGpuDiskCache) && 'off' || '' }}

jobs:
  # Which legs this run uses. This exists as a JOB rather than as a condition because a matrix cannot be
  # filtered by an input any other way: `strategy` is expanded before a job-level `if` is evaluated, and an
  # `if` on the steps would still boot the runner and bill for it. The selection therefore has to arrive as
  # data, which means a job that produces it.
  #
  # The leg table lives here for the same reason. Its per-leg rationale is directly above it, unchanged from
  # when it sat in `strategy.matrix.include`.
  #
  # Cost: one billed Ubuntu minute on every run of this workflow, about $1.30 a month at the August 2026
  # rate, against $5 to $25 a month saved on targeted dispatches. It is the cheapest job in the file by an
  # order of magnitude, and it is what stops the expensive legs from starting at all.
  legs:
    name: select legs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      # Whether this run's selection includes the native Vulkan leg. The sync-validation job below is a
      # SEPARATE job, so it cannot read the matrix the way a matrix leg does, and gating it on the raw
      # JSON with a substring test would tie a job's existence to jq's output formatting. This is the
      # same "selection arrives as data" argument the matrix output is built on.
      vulkan_native: ${{ steps.pick.outputs.vulkan_native }}
    steps:
      - id: pick
        shell: bash
        env:
          # Only a dispatch can choose. Every other trigger gets the whole matrix, as before.
          WANT: ${{ github.event_name == 'workflow_dispatch' && inputs.legs || 'all' }}
        run: |
          set -euo pipefail

          # `fullSuite` picks when a leg runs the whole suite vs the golden subset (see the test step's
          # filter expression, plus the cost + lavapipe-stability rationale in the header):
          #   always    - every trigger (Metal alone, on hosted macos-26)
          #   scheduled - weekly schedule + workflow_dispatch only, which is the other four legs (both D3D11
          #               legs billed 2x and both Vulkan legs 1x while the repo was private, golden subset
          #               only on push/pull_request). Both Vulkan legs' full-suite runs additionally
          #               serialize xUnit collections (KE_TEST_EXTRA_ARGS, header). Every leg is hosted and
          #               free now, so these tiers are kept for feedback speed rather than for money.
          #
          # `d3d11Adapter` is the leg's KE_D3D11_ADAPTER value, and BOTH Windows legs pin it to warp
          # (decision G2). The native leg pins it because it is new and should STATE its rasterizer rather
          # than inherit an accident of the runner image. The incumbent leg pins it because the parity tests
          # create NATIVE devices there too: unpinned, those resolve DriverType.Hardware against whatever
          # adapter the image exposes, so the two Windows legs would exercise different rasterizers for the
          # same native code and a parity difference could be the adapter rather than the implementation.
          # This does NOT touch the Veldrid incumbent device itself, whose selection is unchanged (and with
          # it what the shared goldens are compared against): KE_D3D11_ADAPTER has exactly one reader,
          # D3D11AdapterSelection in the native backend package. Empty on macOS and Linux, where blank reads
          # as "let the API pick".
          #
          # direct3d11-native is the engine's own native D3D11 backend (decision T5). Same OS, same runner
          # and the same suite tier as the incumbent leg, which is the point: two implementations of one API
          # on one rasterizer, checked against a single shared set of goldens (decision I3).
          # METAL RUNS ON HOSTED macos-26, which is `macos-latest` and GA. Pinned to the number, not to
          # `macos-latest`, so a future image promotion cannot silently move the GPU under a golden gate.
          # macos-14 is DEPRECATED by GitHub and is the one image that does not work at all:
          # MTLCreateSystemDefaultDevice() returns nil there even though MTLCopyAllDevices() reports an
          # "Apple Paravirtual device", and that nil is what Veldrid dereferences, which was the whole of the
          # 363-failure run 31091112757. macos-15 and macos-26 both return the device and both run the full
          # suite green (4813 passed / 1 skipped; run 31131019941 is the macos-26 one). Every golden passes on
          # the paravirtual adapter against goldens baked on real Apple silicon, because they are
          # tolerance-based. The single behavioural skip is [GpuFact(RequiresRealGpu)] (#552).
          # Do NOT "fix" a future Metal problem by moving this back to macos-14.
          #
          # This leg used to be self-hosted, and moving it off is a security improvement as much as a convenience:
          # a self-hosted runner was the only reason this PUBLIC repo needed allows_public_repositories on the org
          # runner group, and the only reason a personal machine was reachable from CI at all. With Metal hosted,
          # nothing here touches that machine, so the pull_request exclusion that used to guard it is gone too and
          # Metal covers PRs again.
          # `goldenGuest` says this leg VERIFIES a golden family it does not OWN (decisions I3 and V-T1).
          # Both native legs are guests: direct3d11-native reads the direct3d11 grids and vulkan-native
          # reads the vulkan ones, on the same rasterizer as the incumbent that baked them. It is a leg
          # PROPERTY rather than a name match repeated at each site, because three separate places act on
          # it (KE_UPDATE_GOLDENS is held empty, the test step sits a bake dispatch out, and the baked-
          # goldens upload is skipped) and a fourth would otherwise be easy to forget.
          #
          # `vulkanDevice` is the leg's KE_VULKAN_DEVICE value, pinned on BOTH Linux legs for the reason
          # d3d11Adapter is pinned on both Windows legs, and reaching only the native backend's selection.
          #
          # `vulkanValidation` is the tier this leg's FULL suite gates at, and only the full suite: the
          # push-path golden subset runs with validation off, because that path is the fast signal and
          # the layer is expensive. Empty means the leg installs no layer at all, which is every leg but
          # vulkan-native. `sync`, the second tier, is not a value here: it runs a different SUITE on a
          # different trigger, so it is the separate gpu-vulkan-sync job rather than a third Linux leg.
          # `metal-native` is the engine's own native Metal backend (decision M-T6). Same OS, same runner image
          # and the same `always` tier as the incumbent Metal leg, which is the point for the third time: two
          # implementations of one API on one GPU, checked against a single shared set of goldens (M-I3). It is
          # the only guest leg on the expensive tier, and the reason is in the header: it is the only leg in the
          # program that runs everything on real hardware, and the family it verifies is the fleet's reference.
          # It pins NO device. Both Windows legs pin their adapter and both Linux legs pin their physical device
          # because an unpinned native selection there could land on a different rasterizer from the incumbent's.
          # macOS has no such choice to get wrong: the native backend's default is MTLCreateSystemDefaultDevice()
          # rather than the enumeration's first element, which is the same device the incumbent gets, so a pin
          # would add a name that has to match a runner image and buy nothing. KE_METAL_DEVICE stays unset.
          all='[
            {"os":"macos-26",      "backend":"metal",             "runner":"macos-26",                      "fullSuite":"always",    "d3d11Adapter":"",     "vulkanDevice":"",         "vulkanValidation":"",       "goldenGuest":""},
            {"os":"macos-26",      "backend":"metal-native",      "runner":"macos-26",                      "fullSuite":"always",    "d3d11Adapter":"",     "vulkanDevice":"",         "vulkanValidation":"",       "goldenGuest":"true"},
            {"os":"windows-latest","backend":"direct3d11",        "runner":"windows-latest",                "fullSuite":"scheduled", "d3d11Adapter":"warp", "vulkanDevice":"",         "vulkanValidation":"",       "goldenGuest":""},
            {"os":"windows-latest","backend":"direct3d11-native", "runner":"windows-latest",                "fullSuite":"scheduled", "d3d11Adapter":"warp", "vulkanDevice":"",         "vulkanValidation":"",       "goldenGuest":"true"},
            {"os":"ubuntu-latest", "backend":"vulkan",            "runner":"ubuntu-latest",                 "fullSuite":"scheduled", "d3d11Adapter":"",     "vulkanDevice":"llvmpipe", "vulkanValidation":"",       "goldenGuest":""},
            {"os":"ubuntu-latest", "backend":"vulkan-native",     "runner":"ubuntu-latest",                 "fullSuite":"scheduled", "d3d11Adapter":"",     "vulkanDevice":"llvmpipe", "vulkanValidation":"strict", "goldenGuest":"true"}
          ]'

          if [ "$WANT" = all ]; then
            picked=$(jq -c '.' <<<"$all")
          else
            picked=$(jq -c --arg b "$WANT" '[.[] | select(.backend == $b)]' <<<"$all")
            # An empty selection would silently pass the whole workflow with nothing tested, which reads as
            # green. Fail loudly instead: the only way here is a typo in the choice list above.
            [ "$(jq 'length' <<<"$picked")" -gt 0 ] || { echo "::error::no leg matches '$WANT'"; exit 1; }
          fi

          echo "selected legs: $(jq -r '[.[].backend] | join(", ")' <<<"$picked")"
          echo "matrix={\"include\":$picked}" >> "$GITHUB_OUTPUT"
          echo "vulkan_native=$(jq -r 'any(.[]; .backend == "vulkan-native")' <<<"$picked")" >> "$GITHUB_OUTPUT"

  gpu-golden:
    needs: legs
    name: ${{ matrix.os }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.runner }}
    # All five legs are blocking, with no continue-on-error on any of them. Three are long validated: Metal
    # (macOS), Direct3D11 (Windows/WARP) and Vulkan (Linux/Mesa lavapipe). The two guest legs, Direct3D11Native
    # (Windows/WARP) and VulkanNative (Linux/lavapipe), each verify the incumbent's committed goldens on the
    # incumbent's own rasterizer and never bake them, and each blocks by design rather than by record: a native
    # backend's CI leg is its continuous exercise (decisions RO3 and V-RO1), so it gates from its first run.
    # Their first recorded evidence is rollout gate 1 on issues #460 and #529 respectively.
    # Goldens are tolerance-based (32x18 averaged grid), robust to software-rasterizer noise. If
    # the lavapipe leg ever flakes on a runner-image change, re-add
    # `continue-on-error: ${{ matrix.backend == 'vulkan' }}` here to drop it back to informational.
    #
    # Runner split: every leg that runs is GitHub-hosted, and free, because the repo is public. Both D3D11
    # legs and Vulkan are software rasterizers and were always hosted, so the visibility flip cost them
    # nothing. Metal was the one leg that needed real hardware, and it is absent (see the leg table).
    # The suite tiers (native leg golden-only on push, decision T5) were chosen against 2x Windows billing
    # and are kept for feedback speed.
    # The matrix keys stay on `os` (drives the OS-specific setup steps + the leg name); `runner` picks where.
    strategy:
      fail-fast: false
      # Built by the `legs` job above, which is also where the leg table and its per-leg rationale live.
      # The shape is unchanged: one combination per leg, carrying os / backend / runner / fullSuite /
      # d3d11Adapter / vulkanDevice / vulkanValidation / goldenGuest exactly as a static `include` list would.
      matrix: ${{ fromJSON(needs.legs.outputs.matrix) }}
    env:
      # WHETHER THIS RUN ACTUALLY ARMS A VALIDATION TIER, as ONE expression with three readers, for the reason
      # `goldenGuest` is a leg property rather than a name match repeated per site. Two conditions have to hold
      # together and they come from different places: the leg must HAVE a tier (matrix.vulkanValidation, which
      # is vulkan-native alone) and this trigger must be one that runs the FULL suite, because the push-path
      # golden subset deliberately runs with validation off.
      #
      # SPLITTING THEM IS THE BUG THIS REPLACES. The layer install used to be gated on the leg column alone, so
      # a push run installed the package and hard-failed on a manifest problem while validating nothing, which
      # is a gate that can only ever produce false failures, and the artifact named for the strict tier was
      # uploaded on the push path too, carrying a log taken with validation off. Empty means no tier is armed
      # on this run, and every reader below tests for that rather than re-deriving it.
      #
      # The one run where this is armed with no suite behind it is a BAKE dispatch, where the guest leg skips
      # its test step. Keeping the predicate identical to the variable's is worth more than shaving that case:
      # the install and the thing it exists to serve cannot drift apart if they are the same expression.
      VULKAN_VALIDATION_ARMED: ${{ (matrix.fullSuite == 'always' || (matrix.fullSuite == 'scheduled' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) && matrix.vulkanValidation || '' }}
      # WHETHER THIS RUN ARMS METAL'S DEEP TIER, as ONE expression with three readers, for the reason the Vulkan
      # variable above is one expression with three: the shader-validation variable, the capture variable and the
      # artifact NAME all have to agree, and a copy per site is how they stop agreeing.
      #
      # The leg's suite tier cannot express it, which is the one structural difference from the Vulkan side. That
      # leg is `fullSuite: scheduled`, so "the deep tier" and "the full suite" are the same condition there. This
      # leg is `fullSuite: always`, so every trigger already runs the whole suite and the deep tier has to be its
      # own predicate: MTL_DEBUG_LAYER is free enough to arm on every run, and shader validation and an armed
      # capture are not.
      #
      # SCHEDULE OR DISPATCH, which is one deliberate departure from the design's "on the scheduled run". A tier
      # that can only ever be started by the cron takes its first run unattended at 18:00 on a Sunday and cannot
      # be re-run against a fix without waiting a week, and an instrument nobody can aim is not one. That is the
      # same departure the Vulkan sync job already documents and takes. A bake dispatch never reaches the test
      # step on this leg anyway (guest), so it needs no arm of its own here.
      #
      # AND THE SAME PRINCIPLE POINTED AT THE OTHER VARIABLE, which is what the `tier` input is for. The capture
      # is this tier's INVERSE, so "every dispatch is deep" made the one trigger a human can start the one
      # trigger that cannot start a capture, and the capture path was reachable on demand nowhere. A dispatch
      # picks now, defaulting to deep so an unattended one is unchanged. The cron has no input and stays deep,
      # which is where the expensive sweep belongs.
      METAL_DEEP_TIER: ${{ (matrix.backend == 'metal-native' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier != 'push'))) && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      # local-feed is git-ignored (dev inner-loop); create it so the nuget.config 'local' source resolves.
      - run: mkdir -p local-feed
        shell: bash

      - run: dotnet restore

      - run: dotnet build -c Release --no-restore

      # Linux: install Mesa lavapipe (software Vulkan) + the loader. The lavapipe ICD manifest's path/name
      # drifts across Ubuntu runner images, so DISCOVER it rather than hardcoding (the old hardcoded
      # /usr/share/vulkan/icd.d/lvp_icd.x86_64.json went missing and gave "Found no drivers!"). Dump what the
      # package shipped so a future drift is diagnosable from the log.
      - name: Install software Vulkan (lavapipe)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
          echo "--- mesa-vulkan-drivers contents (icd / lvp / .so) ---"
          dpkg -L mesa-vulkan-drivers 2>/dev/null | grep -Ei 'icd|lvp|\.so' || true
          echo "--- ICD manifests on disk ---"
          ls -la /usr/share/vulkan/icd.d/ /etc/vulkan/icd.d/ 2>/dev/null || true

      - name: Point Vulkan loader at lavapipe
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -x
          icd=$(find /usr /etc -name 'lvp_icd*.json' 2>/dev/null | head -1)
          if [ -z "$icd" ]; then
            echo "::error::lavapipe ICD manifest not found after installing mesa-vulkan-drivers"
            find /usr /etc -name '*_icd*.json' 2>/dev/null || true
            exit 1
          fi
          echo "lavapipe ICD: $icd"; cat "$icd" || true
          # VK_ICD_FILENAMES (loader < 1.3.207) + VK_DRIVER_FILES (newer loaders); set both for safety.
          { echo "VK_ICD_FILENAMES=$icd"; echo "VK_DRIVER_FILES=$icd"; } >> "$GITHUB_ENV"

      # THE VALIDATION LAYER IS AN INSTALL, NOT A KNOB, and this step is the first one this repo has ever had
      # (decision V-T4). Before it, `VK_LAYER`, `VK_INSTANCE_LAYERS` and `vulkan-validationlayers` had zero hits
      # across every workflow, script and source file, and the Vulkan legs' own layer enumeration listed three
      # Mesa and Intel layers with no Khronos validation among them. `VK_EXT_debug_utils` is an instance
      # EXTENSION, so the messenger the engine pumps through needs no install, but the LAYER cannot be turned on
      # with an environment variable.
      #
      # ONLY ON A RUN THAT ARMS A TIER, which is the leg column AND the trigger together (the
      # VULKAN_VALIDATION_ARMED job env above, and the same value the test step passes as
      # KE_VULKAN_VALIDATION). Gating on the leg column alone was wrong in both directions on the push path: it
      # installed an apt package a golden-subset run has no use for, and it ran the hard manifest check below
      # against a run that would not have validated anything even with the layer present, so the only outcome
      # it could produce there was a false failure. The incumbent Vulkan leg never installs the layer on any
      # trigger: that leg is the indefinitely-selectable escape hatch of decision V-RO2, and adding a new apt
      # package to it would let a package rename on a future runner image redden the very leg the native
      # backend escapes to.
      #
      # THE MANIFEST CHECK IS THE POINT OF THE STEP, not a nicety, and it stays HARD on the armed runs. A
      # missing layer does not fail anything by itself: the engine WARNs, names what to install, and creates
      # the device without it, which is right on a developer box and is a silently vacuous gate here. #423
      # records a push-triggered golden gate degrading for weeks with nobody noticing, and a validation gate
      # that quietly stops validating is that failure with no pixels to eventually give it away.
      - name: Install the Khronos validation layer (Linux)
        if: matrix.os == 'ubuntu-latest' && env.VULKAN_VALIDATION_ARMED != ''
        run: |
          set -x
          sudo apt-get install -y vulkan-validationlayers
          echo "--- layer manifests on disk ---"
          ls -la /usr/share/vulkan/explicit_layer.d/ /etc/vulkan/explicit_layer.d/ 2>/dev/null || true
          layer=$(grep -rl VK_LAYER_KHRONOS_validation /usr/share/vulkan /etc/vulkan 2>/dev/null | head -1)
          if [ -z "$layer" ]; then
            echo "::error::VK_LAYER_KHRONOS_validation is not on this runner after installing vulkan-validationlayers, so KE_VULKAN_VALIDATION would warn and run without it, and this leg's validation gate would pass while validating nothing"
            exit 1
          fi
          echo "Khronos validation layer manifest: $layer"

      # Veldrid 4.9.0's Vulkan binding P/Invokes the bare names "libdl" and "libvulkan"; modern Ubuntu only
      # ships the versioned libdl.so.2 / libvulkan.so.1 (no -dev unversioned symlink), so the device init
      # throws DllNotFoundException before any rendering. Provide the unversioned symlinks the loader expects.
      #
      # BOTH LINUX LEGS, AND IT IS NOT DEAD ON THE NATIVE ONE. Silk.NET resolves through its own native-context
      # search and needs no symlink, which makes this step look like the incumbent's alone. It is not: the
      # capability-parity test creates a VELDRID Vulkan device beside the native one, on whichever leg it runs,
      # so removing this step from the native leg breaks that test at device creation with a DllNotFoundException
      # that reads as a mystery rather than as a deleted workaround. The step retires with the Veldrid Vulkan leg
      # itself, in phase 4 and not before: https://github.com/APKiwiOrg/KhaozEngine/issues/540
      - name: Symlink libdl / libvulkan for Veldrid (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -x
          libdir=/usr/lib/x86_64-linux-gnu
          dl=$(ldconfig -p | awk '/libdl\.so\.2/ {print $NF; exit}')
          vk=$(ldconfig -p | awk '/libvulkan\.so\.1/ {print $NF; exit}')
          [ -n "$dl" ] && sudo ln -sf "$dl" "$libdir/libdl.so" || echo "WARN: libdl.so.2 not found"
          [ -n "$vk" ] && sudo ln -sf "$vk" "$libdir/libvulkan.so" || echo "WARN: libvulkan.so.1 not found"
          ls -l "$libdir/libdl.so" "$libdir/libvulkan.so" 2>/dev/null || true

      # No --summary, deliberately (decision V-D7 of docs/design/VULKAN-NATIVE-BACKEND-DESIGN-2026-08-05.md).
      # The summary prints the driver and the API version and NO device limits at all, so no Vulkan device limit
      # has ever been observable anywhere in this repo, and every limit that design touches rests on a spec
      # minimum plus an assumption (MV10). The full dump lands the whole VkPhysicalDeviceLimits block in every
      # Vulkan leg log instead. The step is already continue-on-error, so the cost is log volume. The observed
      # lavapipe values get recorded once a run has them: https://github.com/APKiwiOrg/KhaozEngine/issues/541
      #
      # It is teed to a FILE as well as to the log, and uploaded below, because the recording is the whole point
      # of the change and a job log is not a workable source for it: the limits block is thousands of lines deep
      # in a run that also holds a full test suite, log retention is shorter than artifact retention, and the
      # numbers have to be quotable verbatim into section 2.1 of the design. `continue-on-error` stays, so a
      # runner without vulkaninfo costs an empty file rather than a red leg.
      - name: Vulkan diagnostics
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p vulkan-diagnostics
          vulkaninfo 2>&1 | tee vulkan-diagnostics/vulkaninfo.${{ matrix.backend }}.txt || true

      # MV10's evidence, uploaded on always() for the reason the golden deltas are: a limit this design spends
      # is read off a GREEN run, and a failure-only artifact could only ever show it after something broke.
      # Kilobytes of text. ignore = no spurious failure on a leg that never ran the step.
      - name: Upload Vulkan device limits
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vulkan-device-limits-${{ matrix.backend }}
          path: vulkan-diagnostics/vulkaninfo.*.txt
          if-no-files-found: ignore

      # DECISION S5's CI leg, one Windows leg only and on EVERY trigger. These are plain [Fact]s with no device: they
      # cross-compile every shipped shader program to HLSL and run FXC over the result, then assert the reflected
      # vertex input signature has contiguous TEXCOORD indices from 0. FXC is d3dcompiler, so Windows is the only
      # OS that can run it, and this step is the only thing in CI that compiles the HLSL the engine actually emits.
      #
      # It is a SEPARATE step rather than part of the suite run below, because the Windows legs' push-path filter
      # is "FullyQualifiedName~Golden" and that family is device-backed pixel comparisons. Naming these tests
      # "Golden" to get them selected would put a CPU compile inside it. Selecting them by name here keeps the
      # naming contract intact and runs them on push, not only on the weekly schedule.
      #
      # No KE_GPU_TESTS and no backend selection: nothing here creates a device. Cheap enough (seconds) that it
      # runs before the suite, so a rejected shader fails fast instead of after a full golden pass.
      #
      # ZERO MATCHES MUST FAIL. A filter that matches nothing still exits 0, and those four cases early-return
      # PASSED on every non-Windows leg, so this step is the only place they have teeth: a class rename would
      # disarm the FXC coverage permanently and every leg would stay green.
      # `RunConfiguration.TreatNoTestsAsError` is what turns a zero match into a failure, and BOTH details of how
      # it is passed here were measured rather than assumed (SDK 10.0.302, Microsoft.NET.Test.Sdk 17.11.1).
      # It is a runsettings argument, not the documented `-p:VSTestTreatNoTestsAsError=true` MSBuild property,
      # because that property is a no-op on this stack: a run with zero matches still exits 0 with it set, over
      # one project or over the solution, so it reads as a fix while changing nothing.
      # And it is scoped to the ONE test project that owns these tests, because run over the whole solution the
      # setting fails on each of the other 17 test projects, where matching zero is the correct outcome.
      - name: Shader FXC validation (no device)
        # ONE Windows leg, not every Windows leg. Nothing here creates a device or selects a backend, so the
        # compile is device-free and backend-independent and one Windows leg suffices: the native leg would run
        # byte-identical work for zero added coverage at the Windows 2x rate. Pinned to the incumbent leg rather
        # than to matrix.os for that reason.
        # The pin key `matrix.backend == 'direct3d11'` is LOAD-BEARING. Rename or retire that leg and this step
        # silently stops running, with nothing failing anywhere: the TreatNoTestsAsError guard below catches a
        # test-class rename, not a matrix-key rename.
        if: matrix.backend == 'direct3d11'
        run: dotnet test KhaozEngine.Render.Tests/KhaozEngine.Render.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~D3D11FxcValidationTests" -- RunConfiguration.TreatNoTestsAsError=true
        shell: bash

      # Suite selection per leg + trigger (the cost + stability split in the header):
      #   * fullSuite: always (Metal): the FULL suite on every trigger - "Category!=LiveSocket",
      #     mirroring ci.yml's exclusion (LiveSocket needs a live network peer, not available here).
      #   * fullSuite: scheduled (both D3D11 legs, Vulkan): golden tests only on push/PR
      #     ("FullyQualifiedName~Golden"), the FULL suite on schedule + workflow_dispatch. D3D11: full hosted
      #     Windows measured +19 billed 2x minutes per run vs golden-only (17m14s vs 7m44s, runs
      #     29542939552 / 29545657401), so per-push hosted coverage stays golden-only and the weekly cron
      #     carries the full sweep. The native leg takes that same tier for the same reason, at the same 2x
      #     rate (decision T5). Both Vulkan legs: the same tier again, and their full-suite runs serialize xUnit
      #     test collections (KE_TEST_EXTRA_ARGS below) because lavapipe under full parallel load still shows
      #     residual driver-side instability after the four engine-defect fixes (see the header). The native
      #     Vulkan leg inherits that serialisation on day one rather than claiming to have fixed it, and MV7 is
      #     the experiment that takes it off that leg alone if four green weeks plus one unserialized dispatch
      #     ever earn it.
      #
      # SKIPPED ON EITHER GUEST LEG for a bake dispatch. A bake dispatch is a bake operation: the three owning
      # legs rewrite their goldens on that run, and a guest can contribute nothing to it. Running would
      # verify the full suite against references that are being replaced mid-run, so a bake that adds a scene or
      # moves a grid reds the guest leg on a missing-golden or changed-golden Assert.Fail that says nothing
      # about the native backend. It sits the dispatch out and verifies the new goldens on the next push.
      - name: Run test suite
        if: ${{ !(matrix.goldenGuest == 'true' && github.event_name == 'workflow_dispatch' && inputs.bake) }}
        env:
          KE_GPU_TESTS: '1'
          KE_GRAPHICS_BACKEND: ${{ matrix.backend }}
          # Both Windows legs pin the adapter (decision G2, matrix comment above), because both create native
          # devices: the incumbent leg does it through the parity tests. Empty on macOS and Linux, and blank is
          # parsed as "let DXGI pick". Read only by the native backend, so no Veldrid device sees it.
          KE_D3D11_ADAPTER: ${{ matrix.d3d11Adapter }}
          # Both Linux legs pin the physical device (decision V-G2, matrix comment above), because both create
          # native Vulkan devices: the incumbent leg does it through the capability-parity test. Empty on Windows
          # and macOS. Read only by the native backend's selection, so no Veldrid device sees it.
          KE_VULKAN_DEVICE: ${{ matrix.vulkanDevice }}
          # ONLY THE LEG BUILT TO HAVE A NATIVE VULKAN DEVICE DECLARES ONE MANDATORY. Every row that needs one
          # asks VulkanDormancy.NativeDeviceAvailable and returns early when the functional probe refuses the
          # machine, which is right on a developer box and on every leg but this one. On THIS leg that early
          # return is a test that asserted nothing and reported green, and the zero-skipped criterion of rollout
          # gate 2 cannot see it, because a dormant row does not skip. With the variable set the helper THROWS
          # instead, naming what VulkanSupportProbe.MissingRequirement objected to, so a loader or driver
          # regression reds the leg. Unset everywhere else, which is what keeps the incumbent leg and every
          # developer box dormant exactly as before.
          KE_VULKAN_REQUIRED: ${{ (matrix.backend == 'vulkan-native') && '1' || '' }}
          # THE SAME DECISION ON THE THIRD BACKEND, and the same reason (decision M-T6, phase 3's row-19 lesson
          # inherited by name). Every Metal row that needs a native device routes its dormancy through
          # MetalDormancy, whether through NativeDeviceAvailable or through the inline copy of the same pair some
          # of them carry, and returns early when the machine cannot provide one, which is right on a Windows box,
          # on a Linux box and on the incumbent Metal leg. On THIS leg that early return is a test that asserted nothing and
          # reported green. With the variable set the helper THROWS instead, naming what the machine objected to
          # in the probe's own words, so a runner-image regression that took the Metal device away reds the leg
          # rather than quietly emptying the rows it was built for.
          #
          # AND IT IS UNSET ON THE INCUMBENT METAL LEG, deliberately, exactly as KE_VULKAN_REQUIRED is unset on
          # the incumbent Vulkan leg. That leg is the escape hatch decision M-RO2 keeps selectable until the
          # closing act, and an escape hatch that goes red whenever the thing it escapes from goes red is not one.
          KE_METAL_REQUIRED: ${{ (matrix.backend == 'metal-native') && '1' || '' }}
          # TIER ONE OF METAL'S VALIDATION GATE (decision M-T7): API validation, on EVERY run of the native Metal
          # leg. It is an environment variable with no install, no apt package and no manifest to check, which is
          # what makes "every run" affordable here where the Vulkan layer's cost bought it a weekly slot. The
          # Metal runtime reads it before the first device exists, which is why it is set as a job variable
          # rather than through the engine's own KE_METAL_VALIDATION knob: that knob REPORTS which tier is really
          # armed and warns when a process asked for one it cannot have, and this is what actually arms it.
          MTL_DEBUG_LAYER: ${{ (matrix.backend == 'metal-native') && '1' || '' }}
          # TIER TWO (decision M-T7): in-shader bounds checking, on the deep sweep only. It instruments every
          # shader, so it is the expensive half, and a broad sweep is worth its cost once a week the same way the
          # Vulkan strict tier is. The predicate lives once, in the METAL_DEEP_TIER job env above.
          MTL_SHADER_VALIDATION: ${{ env.METAL_DEEP_TIER }}
          # NOT A VALIDATION TIER, and its trigger is the INVERSE of tier two's, which is a measurement rather
          # than a preference. Metal refuses a GPU-trace capture destination in a process that did not have this
          # set at launch, so without it MetalFrameCaptureTests asserts only that an unarmed process refuses, and
          # with it the capture really starts from the native queue pointer and writes a .gputrace bundle the row
          # asserts and deletes. That is the one thing in the net that exercises the capture interop end to end.
          #
          # TWO MEASUREMENTS PUT IT HERE RATHER THAN ON THE DEEP SWEEP. First, it CANNOT share a process with
          # MTL_SHADER_VALIDATION: with the shader rung armed, MTLCaptureManager still reports the GPU-trace
          # destination as supported and startCapture returns false, so the capture arm would fail on a platform
          # fact. With MTL_DEBUG_LAYER alone, or with neither, it starts and writes. Second, the reason it was
          # originally proposed for the scheduled sweep alone was cost, and there is none to speak of: the full
          # assembly runs 4m39s with it against 4m37s without, on the same machine and commit. So it rides EVERY
          # trigger, which is strictly more coverage than the design asked for, and stands aside on the one
          # trigger that arms the rung it cannot live with.
          MTL_CAPTURE_ENABLED: ${{ (matrix.backend == 'metal-native' && env.METAL_DEEP_TIER == '') && '1' || '' }}
          # TIER ONE OF THE VALIDATION GATE (decision V-T4): core validation, error severity fails the leg at a
          # controlled point rather than inside the driver callback. On the FULL suite only, which is the same
          # schedule-and-dispatch condition KE_TEST_FILTER selects on below: the push path is the fast signal and
          # the layer is expensive, and a broad sweep is worth its cost once a week. Warning and performance
          # severities are logged, never failed, because a performance warning is an opinion. Tier two is `sync`,
          # in the gpu-vulkan-sync job, and it does NOT latch, so that job carries its own log scan instead.
          #
          # The predicate lives once, in the VULKAN_VALIDATION_ARMED job env above, because the layer install
          # and the strict-tier artifact upload have to agree with this variable exactly and a copy per site is
          # how they stopped agreeing. Empty means no tier is armed on this run.
          KE_VULKAN_VALIDATION: ${{ env.VULKAN_VALIDATION_ARMED }}
          # WHAT PUTS THE ENGINE'S OWN VALIDATION LINES IN THE ARTIFACT (#565), and it takes both halves. The
          # test host configures a console sink when KE_VULKAN_VALIDATION arms a rung (see
          # KhaozEngine.Render.Tests/Gpu/VulkanValidationConsoleLogging.cs), which is the half that gives the
          # pump somewhere to write at all: the ambient Log facade hands out a no-op logger until something
          # calls Log.Configure, and nothing in that process ever did, so every warning-severity message the
          # tiers exist to surface was dropped. THIS is the other half. vstest forwards the test host's stdout
          # only at detailed console verbosity, so at the default the sink writes into a stream the runner
          # discards and the artifact is empty for a second, entirely separate reason. Detailed verbosity also
          # prints one `Passed <TestName>` line per test, which is what makes the interleaving this artifact is
          # for real rather than described.
          #
          # ARMED RUNS ONLY, so the push path's log keeps its current size and shape. The `;` inside the value
          # survives the unquoted expansion below: bash word-splits an expansion, it does not re-parse shell
          # metacharacters in it.
          #
          # The scope is the Vulkan backend's own log categories, not the whole engine. The Khronos layer's own
          # output is independent of all of this and lands in the log whether or not the sink was configured.
          KE_TEST_LOGGER_ARGS: ${{ env.VULKAN_VALIDATION_ARMED != '' && '--logger console;verbosity=detailed' || '' }}
          # THE THREE SHADER DISK CACHES, ALL FROM ONE VALUE (#614). Blank on every ordinary trigger, which is
          # the shipped default location, and `off` on a dispatch that asked for it. Each variable belongs to one
          # backend and is inert on the other two legs, so setting all three on every leg costs nothing and is
          # what makes the cacheless dispatch uniform: KE_METAL_MSL_CACHE is MetalMslCache's, KE_D3D11_SHADER_CACHE
          # is D3D11DxbcCache's and KE_VULKAN_PIPELINE_CACHE is VulkanPipelineCacheFile's, and all three resolve
          # through GpuDiskCache, which is where the disable words live.
          KE_METAL_MSL_CACHE: ${{ env.GPU_DISK_CACHE }}
          KE_D3D11_SHADER_CACHE: ${{ env.GPU_DISK_CACHE }}
          KE_VULKAN_PIPELINE_CACHE: ${{ env.GPU_DISK_CACHE }}
          # EMPTY ON EITHER GUEST LEG for every trigger, bake dispatches included (decisions I3 and V-T1). A guest
          # leg verifies a golden family it does not own, so GoldenCompare.BakeRefusal turns KE_UPDATE_GOLDENS=1
          # under its token into a hard failure BY DESIGN: baking there would overwrite the very references it is
          # checked against, and the owning backend's with them. Without this guard a routine bake dispatch for
          # some unrelated new scene would turn a guest leg red with 36 refusals. Bake on the incumbent leg,
          # the guest then verifies what it wrote. With the step condition above a guest leg no longer
          # reaches a bake dispatch at all, so this stays as belt and braces: it keeps the guarantee true for any
          # future trigger that does reach the run with bake set.
          KE_UPDATE_GOLDENS: ${{ (matrix.goldenGuest != 'true' && github.event_name == 'workflow_dispatch' && inputs.bake) && '1' || '' }}
          KE_TEST_FILTER: ${{ (matrix.fullSuite == 'always' || (matrix.fullSuite == 'scheduled' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) && 'Category!=LiveSocket' || 'FullyQualifiedName~Golden' }}
          # BOTH Vulkan legs' full-suite runs: serialize xUnit collections, one live device at a time
          # (~22 min serialized vs minutes parallel, header). Empty for every other leg and for
          # golden-only runs (months of parallel green history). The two legs are named separately rather
          # than matched on a prefix because MV7 takes serialisation off the NATIVE leg alone if it wins,
          # and the incumbent keeps it either way: that bet says nothing about the incumbent.
          KE_TEST_EXTRA_ARGS: ${{ ((matrix.backend == 'vulkan' || matrix.backend == 'vulkan-native') && matrix.fullSuite == 'scheduled' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && '-- xUnit.ParallelizeTestCollections=false' || '' }}
        # Plain --blame (no --blame-crash) is kept permanently: it only writes a tiny Sequence.xml naming the
        # last-started test if the host dies (no dump utility attached, no measurable overhead), and a lavapipe
        # native crash without it is unattributable - an unnamed crash on the unattended weekly cron would cost
        # a full diagnostic re-run. The 200MB dump collection (--blame-crash) stays off.
        #
        # TEED TO A FILE because validation messages arrive as ordinary log lines interleaved with test names,
        # and that interleaving IS the diagnostic: a warning is only actionable next to the test that provoked
        # it. The job log holds the same bytes, but it expires sooner than an artifact and cannot be diffed
        # against last week's run. pipefail is set explicitly rather than relied on: it IS the default for
        # `shell: bash` here, and a gating command whose exit code depends on an implicit shell option is one
        # runner-image change away from a suite that fails green.
        run: |
          set -o pipefail
          mkdir -p TestResults
          dotnet test -c Release --no-build --filter "$KE_TEST_FILTER" --blame --results-directory TestResults $KE_TEST_LOGGER_ARGS $KE_TEST_EXTRA_ARGS 2>&1 | tee TestResults/suite-output.log
        shell: bash

      # WHAT THE BOOT'S GPU ACTUALLY WAS (#614), on BOTH macOS legs. That issue's whole difficulty is that a red
      # run tells you the name of a test and nothing about the machine it failed on: the metal-native leg fails
      # roughly one varying GPU test per boot on the hosted Apple Paravirtual device, bit-identically wrong when
      # it is wrong, while the same commit passes on real Metal locally and the incumbent leg passes beside it.
      # The runner image version is already known to be identical across green and red attempts, so the next
      # readings worth having are the device's own.
      #
      # ALWAYS RATHER THAN failure(), WHICH IS THE POINT OF THE INSTRUMENT. The question is what DIFFERS between
      # a red boot and a green one, and a failure-only capture has nothing to difference against: it would
      # produce a red boot's facts and no baseline anywhere. The incumbent leg is green in every occurrence on
      # the ledger, so it is the control, and its evidence only exists if a green run takes it.
      #
      # IT CANNOT RED A GREEN LEG. continue-on-error plus `|| true` on every command, for the reason the Vulkan
      # diagnostics step above carries it: this is evidence, and a diagnostic that can fail the thing it is
      # diagnosing would be the second flake this issue does not need.
      #
      # AFTER the suite rather than before it, because the facts wanted are the ones from the boot that just ran
      # the tests, and because the log tail below does not exist until then. Seconds: system_profiler is one
      # call, and the engine's own facts come from a filtered --no-build run of three device-reading rows.
      # The macOS pin is the leg table's `os` key, exactly as the lavapipe steps pin ubuntu-latest.
      - name: Collect device evidence
        if: always() && matrix.os == 'macos-26'
        continue-on-error: true
        env:
          KE_GPU_TESTS: '1'
          KE_GRAPHICS_BACKEND: ${{ matrix.backend }}
          KE_METAL_MSL_CACHE: ${{ env.GPU_DISK_CACHE }}
        run: |
          mkdir -p device-evidence
          {
            echo "leg: ${{ matrix.backend }} on ${{ matrix.runner }}"
            echo "run: ${{ github.run_id }} attempt ${{ github.run_attempt }} (${{ github.sha }})"
            echo "image: ${ImageVersion:-unknown}"
            echo "gpu disk caches: ${KE_METAL_MSL_CACHE:-(default location)}"
            sw_vers || true
            uname -mrs || true
          } > device-evidence/host.txt 2>&1 || true
          system_profiler SPDisplaysDataType > device-evidence/system-profiler-displays.txt 2>&1 || true
          # THE ENGINE'S OWN VIEW OF THE SAME DEVICE, which system_profiler cannot give: the Metal probe's four
          # reads (name, highest Apple family, Mac2 / Common1, buffer-offset alignment and its selector, sample
          # count 1), the capability set the backend reports, and the adapter description the device answers
          # with. Those rows already print all of it through ITestOutputHelper, and detailed verbosity is what
          # forwards a PASSING test's output at all, so this needs no new code. They run on the incumbent leg
          # too: the Metal probe reads the system default device rather than the selected backend's.
          dotnet test KhaozEngine.Render.Tests/KhaozEngine.Render.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~MetalBackendPackageTests.TheFourReads_AnswerOnARealDevice|FullyQualifiedName~GpuCapabilitiesDiagTests.LiveDeviceReportsNameAndSamplerFeatures|FullyQualifiedName~GpuDeviceDiagnosticsGpuTests.AdapterDescription_IsTheDeviceNameTheBackendReports" \
            --logger "console;verbosity=detailed" > device-evidence/engine-device-facts.txt 2>&1 || true
          tail -n 200 TestResults/suite-output.log > device-evidence/suite-output.tail.txt 2>&1 || true
          ls -la device-evidence || true
        shell: bash

      # Uploaded on always() for the reason the step above runs on always(): a green boot's readings are the
      # baseline the red boot's are read against, and half of a difference is not one. Kilobytes of text.
      - name: Upload device evidence
        if: always() && matrix.os == 'macos-26'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: device-evidence-${{ matrix.backend }}
          path: device-evidence/
          if-no-files-found: ignore

      # TIER ONE'S EVIDENCE, on always(), and only where a tier was actually ARMED. A `strict` run that passes
      # still logs every warning and performance message the layer emitted, and those are exactly the readings
      # that are never allowed to fail a leg, so a failure-only upload would discard the entire non-fatal half of
      # what the tier produces. Named for the tier rather than the leg so it sits beside the sync job's artifact.
      #
      # ARMED, not "the leg has a column", which is the same distinction the layer install now makes and for a
      # sharper reason here: gated on the column alone this uploaded on the push path too, producing an
      # artifact called vulkan-validation-strict-vulkan-native whose contents are a golden-subset run taken with
      # validation OFF. An artifact whose NAME is false is worse than a missing one, because the name is what a
      # reader trusts when they go looking for a tier's evidence weeks later. It exists only when it is true now.
      - name: Upload validation log (strict tier)
        if: always() && env.VULKAN_VALIDATION_ARMED != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vulkan-validation-strict-${{ matrix.backend }}
          path: TestResults/suite-output.log
          if-no-files-found: ignore

      # METAL'S TIERS' EVIDENCE, on always() and for the same reason as the Vulkan artifact above: the debug
      # layer reports on stderr interleaved with the test names, that interleaving IS the diagnostic, and a run
      # that passes still carries every non-fatal line the layer emitted.
      #
      # THE NAME CARRIES THE TIER RATHER THAN THE LEG, read off the same expression that arms the tier, because
      # an artifact whose name is false is worse than a missing one: the name is what a reader trusts when they
      # go looking for a tier's evidence weeks later. `debug-layer` is API validation alone, `shader-validation`
      # is that plus in-shader bounds checking, and the two never both exist for one run.
      #
      # NO SCAN STEP, unlike the Vulkan sync job, and the difference is worth naming. That job scans because
      # KE_VULKAN_VALIDATION=sync deliberately does not latch, so an error-severity line would otherwise land in
      # an artifact under a green job. Metal's debug layer is not a message stream the engine pumps: it reports
      # through the runtime itself, and its failures surface as command-buffer errors that the backend's own
      # latch turns into test failures. There is no green-with-errors shape here to gate on.
      - name: Upload Metal validation log
        if: always() && matrix.backend == 'metal-native'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: metal-validation-${{ env.METAL_DEEP_TIER != '' && 'shader-validation' || 'debug-layer' }}-${{ matrix.backend }}
          path: TestResults/suite-output.log
          if-no-files-found: ignore

      # On a host crash: surface the --blame Sequence.xml (names the last-started test on the dead host).
      # Kilobytes, failure-only, no dumps.
      - name: Upload crash-sequence evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crash-sequence-${{ matrix.backend }}
          path: TestResults/**/Sequence_*.xml
          if-no-files-found: ignore

      # On a verify FAILURE: upload the got/want/diff evidence PNGs the golden compare wrote, so the visual
      # regression can be eyeballed from the run without re-running. ignore = no spurious failure when a leg
      # failed for a non-golden reason and wrote no evidence.
      - name: Upload golden failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-evidence-${{ matrix.backend }}
          path: KhaozEngine.Render.Tests/Gpu/goldens-evidence/
          if-no-files-found: ignore

      # Every golden compare appends its worst-cell delta to goldens-evidence/golden-deltas.<backend>.txt, on a
      # PASS as well as a fail, which is why this uploads on always() rather than failure(). Rollout gate 1 of
      # #460 is "all 36 goldens green with the observed worst-cell delta RECORDED", and a failure-only artifact
      # can only ever show the number after something broke, which is the one reading that gate cannot use.
      # Kilobytes of text. ignore = no spurious failure on a leg that ran no golden compares at all.
      - name: Upload golden delta records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-deltas-${{ matrix.backend }}
          path: KhaozEngine.Render.Tests/Gpu/goldens-evidence/golden-deltas.*.txt
          if-no-files-found: ignore

      # On an HLSL byte-equality FAILURE: upload the emitted HLSL the pinned hashes no longer match (decision
      # S3). Without the text there are two indistinguishable explanations, a deliberate shader edit that was
      # not re-baked and a cross-compile option drift, and with it they are one diff apart. Kilobytes,
      # failure-only. ignore = no spurious failure on a leg that failed for another reason.
      - name: Upload emitted-HLSL evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hlsl-evidence-${{ matrix.backend }}
          path: KhaozEngine.Render.Tests/Gpu/hlsl-evidence/
          if-no-files-found: ignore

      # When baking: upload the freshly written per-backend goldens so they can be downloaded and committed,
      # plus the bake evidence PNGs (full-res captures) so the baked scenes are viewable. always() so a leg that
      # wrote some goldens before erroring still surfaces them; ignore = no spurious failure on a leg that wrote
      # none.
      - name: Upload baked goldens
        # Never on a guest leg: neither can legitimately produce bake output (guest family, so
        # KE_UPDATE_GOLDENS is held empty above and GoldenCompare would refuse the write anyway), and skipping
        # the step says that outright where relying on if-no-files-found leaves an empty artifact to explain.
        if: always() && github.event_name == 'workflow_dispatch' && inputs.bake && matrix.goldenGuest != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: goldens-${{ matrix.backend }}
          path: |
            KhaozEngine.Render.Tests/Gpu/goldens/*.${{ matrix.backend }}.txt
            KhaozEngine.Render.Tests/Gpu/goldens-evidence/*.${{ matrix.backend }}.bake.png
          if-no-files-found: ignore

  # TIER TWO OF THE VALIDATION GATE (decision V-T4): core validation PLUS synchronisation validation, over the
  # golden subset plus the compute suite, on the native Vulkan backend and lavapipe.
  #
  # THE GATE IS THIS JOB'S, NOT THE ENGINE'S, and the split is deliberate rather than an oversight.
  # VulkanValidationMode.Sync does NOT latch: VulkanValidation.ThrowsOnError is true for the strict rung alone,
  # so a sync run logs an error-severity hazard and still exits 0. Engine-side latching stays strict-only BY
  # DESIGN, because the two rungs want opposite things from an error. strict exists to stop at the first one,
  # and sync exists to finish the sweep and report every hazard it found, which is what makes its log the
  # triage artifact. What that combination leaves behind is a tier that cannot go red, while rollout gate 3
  # and MV6's VMA decline are both read off this job being green. So the JOB gates instead: the scan step
  # below reads the log this job already tees and uploads, and exits 1 when it holds an error-severity
  # validation line. The engine is untouched, and the tier can fail.
  #
  # WHY THIS EXISTS AT ALL, because it is the load-bearing instrument in this program's net and nothing else in
  # CI can do its job. A hand-written Vulkan backend's characteristic failure is a missing barrier or a wrong
  # image layout, and both are INVISIBLE on lavapipe: a software rasterizer executes with far stronger implicit
  # ordering than a real GPU, so the golden passes here and the same command stream corrupts on the field GPU,
  # on the one machine that is not in CI. Core validation does not catch it either. Two other decisions are
  # written as CONDITIONAL on this job existing: MV6 declines VMA for an engine-owned allocator, and MV5's
  # resting-layout barrier model has this as half its exit criterion.
  #
  # WHY A SEPARATE JOB rather than a sixth matrix leg. It runs a different SUITE for a different reason.
  # Synchronisation validation tracks every access and is slow, so it buys a subset where the barrier machinery
  # actually lives instead of the serialised full suite, and it wants its own name in the checks list so a red
  # here reads as "a hazard was found" rather than as "a golden moved". The cost of the split is that the setup
  # steps below are a copy of the matrix job's. That copy is deliberate and it fails LOUDLY rather than
  # silently if it ever drifts: the ICD discovery and the layer check both exit 1 with a message when the
  # runner does not look the way they expect.
  #
  # WHEN IT RUNS, and one deliberate departure from the design's wording. The design says "on the schedule
  # only". This adds workflow_dispatch, because a job that can only ever be started by the cron would take its
  # first run unattended at 18:00 on a Sunday and could not be re-run against a fix without waiting a week.
  # MV5 and MV6 are both read off this job, so an instrument nobody can aim is not one. A bake dispatch is
  # excluded for the guest-leg reason the matrix job's test step carries.
  gpu-vulkan-sync:
    needs: legs
    name: ubuntu-latest / vulkan-native (sync validation)
    runs-on: ubuntu-latest
    if: |
      needs.legs.outputs.vulkan_native == 'true'
      && (github.event_name == 'schedule'
          || (github.event_name == 'workflow_dispatch' && !inputs.bake))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      # local-feed is git-ignored (dev inner-loop), so create it for the nuget.config 'local' source to resolve.
      - run: mkdir -p local-feed
        shell: bash

      - run: dotnet restore

      - run: dotnet build -c Release --no-restore

      # The same lavapipe install and the same runtime ICD discovery as the matrix job, for the same reasons.
      - name: Install software Vulkan (lavapipe)
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
          echo "--- ICD manifests on disk ---"
          ls -la /usr/share/vulkan/icd.d/ /etc/vulkan/icd.d/ 2>/dev/null || true

      - name: Point Vulkan loader at lavapipe
        run: |
          set -x
          icd=$(find /usr /etc -name 'lvp_icd*.json' 2>/dev/null | head -1)
          if [ -z "$icd" ]; then
            echo "::error::lavapipe ICD manifest not found after installing mesa-vulkan-drivers"
            find /usr /etc -name '*_icd*.json' 2>/dev/null || true
            exit 1
          fi
          echo "lavapipe ICD: $icd"
          { echo "VK_ICD_FILENAMES=$icd"; echo "VK_DRIVER_FILES=$icd"; } >> "$GITHUB_ENV"

      # The layer check matters more here than anywhere: this whole job IS the layer. Without it the run would
      # be a second, slower copy of the golden subset, passing and proving nothing.
      - name: Install the Khronos validation layer
        run: |
          set -x
          sudo apt-get install -y vulkan-validationlayers
          layer=$(grep -rl VK_LAYER_KHRONOS_validation /usr/share/vulkan /etc/vulkan 2>/dev/null | head -1)
          if [ -z "$layer" ]; then
            echo "::error::VK_LAYER_KHRONOS_validation is not on this runner after installing vulkan-validationlayers, so this job would run the golden subset a second time and validate nothing"
            exit 1
          fi
          echo "Khronos validation layer manifest: $layer"

      # The matrix leg's symlink step, copied here for the same reason the rest of this setup is copied. It is
      # LATENT on this job today and it is cheap insurance rather than dead weight: this job runs
      # vulkan-native, and Silk.NET resolves through its own native-context search, so nothing on the selected
      # subset is known to need the unversioned names. What it guards is the Veldrid fallback, where Veldrid
      # 4.9.0's Vulkan binding P/Invokes the bare "libdl" and "libvulkan" that modern Ubuntu ships versioned
      # only. Any test that reaches a Veldrid Vulkan device from here (the capability-parity row is the one
      # that already does it on the matrix legs, and the Compute filter's reach is not frozen) would otherwise
      # fail at device creation with a DllNotFoundException, which is the least diagnosable shape a failure can
      # take on a job whose whole output is a validation log. This job's setup is a deliberate copy that fails
      # LOUDLY rather than silently when it drifts, and a MISSING step is the one drift that fails silently, so
      # the copy is kept complete. Retires with the Veldrid Vulkan leg itself, in phase 4 and not before:
      # https://github.com/APKiwiOrg/KhaozEngine/issues/540
      - name: Symlink libdl / libvulkan for Veldrid
        run: |
          set -x
          libdir=/usr/lib/x86_64-linux-gnu
          dl=$(ldconfig -p | awk '/libdl\.so\.2/ {print $NF; exit}')
          vk=$(ldconfig -p | awk '/libvulkan\.so\.1/ {print $NF; exit}')
          [ -n "$dl" ] && sudo ln -sf "$dl" "$libdir/libdl.so" || echo "WARN: libdl.so.2 not found"
          [ -n "$vk" ] && sudo ln -sf "$vk" "$libdir/libvulkan.so" || echo "WARN: libvulkan.so.1 not found"
          ls -l "$libdir/libdl.so" "$libdir/libvulkan.so" 2>/dev/null || true

      # THE SUBSET IS THE GOLDEN FAMILY PLUS THE COMPUTE SUITE, and the naming contract is what selects it
      # (design section 15). `FullyQualifiedName~Golden` is the same substring the matrix job's push path uses,
      # so every scene that renders under the barrier model is here. `FullyQualifiedName~Compute` adds the
      # dispatch paths, which is where the compute rule 1 image transition and the dependent-dispatch barrier
      # live, and those two are the exact shapes synchronisation validation was installed to judge.
      #
      # NO KE_UPDATE_GOLDENS on any trigger: this job runs the native backend, which is a guest in the vulkan
      # golden family, so a bake here would refuse by design. It is not set at all rather than set empty,
      # because there is no trigger on which this job wants it.
      - name: Run the golden and compute suite under synchronisation validation
        # Named, because the gate step below runs exactly when THIS step ran, pass or fail, and not when an
        # earlier step took the job down before any log existed.
        id: suite
        env:
          KE_GPU_TESTS: '1'
          KE_GRAPHICS_BACKEND: vulkan-native
          KE_VULKAN_DEVICE: llvmpipe
          KE_VULKAN_REQUIRED: '1'
          KE_VULKAN_VALIDATION: sync
          # THE SAME ONE VALUE THE MATRIX LEGS READ (#614). This job is part of the run, so a cacheless dispatch
          # that left it caching would make the dispatch's own description false, which is the same objection
          # this file already records against an artifact whose name is false. Only the Vulkan variable can do
          # anything here, and it is the pipeline cache the native backend writes.
          KE_VULKAN_PIPELINE_CACHE: ${{ env.GPU_DISK_CACHE }}
        # pipefail explicitly, for the reason the matrix job's test step states: this is a gating command and
        # its exit code must not depend on an implicit shell option.
        #
        # DETAILED CONSOLE VERBOSITY, unconditionally here because this job is armed on every trigger that runs
        # it at all (#565). The test host configures a console sink when KE_VULKAN_VALIDATION arms a rung, and
        # vstest forwards the test host's stdout only at this verbosity, so at the default the engine's own
        # formatted validation lines are written into a stream the runner discards and the gate step below
        # scans a log that structurally cannot contain them. It also prints one `Passed <TestName>` line per
        # test, which is what puts each message next to the test that provoked it.
        run: |
          set -o pipefail
          mkdir -p TestResults
          dotnet test -c Release --no-build --filter "FullyQualifiedName~Golden|FullyQualifiedName~Compute" --blame --results-directory TestResults --logger "console;verbosity=detailed" 2>&1 | tee TestResults/sync-validation.log
        shell: bash

      # WHAT MAKES TIER TWO A GATE. The engine does not fail a sync run on an error (the job header says why,
      # and it is deliberate), so without this step an error-severity hazard lands in the artifact and the job
      # reports green, which is the reading rollout gate 3 and MV6's VMA decline would then be taken from.
      #
      # TWO SHAPES ARE MATCHED, because two producers can put an error-severity line in this log and neither is
      # guaranteed to be the one that speaks first.
      #   * `Vulkan validation [Error]` is the ENGINE's, exactly. VulkanValidationPump.Format writes every
      #     message it logs as `Vulkan validation [<Severity>] <VUID>: <text>`, with the severity spelled by
      #     VulkanValidationSeverity, so the Error rung is that literal and the Warning rung cannot collide
      #     with it. This arm could not fire at all before #565: the pump logged through a facade nothing in
      #     the test process had configured, so it wrote to a no-op logger on every leg. It is a real arm now.
      #   * `Validation Error:` is the LAYER's own, and it is the more important of the two here. The Khronos
      #     layer reports on its own account as well as through the application messenger, and its message body
      #     opens with `Validation Error:` at error severity and `Validation Warning:` at warning severity. The
      #     same prefix also sits INSIDE the engine's formatted line, because the text the pump formats IS the
      #     layer's pMessage, so this arm covers both producers and the first arm covers the case where the
      #     engine's own formatting is all that reached the log.
      #
      # A SCAN THAT SEES NOTHING SAYS SO OUT LOUD, which is the property #423 is about. A gate whose pattern
      # quietly stops matching looks identical to a clean run, so the total number of validation lines at ANY
      # severity is printed on every run and a total of zero prints a notice naming both shapes. Zero is not
      # evidence of a clean sweep on its own: it is equally what this scan looks like after it loses its
      # producer, and the two have to be tellable apart from the log alone.
      #
      # The artifact upload below stays on always(), so a run this step reds still keeps the log that explains
      # why. That ordering is the whole point: the gate goes red and the triage evidence survives it.
      - name: Gate on error-severity validation messages
        if: always() && steps.suite.conclusion != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          log=TestResults/sync-validation.log
          if [ ! -f "$log" ]; then
            echo "::error::$log does not exist, so tier two scanned nothing at all. The suite step tees it, so a missing file means the run never reached the tee and this job's validation gate proved nothing."
            exit 1
          fi

          # grep -c exits 1 on zero matches, which set -e would take as a failure, so each count absorbs it and
          # keeps the printed 0.
          errors=$(grep -cE 'Vulkan validation \[Error\]|Validation Error:' "$log" || true)
          total=$(grep -cE 'Vulkan validation \[(Error|Warning)\]|Validation (Error|Warning):' "$log" || true)
          echo "validation lines in $log: $total at any severity, $errors at error severity"

          if [ "$total" -eq 0 ]; then
            echo "::notice::No validation line of any severity was found in $log. On a genuinely clean sweep that is the right answer, but it is also exactly what this scan looks like if it lost its producer, so treat it as a reading to confirm rather than as a pass. The shapes it looks for are 'Vulkan validation [<Severity>]' (the engine pump's format) and 'Validation Error:' or 'Validation Warning:' (the Khronos layer's own message body). To tell the two cases apart, grep the log for 'VulkanValidationLogHost': that line is written once per armed run by the test host that configures the sink the engine pump writes to, so its ABSENCE means the engine half could not have reported anything whatever the layer saw (#565)."
          fi

          if [ "$errors" -gt 0 ]; then
            echo "::error::Synchronisation validation reported $errors error-severity line(s). KE_VULKAN_VALIDATION=sync does not latch or throw by design, so the suite passed and this gate is what fails the job. The full interleaving with test names is in the vulkan-validation-sync artifact, which uploads on always() and is where each hazard reads next to the test that provoked it."
            grep -nE 'Vulkan validation \[Error\]|Validation Error:' "$log" | head -20
            exit 1
          fi

      # always(), because the non-fatal half of what this job produces is the half worth keeping: warning and
      # performance severities never fail a run, and a hazard the layer reports as a warning is still the thing
      # this job was installed to find.
      - name: Upload validation log (sync tier)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vulkan-validation-sync
          path: TestResults/sync-validation.log
          if-no-files-found: ignore

      - name: Upload crash-sequence evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crash-sequence-vulkan-native-sync
          path: TestResults/**/Sequence_*.xml
          if-no-files-found: ignore

      - name: Upload golden failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-evidence-vulkan-native-sync
          path: KhaozEngine.Render.Tests/Gpu/goldens-evidence/
          if-no-files-found: ignore
