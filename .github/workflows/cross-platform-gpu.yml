# cross-platform-gpu: desktop GPU test matrix over the three engine-owned native backends (macOS Metal /
# Windows Direct3D 11 / Linux Vulkan), plus one Vulkan synchronisation-validation job.
#
# THREE LEGS SINCE 18.0.0, not six. The Veldrid incumbent backend was deleted (#687), and the three legs that
# ran it (`metal`, `direct3d11`, `vulkan`) went with it (#689, https://github.com/APKiwiOrg/KhaozEngine/issues/540).
# Each surviving leg used to be one half of an A/B pair on one runner. Each is now the only implementation of
# its API the engine has, and it owns the golden family named after it.
#
# BILLING: this repo is PUBLIC, so GitHub-hosted standard runners are free. All three legs run hosted and cost
# nothing, Metal included: it moved to hosted macos-26 (#552), and no leg touches a personal machine any more.
# The suite split that follows was decided when the repo was private and hosted minutes billed
# (Linux 1x, Windows 2x, macOS 10x). It is KEPT on its merits rather than its cost: the golden subset is
# the fast signal a push wants, and the full suite is a slower sweep that belongs on the cron. Read the
# "2x billing" notes below as history explaining how the tiers were chosen, not as a live constraint. The
# engine went public 2026-08-06 after its private CI became the largest line on the org's GitHub bill.
#
# THE TIERS WERE RE-DECIDED AT THE DELETE, AGAINST MEASURED FULL-SUITE DURATIONS, and they did not move.
# Run 32579723071 was a full-matrix workflow_dispatch, so every leg ran the FULL suite. Per leg:
#   metal-native      macos-26        4m31s
#   metal             macos-26        3m56s   (deleted)
#   direct3d11-native windows-latest 25m43s
#   direct3d11        windows-latest 37m41s  (deleted)
#   vulkan-native     ubuntu-latest  26m36s  (serialized collections + strict validation)
#   vulkan            ubuntu-latest  21m45s  (deleted)
#   vulkan-native sync job            4m36s
# So metal-native keeps `always`: the whole suite on a real GPU costs four and a half minutes, which is
# cheaper than the OTHER legs' golden subsets, and it is the strongest net in the program. The two software
# legs keep `scheduled`: their full suites are about 26 minutes each, six times the Metal leg, and almost all
# of that is pipeline creation on a software rasterizer rather than engine work. Promoting either to `always`
# would take the push gate from roughly 8 minutes to roughly 26 for the one trigger whose job is fast
# feedback, and what it would newly catch is a behavioural regression visible ONLY under WARP or lavapipe,
# which is the rarest failure this matrix has ever produced. The weekly cron still sweeps both in full.
# The delete also shortened the matrix's own wall clock: the slowest leg was direct3d11 at 37m41s and is now
# vulkan-native at 26m36s, and a full dispatch drops about 63 minutes of runner time.
#
# What this does (suite split by leg + trigger, decided from measured cost + lavapipe stability):
#   * The Metal NATIVE leg runs the engine's own KhaozEngine.Gpu.Metal backend
#     (KE_GRAPHICS_BACKEND=metal-native) on the FULL test suite (every [GpuFact], golden and behavioral, plus
#     the headless suite) on every trigger, on GitHub-hosted macos-26 (decision M-T6). The image is pinned to
#     the number rather than to macos-latest so a promotion cannot move the GPU under a golden gate. The pair
#     of Metal legs used to run on the self-hosted dev Mac, because hosted macos-14 has no usable Metal device
#     at all (#547), and macos-15 and macos-26 both do (#552). It covers pull_request like every other leg:
#     the exclusion that used to sit on the Metal pair existed only to keep a fork from routing work onto a
#     personal machine, and there is no personal machine in this workflow any more. It OWNS the metal-native
#     golden family FROM 17.41.0, exactly as direct3d11-native and vulkan-native own theirs (row 2 of #683,
#     which supersedes the guest ruling of decision M-I3): it verifies the committed metal-native grids on the
#     same real GPU, and it bakes them on a bake dispatch.
#     THIS IS THE STRONGEST REGRESSION NET IN THE PROGRAM, and that is why it takes the expensive tier. The
#     other two legs run golden-only on push, on software rasterizers, and the Vulkan one has no
#     swapchain coverage at all. This one runs everything, on a real GPU, every time, and the metal family is
#     the fleet's cross-backend reference, so a golden disagreement here is a fleet event rather than a leg
#     event.
#     Three things were this leg's rather than the incumbent Metal leg's, and they are simply this leg's now.
#     It sets KE_METAL_REQUIRED=1, because the
#     rows that need a native device go DORMANT when the probe refuses the machine, and a dormant row on the one
#     leg built to run them is a pass that asserted nothing which the zero-skipped criterion of rollout gate 2
#     cannot see (the same lesson as KE_VULKAN_REQUIRED, inherited by name). It arms Metal's TWO validation
#     tiers (decision M-T7), MTL_DEBUG_LAYER=1 on every run because it is an environment variable with no
#     install and no measurable cost at this scale, and MTL_SHADER_VALIDATION=1 on the deep tier, which is a
#     DISPATCH and nothing else since #617 (https://github.com/APKiwiOrg/KhaozEngine/issues/617): that rung
#     renders nothing at all on this runner's paravirtual device while being fully green on real Apple silicon,
#     so the cron may not arm it. THIS WORKFLOW SUPERSEDES M-T7'S OWN ARMING, which puts the shader rung "on
#     the scheduled run" (docs/design/METAL-NATIVE-BACKEND-DESIGN-2026-08-09.md, decision table row M-T7 and
#     its section 16 restatement). That doc records what was decided before the rung had ever run, and it is
#     kept as history rather than edited, so the tier that actually runs is this file's. And it sets
#     MTL_CAPTURE_ENABLED=1 on the `capture` dispatch tier ALONE, which is the only thing that runs the
#     frame-capture interop end to end: without it Metal refuses the GPU-trace destination and the row asserts
#     that nothing started, with it the capture really starts from the native queue pointer and writes a
#     .gputrace bundle. That variable used to ride every trigger except the deep dispatch, and
#     https://github.com/APKiwiOrg/KhaozEngine/issues/614 is what moved it: the capture is exclusive with the
#     SHADER RUNG (the manager still reports the destination as supported and startCapture returns false) and,
#     measured on real Metal for that issue, exclusive with the DEBUG DEVICE as well, because a process launched
#     with it gets a CaptureMTLDevice where MTL_DEBUG_LAYER=1 alone gets the MTLDebugDevice that does the
#     validating. So the arrangement it replaces left this leg's tier-one instrument INERT on every push, pull
#     request and cron it ever ran, which is a fortnight of #614 artifacts in which the layer never objected to
#     anything. Every arm this leg has must still be reachable on demand, so `tier` is a three-way dispatch
#     input (push / deep / capture) rather than a switch between two, defaulting to deep so an unattended
#     dispatch is unchanged, and every UNATTENDED trigger now takes the debug-device shape.
#     NEITHER METAL TIER IS A SYNCHRONISATION VALIDATOR, and Metal has none at all: MTL_DEBUG_LAYER is API
#     validation and MTL_SHADER_VALIDATION is in-shader bounds checking, and neither tracks read-after-write
#     hazards across encoders. That is the one place this matrix is weaker on the Metal side than on the Vulkan
#     one, and it is stated here rather than left for a reader to conclude that Metal's validation is simply
#     cheaper. It is also why that backend keeps Metal's automatic hazard tracking rather than going untracked.
#     NO ERROR-MODE VARIABLE IS SET, AND THE REASON IS A MEASUREMENT THAT CORRECTS #591. That issue records
#     the host-aborting behaviour as a property of MTL_DEBUG_LAYER_ERROR_MODE=assert, which reads as "do not set
#     it and you are fine". Row 19 measured otherwise: ASSERT IS THE DEFAULT, so plain MTL_DEBUG_LAYER=1 aborted
#     the test host on the first objection and took the run's whole signal with it (5956 of 6039 rows reported,
#     then "Test Run Aborted"). The obvious fix, MTL_DEBUG_LAYER_ERROR_MODE=nslog, was measured too and is
#     REJECTED: it stops the abort and reports nothing at all to the captured stream, not even the layer's own
#     banner, which would leave this leg with a tier that can neither fail nor testify. That is worse than no
#     tier, because the artifact would exist and be empty.
#     So the layer runs at its default and the rows that provoke it on purpose stand down in-process instead,
#     which is #591's own second option and keeps the filter out of this workflow where a filter goes stale.
#     Three rows do that today, each because the thing it does is legitimate in a test and illegitimate in a
#     shipped frame: the row-1 interop spike records offset setters on an encoder with no pipeline bound because
#     it is measuring the objc_msgSend ABI rather than drawing, and the validation-reader row cannot tell an
#     in-process variable from a launch one in a process that was launched with it. A third row stood down for
#     the same reason until 18.0.0: MM6's incumbent CONTROL reproduced the Veldrid Metal mis-binding on purpose,
#     which the layer saw as a draw with an unbound fragment buffer. It went with the incumbent it controlled.
#   * The GitHub-hosted D3D11 NATIVE leg (2x billing) runs the engine's own KhaozEngine.Gpu.D3D11
#     backend (KE_GRAPHICS_BACKEND=direct3d11-native): golden tests only (FullyQualifiedName~Golden) on
#     push / pull_request, the FULL suite on the weekly schedule and on workflow_dispatch (decision T5).
#     It OWNS the direct3d11-native golden family from 17.41.0
#     (row 2 of #683, superseding decision I3's guest ruling): it verifies the committed direct3d11-native
#     goldens on the WARP rasterizer, and it bakes them on a bake dispatch like any other owning
#     leg (see the test step). The golden-only push tier was chosen when this repo was private and Windows
#     billed at 2x, on a measurement of the incumbent leg: the full suite on hosted Windows was 17m14s against
#     the golden-only 7m44s (trial runs 29542939552 / 29545657401). The repo is public and those minutes are
#     free now, and the tier survived the 18.0.0 re-decision on feedback speed alone: this leg's own full
#     suite measured 25m43s in run 32579723071 (see the header), which is six times the Metal leg.
#   * The GitHub-hosted Vulkan NATIVE leg (1x) runs the engine's own KhaozEngine.Gpu.Vulkan backend
#     (KE_GRAPHICS_BACKEND=vulkan-native) on the D3D11 native leg's tier: golden tests only on
#     push / pull_request, the FULL suite on the weekly schedule and on workflow_dispatch (decision
#     V-T8). It OWNS the vulkan-native golden family from 17.41.0, exactly as direct3d11-native owns
#     direct3d11-native's (row 2 of #683, superseding decision V-T1's guest ruling): it verifies the
#     committed vulkan-native goldens on the lavapipe rasterizer and bakes them on a bake
#     dispatch. Two things are its own rather than the D3D11
#     leg's: it sets KE_VULKAN_REQUIRED=1, because the rows that need a native device go DORMANT
#     without one and a dormant row on the one leg built to run them is a pass that asserted nothing,
#     and its scheduled full suite runs under KE_VULKAN_VALIDATION=strict, which is the first
#     validation layer this repo has ever installed anywhere (decision V-T4).
#     THE LAVAPIPE HISTORY BELONGS TO THIS LEG NOW, inherited from the incumbent Vulkan leg that carried it
#     until 18.0.0. Chasing that leg's full-suite crashes surfaced four real engine defects, all fixed:
#     concurrent device creation racing the Vulkan loader (serialized process-wide in GpuDeviceContext),
#     mid-life resource disposal racing queued async work (drained via WaitForIdle before disposing), and a
#     teardown-order pair where a wrapper outliving its device drained or destroyed against the dead device
#     (latched by a shared DeviceLiveness token). The full PARALLEL suite on lavapipe still exhibits residual
#     driver-side instability with delayed-corruption symptoms (a CoreCLR fatal, deliberately not chased), so
#     the full-suite runs serialize xUnit test collections via KE_TEST_EXTRA_ARGS, one live device at a time.
#     That is most of why this leg's full suite measured 26m36s in run 32579723071. Golden-only runs keep
#     their months-green parallel configuration.
#   * The Vulkan SYNC-VALIDATION job (1x, gpu-vulkan-sync below) is the second validation tier, and it
#     is a separate job rather than a matrix leg because it runs a different suite for a different
#     reason: the golden subset plus the compute suite under KE_VULKAN_VALIDATION=sync, on the
#     schedule and on a non-bake dispatch only. Synchronisation validation tracks every access and is
#     slow, so it buys a subset rather than the serialised full suite. It is the ONE instrument in this
#     net that can see a missing barrier or a wrong image layout, which a software rasterizer executes
#     correctly anyway and which no golden and no core-validation run can catch (decision V-T4, and
#     MV5 and MV6 in the design's section 16 are both read off it).
#   * Committed per-backend goldens live at KhaozEngine.Render.Tests/Gpu/goldens/<name>.<backend>.txt.
#     The family in that filename is the GoldenBackendToken, not the leg name. Since 17.41.0 the two
#     coincide on every live leg, because every kind owns the family named after it: direct3d11-native
#     reads the direct3d11-native files. That is a property of the mapping rather than of the name, and
#     it is the mapping the goldens follow.
#   * All three legs are committed and blocking, and they do not carry the same history. macOS Metal's
#     runner, Windows WARP and Linux lavapipe are long validated as RASTERIZERS, with months of green runs
#     behind them under the Veldrid incumbent that used to share each one. The three native BACKENDS block
#     BY DESIGN rather than by record: each is its backend's continuous exercise (decisions RO3, V-RO1 and
#     M-T6), so it gated from its first run. Their first recorded evidence is rollout gate 1 on issues #460
#     (Direct3D 11) and #529 (Vulkan).
#   * THERE IS NO ESCAPE HATCH LEG ANY MORE. Decision V-RO2 kept the incumbent Vulkan leg selectable
#     indefinitely as the fallback if the native backend went bad, and it was deliberately not coupled to
#     that backend's health for exactly that reason. #683 closed the question the other way: the incumbent
#     is deleted, so a native backend going bad is fixed rather than escaped from.
#
# Generating goldens for a NEW scene or backend:
#   1. Run this workflow manually (Actions -> cross-platform-gpu -> Run workflow) with bake = true.
#   2. ALL THREE legs render with KE_UPDATE_GOLDENS=1 and upload their own family's grids as artifacts
#      named goldens-<backend> (e.g. scene2d.<backend>.txt). Every leg is a bake leg since 17.41.0,
#      because every leg owns the family it verifies. The sync-validation job still sits a bake dispatch
#      out: it is a validation instrument over a subset, not a producer of references, and the
#      vulkan-native matrix leg bakes that family.
#   3. Download the artifacts, drop the files into KhaozEngine.Render.Tests/Gpu/goldens/, and commit them.
#      The constraint that used to sit here died with row 4 of #683: the three native families were
#      byte-identical COPIES of the incumbent ones and GoldenFamilyCopyGoldenTests asserted it, so a
#      native leg's bake output could not be committed on its own. The incumbent families are gone and so
#      is that test, and each leg's artifact is now committed as it comes.
#   4. After that, the push/PR legs VERIFY what was baked, each leg against its own family.
#
# Running the matrix WITHOUT the GPU shader disk caches (#614):
#   Dispatch with disableGpuDiskCache = true. Every leg's test step and the sync job then set all three
#   cache variables to `off`, plus KE_SPIRV_CACHE for the in-memory front-end memo (#640), so no backend
#   reads or writes an entry and nothing is compiled once and reused for the whole run. That is the A/B
#   for a flake that could be a warm cache entry read back wrong: the same commit, cacheless. Every other
#   trigger leaves the variables blank, which is the default location and the shipped behaviour.
#
# Software rasterizers (the Windows and Linux runners have no real GPU):
#   * Linux uses Mesa lavapipe (software Vulkan). The workflow discovers the lavapipe ICD manifest at runtime
#     (its name and path drift across Ubuntu images) and points VK_ICD_FILENAMES/VK_DRIVER_FILES at it. The
#     leg additionally pins KE_VULKAN_DEVICE=llvmpipe (decision V-G2), for the reason the Windows leg pins
#     its adapter: the loader-level ICD pin has needed repairing before when a runner image moved the
#     manifest, and an unpinned physical-device selection could then land on something else entirely without
#     the leg saying so. The variable has exactly one reader, the native backend's own physical-device
#     selection. Empty on Windows and macOS.
#   * Windows D3D11 falls back to WARP (software) automatically when no hardware adapter is present. The leg
#     does not ride that accident: it pins KE_D3D11_ADAPTER=warp (decision G2), so a runner image that
#     grows a paravirtual adapter cannot silently change the rasterizer under the golden gate. The variable
#     is read only by the native backend's adapter selection.
#
# The headless golden tests use Render2D/3D Snapshot -> CreateHeadless (offscreen, NO window), so SDL2 is
# NOT required here (only the Vulkan/D3D11/Metal runtime plus a (software) rasterizer where there is no real
# GPU). A shipped windowed game still needs SDL2 bundled per-RID; see docs/CROSS-PLATFORM.md.
#
# The fast inner-loop CI (build/test/pack/publish, GPU tests skipped) stays in ci.yml, untouched.

name: cross-platform-gpu

# The push path filter below was written as cost control, when every leg but Metal billed. On a public repo
# it costs nothing, and it stays because it is also the right behaviour: a matrix that fires on every push
# buries a real golden break in noise, and a docs push has no way to move a rendered pixel. On push it runs
# only when something that can change a GPU golden is touched (rendering stack, the GPU seam, the GPU
# test dir, or this workflow). Docs/netcode/etc. pushes skip it. PRs + manual bake still run as before.
concurrency:
  # Event name folded into the group so a gated push near the weekly cron cannot cancel the
  # weekly full-suite sweep (or vice versa): push and schedule now get separate groups.
  group: cross-platform-gpu-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'KhaozEngine.Render3D/**'
      - 'KhaozEngine.Render2D/**'
      - 'KhaozEngine.Gpu/**'
      # The native Direct3D 11 backend. Its shader path owns the FXC call, so a change here can reject HLSL
      # that SPIRV-Cross emits, or hole a vertex input signature, and the Windows leg's FXC step
      # below is the only thing that runs a compiler over the shipped programs (decision S5).
      - 'KhaozEngine.Gpu.D3D11/**'
      # The native Vulkan backend, watched for the same reason as its D3D11 sibling above and missed when
      # the package landed after the #198 sweep (#546). A sibling package does NOT ride 'KhaozEngine.Gpu/**':
      # that pattern needs the literal 'KhaozEngine.Gpu/' prefix, which is why D3D11 carries its own entry
      # too. Until this line existed, a push touching only Vulkan sources got no matrix run, and the gap
      # stayed invisible because branch merges bundle Render.Tests changes into the same push.
      - 'KhaozEngine.Gpu.Vulkan/**'
      # The native Metal backend, watched for the same reason as both siblings above and needing its own entry
      # for the same reason vulkan-native did: 'KhaozEngine.Gpu/**' needs the literal prefix and does not match a
      # sibling package. Without this line a push touching only Metal sources would get no matrix run, on the one
      # backend whose leg is the strongest net in the program.
      - 'KhaozEngine.Gpu.Metal/**'
      - 'KhaozEngine.Gui/**'
      - 'KhaozEngine.Primitives/**'
      # Render/runtime stack layer between Gpu and Render2D/Render3D (AppWindow, GLFW). Was never watched (#198).
      - 'KhaozEngine.Windowing/**'
      # 2D game-loop facade (BootScreenRenderer is drawn and captured by KhaozEngine.Render.Tests/Gpu/
      # BootScreenVisualTests.cs) plus its 3D scene adapter. Neither was watched (#198).
      - 'KhaozEngine.Game/**'
      - 'KhaozEngine.Game.Render3D/**'
      # Render-free terrain field (height/biome/noise) and its Render3D mesher. Neither was watched (#198).
      - 'KhaozEngine.Terrain/**'
      - 'KhaozEngine.Terrain.Render3D/**'
      # Render-free tile world document and its Render3D ground mesher, view and capture, watched for the same
      # reason as the Terrain pair above. The four tileworld goldens (greybox, topdown, textured, river) render through
      # both, and the document package owns TileWorldSpace and the shared triangulation the mesher reads, so a
      # change confined to it moves those images without touching anything already on this list (#629).
      - 'KhaozEngine.TileWorld/**'
      - 'KhaozEngine.TileWorld.Render3D/**'
      # Render-free deterministic particle sim and its Render3D billboard adapter. Neither was watched (#198).
      - 'KhaozEngine.Particles/**'
      - 'KhaozEngine.Particles.Render3D/**'
      # Render-free telegraph style/resolve core (also draws the 2D path itself) and its Render3D ground
      # path. Neither was watched (#198).
      - 'KhaozEngine.Telegraphs/**'
      - 'KhaozEngine.Telegraphs.Render3D/**'
      # Headless snapshot runner (Shot2D) and its Shot3D extension, both driven end to end by
      # KhaozEngine.Render.Tests/Gpu/SnapshotHarnessGpuTests.cs. Neither was watched (#198).
      - 'KhaozEngine.Snapshot/**'
      - 'KhaozEngine.Snapshot.Render3D/**'
      # Map editor viewport and render tool carry their own [GpuFact] renders, and MapDoc is the document
      # model those renders load. None were watched (#198).
      - 'KhaozEngine.MapEditor/**'
      - 'KhaozEngine.MapEdit.Tool/**'
      - 'KhaozEngine.MapDoc/**'
      # GoldenCompare delegates Downsample/Compare/Serialize entirely to this package, so a bug here can
      # silently flip any golden's pass or fail. Wasn't watched (#198).
      - 'KhaozEngine.Imaging/**'
      # The GPU golden tests, the Imaging GoldenGridTests, and the Render3D/Terrain/ParticlesRender3D
      # [GpuFact] suites all live in Render.Tests now (13.0.3 monolith split), and the committed goldens
      # live under it too, so one whole-project gate covers what used to be five KhaozEngine.Tests/*
      # subdirs (the 10.18.1 LF fix shipped without a matrix run because only Tests/Gpu was watched,
      # hence whole-project gates rather than per-subdir lists).
      - 'KhaozEngine.Render.Tests/**'
      # MapEditor/MapEditTool/MapDoc tests moved here (13.0.3 split) and carry [GpuFact] renders plus the
      # sample document RenderServiceTests and ViewportWorldDisposeOrderGpuTests render (#198).
      - 'KhaozEngine.MapEditor.Tests/**'
      - '.github/workflows/cross-platform-gpu.yml'
  # No paths filter here (deliberate): pull_request already runs on every path unconditionally, a strict
  # superset of the push list above, so it already "agrees" with push and needs no separate #198 fix.
  pull_request:
    branches: [ main ]
  # Weekly full-suite pass on the four scheduled-tier legs, both D3D11 legs and both Vulkan legs (Metal runs the
  # full suite on every trigger anyway). Sunday 18:00 UTC: a quiet slot, and any breakage surfaces before the
  # working week. It is also the trigger that arms both validation tiers.
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      bake:
        description: 'Re-bake the per-backend goldens (KE_UPDATE_GOLDENS=1) and upload them as artifacts'
        type: boolean
        default: false
      # A dispatch runs the FULL suite on every leg, which was the most expensive thing this workflow did
      # while the repo was private: about 87 Windows minutes and 65 Linux minutes per dispatch, roughly
      # $1.26. Most dispatches chase ONE backend and the others buy nothing. The repo is public now so the
      # minutes are free, but the selector stays: a targeted dispatch also finishes far sooner, which is
      # the reason that outlives the billing. Default is 'all' so an unattended dispatch is unchanged.
      # `metal` is just another hosted leg here now that it runs on macos-26, so a metal dispatch carries no
      # machine access with it, and starting any dispatch already needs write access to this repo.
      legs:
        description: 'Which legs to run. Pick one backend when debugging it, "all" for the full matrix.'
        type: choice
        default: all
        options: [all, metal-native, direct3d11-native, vulkan-native]
      # WHICH SHAPE A DISPATCH TAKES ON THE metal-native LEG, and it exists because that leg has THREE Metal
      # process-launch variables and no two of the interesting ones can share a process. It was a two-way choice
      # while the pair being separated was MTL_SHADER_VALIDATION against MTL_CAPTURE_ENABLED (a GPU-trace capture
      # cannot start with the shader rung armed). It is a three-way choice now, because
      # https://github.com/APKiwiOrg/KhaozEngine/issues/614 measured a SECOND exclusion that had been riding every
      # unattended trigger unnoticed:
      #
      #   MTL_CAPTURE_ENABLED DISPLACES THE DEBUG DEVICE. A process launched with MTL_DEBUG_LAYER=1 alone gets a
      #   device whose Objective-C class is MTLDebugDevice, which is the class that performs the API validation.
      #   Add MTL_CAPTURE_ENABLED=1 and the device comes back as CaptureMTLDevice instead, and the engine's own
      #   disambiguation warns that the run is probably not validated whatever the environment says. Measured on
      #   this branch, on real Metal (Mac14,6 / Apple M2 Max, macOS 26.6.1 build 25G76), one row driven under
      #   KE_GPU_TESTS=1 KE_GRAPHICS_BACKEND=metal-native at detailed verbosity:
      #     * MTL_DEBUG_LAYER=1
      #         [INFO] [MetalGpuDevice] ... The device class is MTLDebugDevice.
      #       and no disambiguation warning at all.
      #     * MTL_DEBUG_LAYER=1 MTL_CAPTURE_ENABLED=1
      #         [INFO] [MetalGpuDevice] ... The device class is CaptureMTLDevice.
      #         [WARN] [MetalGpuDevice] MTL_DEBUG_LAYER is armed in this process's launch environment and the
      #         Metal device came back as CaptureMTLDevice ... this run is probably NOT validated.
      #   So the two Metal instruments this leg carries are mutually exclusive in the same way the other pair is,
      #   and the arrangement that shipped before this change armed BOTH on every push, every pull request and
      #   every cron. Every debug-layer artifact this leg has ever uploaded on an unattended trigger is therefore
      #   testimony from a disarmed instrument, which is why #614 has watched the leg fail one varying GPU test
      #   per boot for a fortnight without the layer ever objecting to anything.
      #
      # THE THREE SHAPES, and what each one is for:
      #   * push    - MTL_DEBUG_LAYER=1 alone. THE DEBUG DEVICE ACTUALLY HOLDS. This is the shape every
      #               unattended trigger takes now (push, pull_request and the cron), so a dispatch of it
      #               reproduces the push path exactly, which is what makes it the shape #614 dispatches at.
      #   * deep    - the debug layer plus MTL_SHADER_VALIDATION=1. Dispatch only, see METAL_DEEP_TIER below.
      #   * capture - the debug layer plus MTL_CAPTURE_ENABLED=1, which is the only shape that can really start
      #               a GPU-trace capture and write a .gputrace bundle. It is a DISPATCH rather than a rider on
      #               the push path now, for the exclusion measured above.
      # 'capture' is its own option rather than something folded in beside shader validation, which is where the
      # obvious move would have put it once it had to leave the push path: the two cannot share a process, and a
      # capture armed beside the shader rung asserts against a platform fact rather than against the engine.
      #
      # WHAT MOVING THE CAPTURE OFF THE PUSH PATH COSTS, stated rather than glossed: MetalFrameCaptureTests'
      # POSITIVE arm, the one that starts a capture from the native queue pointer and asserts the bundle, is
      # attended-only coverage now, and its negative arm (an unarmed process refuses the destination) is the one
      # every unattended trigger runs. That is the exact inverse of the split #617 left behind, and it is the
      # right way round: a leg whose validation instrument is disarmed on every unattended run cannot testify
      # about anything, while a capture interop that is exercised on demand is still exercised.
      #
      # THE CRON IS NOT DEEP (https://github.com/APKiwiOrg/KhaozEngine/issues/617): shader validation
      # renders nothing at all on the hosted paravirtual device while being fully green on real Apple silicon, so
      # a weekly arm reds the matrix on a rung that cannot testify about the code. The full reasoning and its
      # three measurements are on METAL_DEEP_TIER below. This input is still the ONLY way to arm that rung, which
      # is what makes 'deep' still worth defaulting to: the trigger a human reaches for to investigate #617 is
      # the trigger that arms the thing being investigated. Read by the metal-native leg alone.
      tier:
        description: 'metal-native only: "push" is the debug-device shape every unattended trigger takes, "deep" adds shader validation (see #617), "capture" arms the frame capture instead.'
        type: choice
        default: deep
        options: [deep, push, capture]
      # THE DISCRIMINATING KNOB FOR #614, and the reason it is an INPUT rather than a branch edit is that the
      # thing it has to split is per-boot. The metal-native leg fails roughly one varying GPU test per boot on
      # the hosted paravirtual adapter, deterministically wrong when it is wrong, and one hypothesis is the
      # shader disk caches: a warm entry read back on an unhealthy boot is a stable wrong answer, where an
      # adapter fault would be expected to vary. Splitting those needs the SAME commit run with the caches off,
      # which a workflow input gives and a code change does not.
      #
      # ALL THREE LEGS, not the metal one, which is what keeps the A/B honest. The three backends' caches are one
      # mechanism (KhaozEngine.Gpu/Internal/GpuDiskCache), so a dispatch that disabled one leg's cache would
      # compare a cacheless macOS run against cached Windows and Linux runs and could not say whether a
      # difference belonged to the cache or to the leg. Every leg reads the same value from the workflow-level
      # GPU_DISK_CACHE below.
      #
      # Default false, so every unattended dispatch, the cron and every push run exactly as before: blank is the
      # shipped default (the cache in its default location), not a third state.
      disableGpuDiskCache:
        description: 'Run with the GPU shader disk caches OFF on every leg (the #614 cache-vs-adapter split)'
        type: boolean
        default: false

# Least privilege: this workflow only checks out, builds, tests, and uploads run artifacts. No step
# writes back to the repo or publishes a package, so contents: read covers everything it does.
permissions:
  contents: read

# WHAT THE THREE BACKENDS' CACHE VARIABLES READ, as ONE expression, at the WORKFLOW level rather than per job.
# The other shared predicates in this file (VULKAN_VALIDATION_ARMED, METAL_DEEP_TIER) are job-level because
# they read `matrix`, which does not exist above a job. This one reads only the event and the input, and it has
# readers in TWO jobs: the matrix legs' test step and the sync job's. A copy per job is exactly how the pair
# would stop agreeing, and a dispatch where one job still cached would make the run's own name false.
#
# `off` is one of GpuDiskCache.ResolveDirectory's five disable words (off / 0 / false / no / none, trimmed and
# case-insensitive). Anything else is taken as a DIRECTORY PATH verbatim, which is why the disable side has to
# be a word from that set and not, say, an empty path: a typo lands the cache in a directory named after the
# typo and the run reads as cacheless while caching.
#
# EMPTY IS THE SHIPPED DEFAULT AND NOT A THIRD STATE. A blank value resolves to the default location under
# local-app-data exactly as an unset variable does, so every non-dispatch trigger is byte-identical to before
# this input existed.
env:
  GPU_DISK_CACHE: ${{ (github.event_name == 'workflow_dispatch' && inputs.disableGpuDiskCache) && 'off' || '' }}

jobs:
  # Which legs this run uses. This exists as a JOB rather than as a condition because a matrix cannot be
  # filtered by an input any other way: `strategy` is expanded before a job-level `if` is evaluated, and an
  # `if` on the steps would still boot the runner and bill for it. The selection therefore has to arrive as
  # data, which means a job that produces it.
  #
  # The leg table lives here for the same reason. Its per-leg rationale is directly above it, unchanged from
  # when it sat in `strategy.matrix.include`.
  #
  # Cost: one billed Ubuntu minute on every run of this workflow, about $1.30 a month at the August 2026
  # rate, against $5 to $25 a month saved on targeted dispatches. It is the cheapest job in the file by an
  # order of magnitude, and it is what stops the expensive legs from starting at all.
  legs:
    name: select legs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      # Whether this run's selection includes the native Vulkan leg. The sync-validation job below is a
      # SEPARATE job, so it cannot read the matrix the way a matrix leg does, and gating it on the raw
      # JSON with a substring test would tie a job's existence to jq's output formatting. This is the
      # same "selection arrives as data" argument the matrix output is built on.
      vulkan_native: ${{ steps.pick.outputs.vulkan_native }}
    steps:
      - id: pick
        shell: bash
        env:
          # Only a dispatch can choose. Every other trigger gets the whole matrix, as before.
          WANT: ${{ github.event_name == 'workflow_dispatch' && inputs.legs || 'all' }}
        run: |
          set -euo pipefail

          # `fullSuite` picks when a leg runs the whole suite vs the golden subset (see the test step's
          # filter expression, plus the cost + lavapipe-stability rationale in the header):
          #   always    - every trigger (Metal alone, on hosted macos-26)
          #   scheduled - weekly schedule + workflow_dispatch only, which is the other four legs (both D3D11
          #               legs billed 2x and both Vulkan legs 1x while the repo was private, golden subset
          #               only on push/pull_request). Both Vulkan legs' full-suite runs additionally
          #               serialize xUnit collections (KE_TEST_EXTRA_ARGS, header). Every leg is hosted and
          #               free now, so these tiers are kept for feedback speed rather than for money.
          #
          # `d3d11Adapter` is the leg's KE_D3D11_ADAPTER value, pinned to warp (decision G2). The leg pins it
          # rather than inheriting an accident of the runner image: unpinned, the selection resolves
          # DriverType.Hardware against whatever adapter the image exposes, so a golden difference could be
          # the adapter rather than the implementation. KE_D3D11_ADAPTER has exactly one reader,
          # D3D11AdapterSelection in the native backend package. Empty on macOS and Linux, where blank reads
          # as "let the API pick".
          #
          # direct3d11-native is the engine's own native D3D11 backend (decision T5), and the only Windows leg
          # since 18.0.0. It ran beside a Veldrid incumbent leg on the same runner and the same tier until
          # then, which was the point while there were two implementations of one API to compare. They shared
          # one set of goldens until 17.41.0 (decision I3) and each owned its own after (row 2 of #683), seeded
          # byte-identical from the shared set, so nothing about this leg's bytes moved when its twin left.
          # METAL RUNS ON HOSTED macos-26, which is `macos-latest` and GA. Pinned to the number, not to
          # `macos-latest`, so a future image promotion cannot silently move the GPU under a golden gate.
          # macos-14 is DEPRECATED by GitHub and is the one image that does not work at all:
          # MTLCreateSystemDefaultDevice() returns nil there even though MTLCopyAllDevices() reports an
          # "Apple Paravirtual device", and dereferencing that nil was the whole of the 363-failure run
          # 31091112757. macos-15 and macos-26 both return the device and both run the full
          # suite green (4813 passed / 1 skipped, run 31131019941 is the macos-26 one). Every golden passes on
          # the paravirtual adapter against goldens baked on real Apple silicon, because they are
          # tolerance-based. The single behavioural skip is [GpuFact(RequiresRealGpu)] (#552).
          # Do NOT "fix" a future Metal problem by moving this back to macos-14.
          #
          # Metal used to be self-hosted, and moving it off is a security improvement as much as a convenience:
          # a self-hosted runner was the only reason this PUBLIC repo needed allows_public_repositories on the org
          # runner group, and the only reason a personal machine was reachable from CI at all. With Metal hosted,
          # nothing here touches that machine, so the pull_request exclusion that used to guard it is gone too and
          # Metal covers PRs again.
          # THERE IS NO `goldenGuest` COLUMN ANY MORE, and its removal is the CI half of row 2. It marked a
          # leg that VERIFIES a golden family it does not OWN (decisions I3 and V-T1), and three places acted
          # on it: KE_UPDATE_GOLDENS was held empty, the test step sat a bake dispatch out, and the baked-
          # goldens upload was skipped. From 17.41.0 no leg is a guest, so the column would have been `''` on
          # every row with nothing reading a true value, which is a flag that cannot go wrong because it
          # cannot do anything. It is gone rather than emptied: the RULE it enforced lives in
          # GoldenCompare.BakeRefusal, which is under test, and a dead matrix column is not.
          #
          # `vulkanDevice` is the leg's KE_VULKAN_DEVICE value, pinned for the reason d3d11Adapter is pinned on
          # the Windows leg, and reaching only the native backend's selection.
          #
          # `vulkanValidation` is the tier this leg's FULL suite gates at, and only the full suite: the
          # push-path golden subset runs with validation off, because that path is the fast signal and
          # the layer is expensive. Empty means the leg installs no layer at all, which is every leg but
          # vulkan-native. `sync`, the second tier, is not a value here: it runs a different SUITE on a
          # different trigger, so it is the separate gpu-vulkan-sync job rather than a second Linux leg.
          # `metal-native` is the engine's own native Metal backend (decision M-T6), and the only macOS leg
          # since 18.0.0. It ran beside a Veldrid incumbent Metal leg on the same runner image and the same
          # `always` tier until then. They shared one set of goldens until 17.41.0 (M-I3) and each owned its
          # own after (row 2 of #683), metal-native seeded byte-identical from metal. It takes the
          # expensive tier for the reason in the header: it is the only leg in the program that runs everything
          # on real hardware, and the family it verifies carries the fleet's reference bytes.
          # It pins NO device. Windows pins its adapter and Linux pins its physical device because an unpinned
          # native selection there could land on a rasterizer nobody chose. macOS has no such choice to get
          # wrong: the native backend's default is MTLCreateSystemDefaultDevice() rather than the enumeration's
          # first element, so a pin would add a name that has to match a runner image and buy nothing.
          # KE_METAL_DEVICE stays unset.
          all='[
            {"os":"macos-26",      "backend":"metal-native",      "runner":"macos-26",                      "fullSuite":"always",    "d3d11Adapter":"",     "vulkanDevice":"",         "vulkanValidation":""},
            {"os":"windows-latest","backend":"direct3d11-native", "runner":"windows-latest",                "fullSuite":"scheduled", "d3d11Adapter":"warp", "vulkanDevice":"",         "vulkanValidation":""},
            {"os":"ubuntu-latest", "backend":"vulkan-native",     "runner":"ubuntu-latest",                 "fullSuite":"scheduled", "d3d11Adapter":"",     "vulkanDevice":"llvmpipe", "vulkanValidation":"strict"}
          ]'

          if [ "$WANT" = all ]; then
            picked=$(jq -c '.' <<<"$all")
          else
            picked=$(jq -c --arg b "$WANT" '[.[] | select(.backend == $b)]' <<<"$all")
            # An empty selection would silently pass the whole workflow with nothing tested, which reads as
            # green. Fail loudly instead: the only way here is a typo in the choice list above.
            [ "$(jq 'length' <<<"$picked")" -gt 0 ] || { echo "::error::no leg matches '$WANT'"; exit 1; }
          fi

          echo "selected legs: $(jq -r '[.[].backend] | join(", ")' <<<"$picked")"
          echo "matrix={\"include\":$picked}" >> "$GITHUB_OUTPUT"
          echo "vulkan_native=$(jq -r 'any(.[]; .backend == "vulkan-native")' <<<"$picked")" >> "$GITHUB_OUTPUT"

  gpu-golden:
    needs: legs
    name: ${{ matrix.os }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.runner }}
    # All three legs are blocking, with no continue-on-error on any of them. Each verifies its OWN golden
    # family since 17.41.0, on the rasterizer its deleted incumbent used to share (macOS paravirtual Metal,
    # Windows WARP, Linux Mesa lavapipe), and each blocks by design rather than by record: a native
    # backend's CI leg is its continuous exercise (decisions RO3, V-RO1 and M-T6), so it gates from its first
    # run. The first recorded evidence is rollout gate 1 on issues #460 and #529.
    # Goldens are tolerance-based (32x18 averaged grid), robust to software-rasterizer noise. If
    # the lavapipe leg ever flakes on a runner-image change, re-add
    # `continue-on-error: ${{ matrix.backend == 'vulkan-native' }}` here to drop it back to informational.
    #
    # Runner split: every leg is GitHub-hosted, and free, because the repo is public. Windows and Linux are
    # software rasterizers and were always hosted, so the visibility flip cost them nothing. Metal was the one
    # leg that needed real hardware, and it moved to hosted macos-26 (#552).
    # The suite tiers (the two software legs golden-only on push, decision T5) were chosen against 2x Windows
    # billing and are kept for feedback speed, re-decided against measured durations at the 18.0.0 delete.
    # The matrix keys stay on `os` (drives the OS-specific setup steps + the leg name). `runner` picks where.
    strategy:
      fail-fast: false
      # Built by the `legs` job above, which is also where the leg table and its per-leg rationale live.
      # The shape is unchanged: one combination per leg, carrying os / backend / runner / fullSuite /
      # d3d11Adapter / vulkanDevice / vulkanValidation exactly as a static `include` list would.
      matrix: ${{ fromJSON(needs.legs.outputs.matrix) }}
    env:
      # WHETHER THIS RUN ACTUALLY ARMS A VALIDATION TIER, as ONE expression with three readers, for the reason
      # Two conditions have to hold together and they come from different places: the leg must HAVE a tier (matrix.vulkanValidation, which
      # is vulkan-native alone) and this trigger must be one that runs the FULL suite, because the push-path
      # golden subset deliberately runs with validation off.
      #
      # SPLITTING THEM IS THE BUG THIS REPLACES. The layer install used to be gated on the leg column alone, so
      # a push run installed the package and hard-failed on a manifest problem while validating nothing, which
      # is a gate that can only ever produce false failures, and the artifact named for the strict tier was
      # uploaded on the push path too, carrying a log taken with validation off. Empty means no tier is armed
      # on this run, and every reader below tests for that rather than re-deriving it.
      #
      # Keeping the predicate identical to the variable's is worth more than shaving any case where the layer is
      # armed with less behind it: the install and the thing it exists to serve cannot drift apart if they are
      # the same expression.
      VULKAN_VALIDATION_ARMED: ${{ (matrix.fullSuite == 'always' || (matrix.fullSuite == 'scheduled' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) && matrix.vulkanValidation || '' }}
      # WHETHER THIS RUN ARMS METAL'S TIER ONE, as one expression with two readers (the test step's
      # MTL_DEBUG_LAYER and the mutual-exclusion guard step below). It was written inline on the test step until
      # the guard needed to read the same answer, and a guard that computes its OWN copy of a predicate can agree
      # with itself while disagreeing with the run it is guarding. The predicate itself is unchanged: tier one is
      # the native Metal leg's on every trigger, because it is an environment variable with no install and no
      # measurable cost at this scale. The whole reasoning is on MTL_DEBUG_LAYER at the test step.
      METAL_DEBUG_LAYER_TIER: ${{ (matrix.backend == 'metal-native') && '1' || '' }}
      # WHETHER THIS RUN ARMS METAL'S DEEP TIER, as ONE expression with three readers, for the reason the Vulkan
      # variable above is one expression with three: the shader-validation variable, the capture variable and the
      # artifact NAME all have to agree, and a copy per site is how they stop agreeing.
      #
      # The leg's suite tier cannot express it, which is the one structural difference from the Vulkan side. That
      # leg is `fullSuite: scheduled`, so "the deep tier" and "the full suite" are the same condition there. This
      # leg is `fullSuite: always`, so every trigger already runs the whole suite and the deep tier has to be its
      # own predicate: MTL_DEBUG_LAYER is free enough to arm on every run, and shader validation and an armed
      # capture are not.
      #
      # SCHEDULE OR DISPATCH, which is one deliberate departure from the design's "on the scheduled run". A tier
      # that can only ever be started by the cron takes its first run unattended at 18:00 on a Sunday and cannot
      # be re-run against a fix without waiting a week, and an instrument nobody can aim is not one. That is the
      # same departure the Vulkan sync job already documents and takes. A bake dispatch reaches the test step on
      # this leg since 17.41.0, and it wants the ordinary push-tier arms rather than the deep ones: a bake
      # renders to produce references, so the instrument tiers have nothing to add to it.
      #
      # AND THE SAME PRINCIPLE POINTED AT THE OTHER TWO VARIABLES, which is what the `tier` input is for. It was
      # a two-way choice while the capture was this tier's INVERSE ("every dispatch is deep" made the one trigger
      # a human can start the one trigger that cannot start a capture). #614 then measured that the capture also
      # displaces the DEBUG DEVICE, so it cannot ride the push path either, and the input became the three-way
      # choice documented on it above. This predicate is now `tier == 'deep'` exactly rather than "anything but
      # push", because 'capture' is a third shape and arming the shader rung on it would be the one combination
      # both measurements forbid.
      #
      # THE CRON NO LONGER ARMS IT, AND THAT IS #617 (https://github.com/APKiwiOrg/KhaozEngine/issues/617). This
      # tier's first ever armed run failed 186 of 6201 rows on this leg (run 31581572414), and the failure is not
      # a finding about the engine's shaders. Every golden read back as EXACTLY the pass clear colour, so the
      # clears landed and no draw produced a fragment, across every unrelated subsystem at once. Three readings
      # say the rung itself is what broke rendering on this runner rather than the rung reporting a bug:
      #   * The same commit, the same suite and the same rung are FULLY GREEN on real Apple silicon. Measured
      #     here on an M2 Max, macOS 26.5: 6202 passed, 0 failed, 0 skipped, with the sink added in 56c8ceec
      #     printing "arm tier 'Shaders' in this process's LAUNCH environment" and a device class of
      #     MTLDebugDevice, so the rung was demonstrably armed rather than quietly absent.
      #   * The rung's COST has the wrong sign on the runner, and EVERY NUMBER BELOW NAMES ITS BACKEND, because
      #     the pair this comment used to quote (5m10s without, 6m16s with, +21%) was read as though it were
      #     this leg's and cannot be: on this machine the same assembly and the same filter run about TEN TIMES
      #     faster on metal-native than on the incumbent, so a five-minute local run is the incumbent's shape
      #     and nothing this leg has ever produced. Local, on an M2 Max under macOS 26.5, running
      #     `dotnet test KhaozEngine.Render.Tests -c Release --no-build --filter "Category!=LiveSocket"` under
      #     KE_GPU_TESTS=1 (6210 rows):
      #       - KE_GRAPHICS_BACKEND=metal-native, nothing armed: 22s to 28s across two sittings.
      #       - the same plus MTL_DEBUG_LAYER=1: 22s to 28s, indistinguishable, which is the measurement the
      #         "no measurable cost at this scale" claim for tier one rests on.
      #       - the same plus MTL_SHADER_VALIDATION=1 on top: 1m19s to 1m50s, a 3.5x to 4x multiplier.
      #       - the INCUMBENT backend, which is the shape the old pair belongs to: 3m43s to 5m20s unarmed
      #         against 4m37s to 6m2s with the shader rung, +24% and +13% within their own sittings. Same
      #         command, KE_GRAPHICS_BACKEND unset. That row is HISTORY as of 18.0.0: the incumbent backend is
      #         deleted, and an unset KE_GRAPHICS_BACKEND now selects the platform native. It is kept because
      #         it is what makes the misattributed pair above legible.
      #     On the hosted Apple Paravirtual device the armed run was 7m46s (run 31581572414) against the same
      #     leg's debug-layer-only run at 10m54s (run 31585988023), 29% FASTER, which is work being dropped
      #     rather than instrumented. Local arming multiplies the time. Hosted arming divides it.
      #   * The debug layer's error mode is assert by default (row 19's measurement, in the header above), so an
      #     API objection or an in-shader bounds failure ABORTS this host. The run did not abort. Nothing
      #     objected. The rung simply produced no fragments.
      # WHAT THAT DOES NOT ESTABLISH IS THAT THE ENGINE IS CLEAN, and this comment used to claim it did. The
      # paravirtual failure is UNRESOLVED until the sink's first armed artifact, because a MetalDeviceLossLatch
      # command-buffer failure fits the observed shape exactly: it logs, it flips the device's liveness, it
      # fails no row, and drains against a dead device return immediately, so the run is FASTER and clears to
      # the pass colour without drawing, which is every symptom above. That is the same silent-loss mechanism
      # #614 (https://github.com/APKiwiOrg/KhaozEngine/issues/614) carries as a live candidate for its own
      # varying failures on this leg, so one armed artifact is likely to answer both questions or neither.
      # There is no control leg to appeal to either. The incumbent metal leg armed NEITHER Metal variable, so run
      # 31581572414's green metal leg is not the control it looks like, and 18.0.0 deleted that leg with the
      # backend under it. The `incumbentShaderValidation` dispatch input that used to arm a control there went
      # with it, so #617's control is now a dispatch of THIS leg at `tier: push` against one at `tier: deep`.
      # The cron is always deep, so leaving this as it was turns the whole matrix red every Sunday on a rung
      # that cannot testify about the code. It is now DISPATCH ONLY: a human aims it, on purpose, at a
      # question worth asking, and the cron keeps MTL_DEBUG_LAYER (armed on every run of this leg, below). It no
      # longer keeps the frame capture beside it: #614 measured that the capture displaces the debug device, so
      # the cron used to carry two instruments of which the armed one was the one it was not investigating.
      # #617 stays open with the diagnosis.
      # THE ABORT THAT USED TO GATE ALL OF THIS IS UNDERSTOOD, and the reason is no longer that nobody knows
      # what aborts. It was
      #     -[MTLDebugRenderCommandEncoder validateCommonDrawErrors:]:6001: failed assertion
      #     `Draw Errors Validation / Fragment Function(main0): missing Buffer binding at index 0 for _14[0].'
      # the layer at its default assert error mode killing the process, exactly as row 19 measured on the native
      # side. #621 (https://github.com/APKiwiOrg/KhaozEngine/issues/621) ATTRIBUTED it by filter bisection to ONE
      # row, GpuSkinningReproGpuTests.FoldMatrixIntoBoneBuffer_VertexReadsOneResource_ReadsEveryBone. MM6's own
      # control was not the source and never was: that half already stands down under the layer. This row is the
      # SAME split-stage shape from a different file, the offscreen record of the original skinned-model failure
      # that #604 keeps, and it provoked the layer for the same reason MM6's control did. It stood down under
      # the layer on the INCUMBENT alone, so the native leg keeps asserting it. Measured on this branch on an
      # M2 Max: KhaozEngine.Render.Tests at Category!=LiveSocket with KE_GRAPHICS_BACKEND unset, KE_GPU_TESTS=1
      # and MTL_DEBUG_LAYER=1 runs to completion, 6217 passed, 0 failed, 0 skipped, where it used to abort after
      # about a thousand rows in under two seconds.
      # So arming this leg is UNBLOCKED rather than done. It is not flipped on here because a blocking golden leg
      # is the wrong place to find the next provoking row: the layer's error mode gates the SUITE rather than a
      # row, hosted macos-26 is not the machine that measurement was taken on, and the way the native leg earned
      # the layer was a dispatch first. That dispatch is #617's control experiment to make.
      METAL_DEEP_TIER: ${{ (matrix.backend == 'metal-native' && github.event_name == 'workflow_dispatch' && inputs.tier == 'deep') && '1' || '' }}
      # WHETHER THIS RUN ARMS THE FRAME CAPTURE, as one expression with two readers (the variable and the
      # artifact name), for the reason the two predicates above are one expression each.
      #
      # A DISPATCH AND NOTHING ELSE, which is the #614 change. This used to be METAL_DEEP_TIER's inverse, so it
      # was armed on every push, every pull request and every cron, and that is precisely the arrangement that
      # left the debug layer inert on every unattended run of this leg: the capture makes the device a
      # CaptureMTLDevice instead of an MTLDebugDevice, measured on real Metal and quoted in full on the `tier`
      # input above. The instrument the unattended triggers exist to carry is the debug layer, so the capture is
      # the one that moves to an attended trigger.
      METAL_CAPTURE_TIER: ${{ (matrix.backend == 'metal-native' && github.event_name == 'workflow_dispatch' && inputs.tier == 'capture') && '1' || '' }}
    steps:
      # THE TIER-EDIT GUARD (https://github.com/APKiwiOrg/KhaozEngine/issues/614), and the only step in this job
      # that asserts something about THIS FILE rather than about the engine. It runs before the checkout because
      # it needs nothing from the repository, and the whole point is to red the job on the first push that gets
      # the plumbing wrong rather than eight minutes later.
      #
      # WHAT IT ENCODES IS A MEASUREMENT. On Apple hardware MTL_CAPTURE_ENABLED and MTL_DEBUG_LAYER are mutually
      # exclusive in practice: arming the capture makes the device come back as CaptureMTLDevice, which displaces
      # the MTLDebugDevice that performs the API validation, so a process with both armed is running with an
      # INERT debug layer while its log, its artifact name and its job summary all say it is validating. The two
      # readings are quoted in full on the `tier` input at the top of this file and in docs/CROSS-PLATFORM.md.
      #
      # WHY A GUARD AND NOT JUST THE COMMENT. The re-tier that followed #614 took the capture off every
      # unattended trigger, and every word of the reasoning lives in comments an editor is free to not read. A
      # future edit of the three `tier` predicates that re-armed both would be invisible: nothing fails, the
      # suite stays green, and the leg's tier-one instrument goes quiet again for however long it takes somebody
      # to notice, which the first time around was a fortnight of artifacts in which the layer never objected to
      # anything.
      #
      # AND IT ASSERTS THE INVERSE TOO, because "not both" is satisfied by arming NEITHER. The leg design
      # promises that an unattended trigger carries the debug layer, so an edit that dropped tier one entirely
      # would pass the exclusion check while removing the gate, which is the same outcome by a different route.
      #
      # IT IS SCOPED TO THE UNATTENDED TRIGGERS, AND THAT IS NOT A LOOPHOLE. The `capture` dispatch tier arms
      # BOTH variables on purpose (see the three shapes on the `tier` input): the debug layer rides every run of
      # this leg, and the capture tier adds the capture on top, knowing the layer goes inert, because starting a
      # real GPU-trace capture is the whole point of that tier and the device-class line plus the
      # MetalDeviceLossLatch stream are worth keeping in its artifact. A universal assertion would red the one
      # tier that arms the pair deliberately. What must never happen is the pair arriving where nobody chose it,
      # which is exactly push, pull_request and schedule.
      #
      # macOS legs only. Every Metal variable is empty by construction on the Windows and Linux legs, so running
      # there would assert that two empty strings are empty.
      - name: Assert the Metal instruments are not both armed
        if: runner.os == 'macOS'
        shell: bash
        env:
          # Read from the job variables the test step reads, deliberately, so this cannot drift from what the run
          # actually arms. A copy of the expressions here would be a second source of truth for the one fact the
          # step exists to check.
          MTL_DEBUG_LAYER: ${{ env.METAL_DEBUG_LAYER_TIER }}
          MTL_CAPTURE_ENABLED: ${{ env.METAL_CAPTURE_TIER }}
          LEG: ${{ matrix.backend }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail

          why="MTL_CAPTURE_ENABLED displaces the debug device: with the capture armed the Metal device comes back as CaptureMTLDevice rather than the MTLDebugDevice that does the validating, so the two instruments are mutually exclusive in practice. Measured on real Metal. See https://github.com/APKiwiOrg/KhaozEngine/issues/614 and the Metal native leg in docs/CROSS-PLATFORM.md."

          fail() {
            echo "::error title=Metal instrument tiers::$1 $why"
            exit 1
          }

          # The triggers nobody is watching. A workflow_dispatch is aimed by a human who picked a tier and can
          # read the log, and the `capture` tier arms both variables by design, so a dispatch asserts nothing.
          case "$TRIGGER" in
            push | pull_request | schedule) unattended=1 ;;
            *) unattended='' ;;
          esac

          if [ -n "$unattended" ]; then
            if [ -n "${MTL_DEBUG_LAYER:-}" ] && [ -n "${MTL_CAPTURE_ENABLED:-}" ]; then
              fail "The $LEG leg would run this unattended $TRIGGER with BOTH MTL_DEBUG_LAYER and MTL_CAPTURE_ENABLED armed, which arms the capture and leaves the debug layer inert."
            fi

            if [ "$LEG" = metal-native ]; then
              [ -n "${MTL_DEBUG_LAYER:-}" ] || fail "The metal-native leg has no MTL_DEBUG_LAYER on the unattended $TRIGGER trigger, so the leg's tier-one validation gate would not run at all."
              [ -z "${MTL_CAPTURE_ENABLED:-}" ] || fail "The metal-native leg has MTL_CAPTURE_ENABLED armed on the unattended $TRIGGER trigger, where the debug layer alone belongs and the capture is a dispatch tier of its own."
            fi
          fi

          echo "metal instruments on $LEG / $TRIGGER (unattended='${unattended}'): MTL_DEBUG_LAYER='${MTL_DEBUG_LAYER:-}' MTL_CAPTURE_ENABLED='${MTL_CAPTURE_ENABLED:-}'"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      # local-feed is git-ignored (dev inner-loop); create it so the nuget.config 'local' source resolves.
      - run: mkdir -p local-feed
        shell: bash

      - run: dotnet restore

      - run: dotnet build -c Release --no-restore

      # TRIPWIRE for the Linux native load path. Silk.NET resolves its natives through its OWN path resolver,
      # which on Linux asks for the distro rid (ubuntu.24.04-x64) and so never looks under runtimes/linux-x64,
      # where the packages ship them. Directory.Build.targets copies the host rid's natives flat into the output
      # for exactly that reason, and the comment there carries the full story. When that copy stops happening the
      # symptom is hundreds of tests failing inside a shaderc type initializer, which reads like a shader bug and
      # is not one, so assert the files are where the resolver looks instead.
      - name: Assert the host natives landed beside the assemblies (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          out=KhaozEngine.Render.Tests/bin/Release/net10.0
          for lib in libshaderc_shared.so libspirv-cross.so; do
            test -f "$out/$lib" || { echo "MISSING: $out/$lib"; ls -l "$out" | head -40; exit 1; }
          done
          ls -l "$out"/*.so

      # Linux: install Mesa lavapipe (software Vulkan) + the loader. The lavapipe ICD manifest's path/name
      # drifts across Ubuntu runner images, so DISCOVER it rather than hardcoding (the old hardcoded
      # /usr/share/vulkan/icd.d/lvp_icd.x86_64.json went missing and gave "Found no drivers!"). Dump what the
      # package shipped so a future drift is diagnosable from the log.
      - name: Install software Vulkan (lavapipe)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
          echo "--- mesa-vulkan-drivers contents (icd / lvp / .so) ---"
          dpkg -L mesa-vulkan-drivers 2>/dev/null | grep -Ei 'icd|lvp|\.so' || true
          echo "--- ICD manifests on disk ---"
          ls -la /usr/share/vulkan/icd.d/ /etc/vulkan/icd.d/ 2>/dev/null || true

      - name: Point Vulkan loader at lavapipe
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -x
          icd=$(find /usr /etc -name 'lvp_icd*.json' 2>/dev/null | head -1)
          if [ -z "$icd" ]; then
            echo "::error::lavapipe ICD manifest not found after installing mesa-vulkan-drivers"
            find /usr /etc -name '*_icd*.json' 2>/dev/null || true
            exit 1
          fi
          echo "lavapipe ICD: $icd"; cat "$icd" || true
          # VK_ICD_FILENAMES (loader < 1.3.207) + VK_DRIVER_FILES (newer loaders); set both for safety.
          { echo "VK_ICD_FILENAMES=$icd"; echo "VK_DRIVER_FILES=$icd"; } >> "$GITHUB_ENV"

      # THE VALIDATION LAYER IS AN INSTALL, NOT A KNOB, and this step is the first one this repo has ever had
      # (decision V-T4). Before it, `VK_LAYER`, `VK_INSTANCE_LAYERS` and `vulkan-validationlayers` had zero hits
      # across every workflow, script and source file, and the Vulkan legs' own layer enumeration listed three
      # Mesa and Intel layers with no Khronos validation among them. `VK_EXT_debug_utils` is an instance
      # EXTENSION, so the messenger the engine pumps through needs no install, but the LAYER cannot be turned on
      # with an environment variable.
      #
      # ONLY ON A RUN THAT ARMS A TIER, which is the leg column AND the trigger together (the
      # VULKAN_VALIDATION_ARMED job env above, and the same value the test step passes as
      # KE_VULKAN_VALIDATION). Gating on the leg column alone was wrong in both directions on the push path: it
      # installed an apt package a golden-subset run has no use for, and it ran the hard manifest check below
      # against a run that would not have validated anything even with the layer present, so the only outcome
      # it could produce there was a false failure. The incumbent Vulkan leg never installed the layer on any
      # trigger, because it was the indefinitely-selectable escape hatch of decision V-RO2 and a package rename
      # on a future runner image would have reddened the very leg the native backend escaped to. That leg was
      # deleted in 18.0.0, so the leg column now selects one Linux leg and the trigger does the rest.
      #
      # THE MANIFEST CHECK IS THE POINT OF THE STEP, not a nicety, and it stays HARD on the armed runs. A
      # missing layer does not fail anything by itself: the engine WARNs, names what to install, and creates
      # the device without it, which is right on a developer box and is a silently vacuous gate here. #423
      # records a push-triggered golden gate degrading for weeks with nobody noticing, and a validation gate
      # that quietly stops validating is that failure with no pixels to eventually give it away.
      - name: Install the Khronos validation layer (Linux)
        if: matrix.os == 'ubuntu-latest' && env.VULKAN_VALIDATION_ARMED != ''
        run: |
          set -x
          sudo apt-get install -y vulkan-validationlayers
          echo "--- layer manifests on disk ---"
          ls -la /usr/share/vulkan/explicit_layer.d/ /etc/vulkan/explicit_layer.d/ 2>/dev/null || true
          layer=$(grep -rl VK_LAYER_KHRONOS_validation /usr/share/vulkan /etc/vulkan 2>/dev/null | head -1)
          if [ -z "$layer" ]; then
            echo "::error::VK_LAYER_KHRONOS_validation is not on this runner after installing vulkan-validationlayers, so KE_VULKAN_VALIDATION would warn and run without it, and this leg's validation gate would pass while validating nothing"
            exit 1
          fi
          echo "Khronos validation layer manifest: $layer"

      # No --summary, deliberately (decision V-D7 of docs/design/VULKAN-NATIVE-BACKEND-DESIGN-2026-08-05.md).
      # The summary prints the driver and the API version and NO device limits at all, so no Vulkan device limit
      # has ever been observable anywhere in this repo, and every limit that design touches rests on a spec
      # minimum plus an assumption (MV10). The full dump lands the whole VkPhysicalDeviceLimits block in every
      # Vulkan leg log instead. The step is already continue-on-error, so the cost is log volume. The observed
      # lavapipe values get recorded once a run has them: https://github.com/APKiwiOrg/KhaozEngine/issues/541
      #
      # It is teed to a FILE as well as to the log, and uploaded below, because the recording is the whole point
      # of the change and a job log is not a workable source for it: the limits block is thousands of lines deep
      # in a run that also holds a full test suite, log retention is shorter than artifact retention, and the
      # numbers have to be quotable verbatim into section 2.1 of the design. `continue-on-error` stays, so a
      # runner without vulkaninfo costs an empty file rather than a red leg.
      - name: Vulkan diagnostics
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p vulkan-diagnostics
          vulkaninfo 2>&1 | tee vulkan-diagnostics/vulkaninfo.${{ matrix.backend }}.txt || true

      # MV10's evidence, uploaded on always() for the reason the golden deltas are: a limit this design spends
      # is read off a GREEN run, and a failure-only artifact could only ever show it after something broke.
      # Kilobytes of text. ignore = no spurious failure on a leg that never ran the step.
      - name: Upload Vulkan device limits
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vulkan-device-limits-${{ matrix.backend }}
          path: vulkan-diagnostics/vulkaninfo.*.txt
          if-no-files-found: ignore

      # DECISION S5's CI leg, one Windows leg only and on EVERY trigger. These are plain [Fact]s with no device: they
      # cross-compile every shipped shader program to HLSL and run FXC over the result, then assert the reflected
      # vertex input signature has contiguous TEXCOORD indices from 0. FXC is d3dcompiler, so Windows is the only
      # OS that can run it, and this step is the only thing in CI that compiles the HLSL the engine actually emits.
      #
      # It is a SEPARATE step rather than part of the suite run below, because the Windows legs' push-path filter
      # is "FullyQualifiedName~Golden" and that family is device-backed pixel comparisons. Naming these tests
      # "Golden" to get them selected would put a CPU compile inside it. Selecting them by name here keeps the
      # naming contract intact and runs them on push, not only on the weekly schedule.
      #
      # No KE_GPU_TESTS and no backend selection: nothing here creates a device. Cheap enough (seconds) that it
      # runs before the suite, so a rejected shader fails fast instead of after a full golden pass.
      #
      # ZERO MATCHES MUST FAIL. A filter that matches nothing still exits 0, and those four cases early-return
      # PASSED on every non-Windows leg, so this step is the only place they have teeth: a class rename would
      # disarm the FXC coverage permanently and every leg would stay green.
      # `RunConfiguration.TreatNoTestsAsError` is what turns a zero match into a failure, and BOTH details of how
      # it is passed here were measured rather than assumed (SDK 10.0.302, Microsoft.NET.Test.Sdk 17.11.1).
      # It is a runsettings argument, not the documented `-p:VSTestTreatNoTestsAsError=true` MSBuild property,
      # because that property is a no-op on this stack: a run with zero matches still exits 0 with it set, over
      # one project or over the solution, so it reads as a fix while changing nothing.
      # And it is scoped to the ONE test project that owns these tests, because run over the whole solution the
      # setting fails on each of the other 17 test projects, where matching zero is the correct outcome.
      - name: Shader FXC validation (no device)
        # THE ONE WINDOWS LEG. Nothing here creates a device or selects a backend, so the compile is device-free
        # and backend-independent, and it used to be pinned to `direct3d11` because the incumbent and native
        # Windows legs would otherwise run byte-identical work twice at the Windows 2x rate. 18.0.0 deleted the
        # incumbent leg, so this moved to `direct3d11-native`, which is now the only Windows leg there is.
        # The pin key is LOAD-BEARING. Rename or retire that leg and this step silently stops running, with
        # nothing failing anywhere: the TreatNoTestsAsError guard below catches a test-class rename, not a
        # matrix-key rename.
        if: matrix.backend == 'direct3d11-native'
        run: dotnet test KhaozEngine.Render.Tests/KhaozEngine.Render.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~D3D11FxcValidationTests" -- RunConfiguration.TreatNoTestsAsError=true
        shell: bash

      # Suite selection per leg + trigger (the cost + stability split in the header):
      #   * fullSuite: always (metal-native): the FULL suite on every trigger - "Category!=LiveSocket",
      #     mirroring ci.yml's exclusion (LiveSocket needs a live network peer, not available here).
      #   * fullSuite: scheduled (direct3d11-native, vulkan-native): golden tests only on push/PR
      #     ("FullyQualifiedName~Golden"), the FULL suite on schedule + workflow_dispatch. D3D11: full hosted
      #     Windows measured +19 billed 2x minutes per run vs golden-only (17m14s vs 7m44s, runs
      #     29542939552 / 29545657401), and the native leg's own full suite measured 25m43s in run
      #     32579723071, so per-push hosted coverage stays golden-only and the weekly cron
      #     carries the full sweep (decision T5, re-decided at the 18.0.0 delete: see the header).
      #     The Vulkan leg takes the same tier, and its full-suite runs serialize xUnit
      #     test collections (KE_TEST_EXTRA_ARGS below) because lavapipe under full parallel load still shows
      #     residual driver-side instability after the four engine-defect fixes (see the header). The native
      #     Vulkan leg inherited that serialisation on day one rather than claiming to have fixed it, and MV7 is
      #     the experiment that takes it off that leg alone if four green weeks plus one unserialized dispatch
      #     ever earn it.
      #
      # NO LEG SITS A BAKE DISPATCH OUT ANY MORE. This step used to carry a condition skipping it on either
      # guest leg, because a guest owned no family and could only have verified references being replaced
      # mid-run. From 17.41.0 every leg owns the family it reads (row 2 of #683), so every leg is a bake leg
      # and the condition is gone with the goldenGuest column it read.
      - name: Run test suite
        env:
          KE_GPU_TESTS: '1'
          KE_GRAPHICS_BACKEND: ${{ matrix.backend }}
          # The Windows leg pins the adapter (decision G2, matrix comment above). Empty on macOS and Linux,
          # and blank is parsed as "let DXGI pick". Read only by the native backend's adapter selection.
          KE_D3D11_ADAPTER: ${{ matrix.d3d11Adapter }}
          # The Linux leg pins the physical device (decision V-G2, matrix comment above). Empty on Windows
          # and macOS. Read only by the native backend's physical-device selection.
          KE_VULKAN_DEVICE: ${{ matrix.vulkanDevice }}
          # ONLY THE LEG BUILT TO HAVE A NATIVE VULKAN DEVICE DECLARES ONE MANDATORY. Every row that needs one
          # asks VulkanDormancy.NativeDeviceAvailable and returns early when the functional probe refuses the
          # machine, which is right on a developer box and on the two legs that are not Linux. On THIS leg that
          # early return is a test that asserted nothing and reported green, and the zero-skipped criterion of
          # rollout gate 2 cannot see it, because a dormant row does not skip. With the variable set the helper
          # THROWS instead, naming what VulkanSupportProbe.MissingRequirement objected to, so a loader or driver
          # regression reds the leg. Unset everywhere else, which is what keeps every developer box dormant
          # exactly as before.
          KE_VULKAN_REQUIRED: ${{ (matrix.backend == 'vulkan-native') && '1' || '' }}
          # THE SAME DECISION ON THE THIRD BACKEND, and the same reason (decision M-T6, phase 3's row-19 lesson
          # inherited by name). Every Metal row that needs a native device routes its dormancy through
          # MetalDormancy, whether through NativeDeviceAvailable or through the inline copy of the same pair some
          # of them carry, and returns early when the machine cannot provide one, which is right on a Windows box
          # and on a Linux box. On THIS leg that early return is a test that asserted nothing and reported green.
          # With the variable set the helper THROWS instead, naming what the machine objected to in the probe's
          # own words, so a runner-image regression that took the Metal device away reds the leg rather than
          # quietly emptying the rows it was built for.
          #
          # It used to be unset on the incumbent Metal leg, exactly as KE_VULKAN_REQUIRED was unset on the
          # incumbent Vulkan leg: those were the escape hatches decisions M-RO2 and V-RO2 kept selectable until
          # the closing act, and an escape hatch that goes red whenever the thing it escapes from goes red is
          # not one. The closing act is 18.0.0, and both legs went with it.
          KE_METAL_REQUIRED: ${{ (matrix.backend == 'metal-native') && '1' || '' }}
          # TIER ONE OF METAL'S VALIDATION GATE (decision M-T7): API validation, on EVERY run of the native Metal
          # leg. It is an environment variable with no install, no apt package and no manifest to check, which is
          # what makes "every run" affordable here where the Vulkan layer's cost bought it a weekly slot. The
          # Metal runtime reads it before the first device exists, which is why it is set as a job variable
          # rather than through the engine's own KE_METAL_VALIDATION knob: that knob REPORTS which tier is really
          # armed and warns when a process asked for one it cannot have, and this is what actually arms it.
          #
          # THE PREDICATE ITSELF MOVED UP to the METAL_DEBUG_LAYER_TIER job variable, unchanged, so the guard
          # step at the top of this job asserts the same answer this line arms rather than a copy of it.
          MTL_DEBUG_LAYER: ${{ env.METAL_DEBUG_LAYER_TIER }}
          # TIER TWO (decision M-T7): in-shader bounds checking, on the deep tier only. It instruments every
          # shader, so it is the expensive half, and it is a DISPATCH rather than the weekly slot the Vulkan
          # strict tier holds, because #617 measured it rendering nothing at all on this runner. The predicate
          # lives once, in the METAL_DEEP_TIER job env above, with the whole reasoning beside it.
          #
          # ONE LEG ARMS THIS. A second predicate lived here until 18.0.0, arming the rung on the INCUMBENT
          # Metal leg as #617's control experiment (whether the paravirtual runner drops work under the rung for
          # any backend or only for ours). That leg is deleted, so the control is now a `tier: push` dispatch of
          # this leg against a `tier: deep` one.
          MTL_SHADER_VALIDATION: ${{ env.METAL_DEEP_TIER != '' && '1' || '' }}
          # NOT A VALIDATION TIER, and its trigger is the INVERSE of tier two's, which is a measurement rather
          # than a preference. Metal refuses a GPU-trace capture destination in a process that did not have this
          # set at launch, so without it MetalFrameCaptureTests asserts only that an unarmed process refuses, and
          # with it the capture really starts from the native queue pointer and writes a .gputrace bundle the row
          # asserts and deletes. That is the one thing in the net that exercises the capture interop end to end.
          #
          # TWO MEASUREMENTS PUT IT HERE RATHER THAN ON THE DEEP SWEEP. First, it CANNOT share a process with
          # MTL_SHADER_VALIDATION: with the shader rung armed, MTLCaptureManager still reports the GPU-trace
          # destination as supported and startCapture returns false, so the capture arm would fail on a platform
          # fact. With MTL_DEBUG_LAYER alone, or with neither, it starts and writes. Second, the reason it was
          # originally proposed for the scheduled sweep alone was cost, and the cost is seconds. Re-measured on
          # this commit, on an M2 Max, on THIS leg's own backend (KE_GRAPHICS_BACKEND=metal-native,
          # MTL_DEBUG_LAYER=1, KhaozEngine.Render.Tests at Category!=LiveSocket, 6210 rows): 22.4s without it
          # against 25.0s with it. That is about +11% of a 22-second assembly: a different-looking number from
          # the 4m39s-against-4m37s pair this comment used to quote, whose backend was never recorded and whose
          # magnitude fits the incumbent's shape rather than this leg's, and the same conclusion either way.
          # Two and a half seconds does not buy confining the one row that exercises the capture interop end to
          # end to a weekly sweep. So it rides EVERY trigger, which is strictly more coverage than the design
          # asked for, and stands aside on the one trigger that arms the rung it cannot live with.
          #
          # AND A THIRD MEASUREMENT MOVED IT OFF EVERY UNATTENDED TRIGGER
          # (https://github.com/APKiwiOrg/KhaozEngine/issues/614). This variable is not exclusive with the shader
          # rung alone. It is exclusive with the DEBUG DEVICE as well: with it set, the device comes back as
          # CaptureMTLDevice rather than MTLDebugDevice, and MTLDebugDevice is the class that performs the API
          # validation. Both readings are quoted in full on the `tier` input at the top of this file. So the
          # arrangement this replaces, capture on every trigger except the deep dispatch, meant the leg's tier-one
          # instrument was disarmed on every push, every pull request and every cron it has ever run, which is why
          # #614 has a fortnight of debug-layer artifacts in which the layer never objected to anything.
          #
          # THE TRADE IS NOW THE OTHER WAY ROUND, and the two and a half seconds above stopped being the argument
          # the moment the cost turned out to be the instrument rather than the clock. The capture is a dispatch
          # tier of its own (`tier=capture`), so MetalFrameCaptureTests' POSITIVE arm, the one that starts a
          # capture from the native queue pointer and asserts the bundle it writes, is attended-only coverage, and
          # its negative arm rides every unattended trigger. Recorded rather than regretted: a validation
          # instrument that is disarmed whenever nobody is watching is worth less than a capture interop that is
          # exercised when somebody is.
          MTL_CAPTURE_ENABLED: ${{ env.METAL_CAPTURE_TIER }}
          # TIER ONE OF THE VALIDATION GATE (decision V-T4): core validation, error severity fails the leg at a
          # controlled point rather than inside the driver callback. On the FULL suite only, which is the same
          # schedule-and-dispatch condition KE_TEST_FILTER selects on below: the push path is the fast signal and
          # the layer is expensive, and a broad sweep is worth its cost once a week. Warning and performance
          # severities are logged, never failed, because a performance warning is an opinion. Tier two is `sync`,
          # in the gpu-vulkan-sync job, and it does NOT latch, so that job carries its own log scan instead.
          #
          # The predicate lives once, in the VULKAN_VALIDATION_ARMED job env above, because the layer install
          # and the strict-tier artifact upload have to agree with this variable exactly and a copy per site is
          # how they stopped agreeing. Empty means no tier is armed on this run.
          KE_VULKAN_VALIDATION: ${{ env.VULKAN_VALIDATION_ARMED }}
          # WHAT PUTS THE ENGINE'S OWN VALIDATION LINES IN THE ARTIFACT (#565), and it takes both halves. The
          # test host configures a console sink when KE_VULKAN_VALIDATION arms a rung (see
          # KhaozEngine.Render.Tests/Gpu/GpuValidationConsoleLogging.cs, which owns the single Log.Configure
          # call that assembly makes and takes its Vulkan half from VulkanValidationConsoleLogging and its
          # Metal half from MetalValidationConsoleLogging), which is the half that gives the
          # pump somewhere to write at all: the ambient Log facade hands out a no-op logger until something
          # calls Log.Configure, and nothing in that process ever did, so every warning-severity message the
          # tiers exist to surface was dropped. THIS is the other half. vstest forwards the test host's stdout
          # only at detailed console verbosity, so at the default the sink writes into a stream the runner
          # discards and the artifact is empty for a second, entirely separate reason. Detailed verbosity also
          # prints one `Passed <TestName>` line per test, which is what makes the interleaving this artifact is
          # for real rather than described.
          #
          # ARMED RUNS ONLY, so the push path's log keeps its current size and shape. The `;` inside the value
          # survives the unquoted expansion below: bash word-splits an expansion, it does not re-parse shell
          # metacharacters in it.
          #
          # The scope is the Vulkan backend's own log categories, not the whole engine. The Khronos layer's own
          # output is independent of all of this and lands in the log whether or not the sink was configured.
          #
          # AND NOW THE METAL LEG TOO, WHICH IS THE OTHER HALF OF #617
          # (https://github.com/APKiwiOrg/KhaozEngine/issues/617). That issue's artifact held no Metal diagnostic
          # at all, and BOTH halves were missing. 56c8ceec fixed the first: the test host configures a sink for
          # the Metal categories when a Metal rung is armed, where before every line went nowhere at all. This
          # is the second. The sink writes to the host's stdout, and vstest forwards a test host's stdout only at
          # detailed console verbosity, so without this the lines land in a stream the runner discards and the
          # artifact is empty for a second, entirely separate reason. That is exactly the pair #565 had to fix on
          # the Vulkan side.
          #
          # THE LOGGER FOLLOWS THE INSTRUMENT on the Metal side: this predicate is MTL_DEBUG_LAYER's own,
          # `matrix.backend == 'metal-native'` and nothing else, so detailed verbosity is armed on exactly the
          # runs a Metal rung is armed on. It was schedule-and-dispatch first, for a size argument, and that
          # left the artifact upload below (always(), on every run of this leg) producing a push-path artifact
          # named for the debug layer whose engine-side half was missing: the sink WAS configured, its
          # announcement went to a stream vstest discarded, and a reader could not tell that from a run where
          # the sink never existed. That is the same "an artifact whose name is false is worse than a missing
          # one" rule the strict-tier upload is gated by, one step earlier in the chain.
          #
          # THE SIZE ARGUMENT DID NOT SURVIVE MEASUREMENT. This leg is `fullSuite: always`, so there is no
          # cheaper push tier to protect: every trigger already runs the whole 6210-row suite, and that suite's
          # detailed console output measured 1.5MB to 1.6MB across two sittings on this commit, which is a
          # rounding error against an artifact this leg uploads either way.
          #
          # The Vulkan half of the expression is unchanged and stays keyed to VULKAN_VALIDATION_ARMED: that
          # leg is `fullSuite: scheduled`, its rungs really are schedule-and-dispatch only, and the same
          # follow-the-instrument rule therefore already holds there.
          #
          # ONE KNOWN SIDE EFFECT, and it is a levelling rather than a regression: the device-evidence step's
          # `tail -n 200 TestResults/suite-output.log` now reads a detailed tail on the push path too, where a
          # `Passed <TestName>` line per test crowds out some of what a terse tail would have carried. Every red
          # run #614 has actually read came off the cron or a dispatch, which were detailed already, so this
          # makes the push tail match the tail that instrument was designed against instead of diverging from it.
          #
          KE_TEST_LOGGER_ARGS: ${{ (env.VULKAN_VALIDATION_ARMED != '' || matrix.backend == 'metal-native') && '--logger console;verbosity=detailed' || '' }}
          # THE THREE SHADER DISK CACHES, ALL FROM ONE VALUE (#614). Blank on every ordinary trigger, which is
          # the shipped default location, and `off` on a dispatch that asked for it. Each variable belongs to one
          # backend and is inert on the other two legs, so setting all three on every leg costs nothing and is
          # what makes the cacheless dispatch uniform: KE_METAL_MSL_CACHE is MetalMslCache's, KE_D3D11_SHADER_CACHE
          # is D3D11DxbcCache's and KE_VULKAN_PIPELINE_CACHE is VulkanPipelineCacheFile's, and all three resolve
          # through GpuDiskCache, which is where the disable words live.
          KE_METAL_MSL_CACHE: ${{ env.GPU_DISK_CACHE }}
          KE_D3D11_SHADER_CACHE: ${{ env.GPU_DISK_CACHE }}
          KE_VULKAN_PIPELINE_CACHE: ${{ env.GPU_DISK_CACHE }}
          # AND THE IN-MEMORY ONE, from the same value (#640). SpirvCompileCache is not a disk cache and holds
          # nothing across boots, so it cannot serve the stale entry #614 is looking for. It CAN serve one bad
          # emission to every test in a process, which is a shape a cacheless A/B has to be able to rule out, and
          # a run described as cacheless that still memoized would be describing itself falsely. It takes the same
          # five disable words, so the one value drives all four.
          KE_SPIRV_CACHE: ${{ env.GPU_DISK_CACHE }}
          # ARMED ON EVERY LEG ON A BAKE DISPATCH since 17.41.0. It used to be held empty on the two guest legs
          # for every trigger (decisions I3 and V-T1), because GoldenCompare.BakeRefusal turns KE_UPDATE_GOLDENS=1
          # under a family the backend does not own into a hard failure BY DESIGN, and a routine bake for some
          # unrelated new scene would have reddened a guest leg with 36 refusals. Every leg owns its family now
          # (row 2 of #683), so the refusal has nothing to fire on and each leg bakes exactly the grids it is
          # itself checked against, which is what owning a family means. The refusal itself is unchanged and
          # still guards the rule for the next backend that shares rather than owns.
          KE_UPDATE_GOLDENS: ${{ (github.event_name == 'workflow_dispatch' && inputs.bake) && '1' || '' }}
          KE_TEST_FILTER: ${{ (matrix.fullSuite == 'always' || (matrix.fullSuite == 'scheduled' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) && 'Category!=LiveSocket' || 'FullyQualifiedName~Golden' }}
          # BOTH Vulkan legs' full-suite runs: serialize xUnit collections, one live device at a time
          # (~22 min serialized vs minutes parallel, header). Empty for every other leg and for
          # golden-only runs (months of parallel green history). It is named rather than matched on a prefix
          # because MV7 takes serialisation off this leg if it wins, and a prefix match would take it off any
          # future Linux leg with it.
          KE_TEST_EXTRA_ARGS: ${{ (matrix.backend == 'vulkan-native' && matrix.fullSuite == 'scheduled' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && '-- xUnit.ParallelizeTestCollections=false' || '' }}
        # Plain --blame (no --blame-crash) is kept permanently: it only writes a tiny Sequence.xml naming the
        # last-started test if the host dies (no dump utility attached, no measurable overhead), and a lavapipe
        # native crash without it is unattributable - an unnamed crash on the unattended weekly cron would cost
        # a full diagnostic re-run. The 200MB dump collection (--blame-crash) stays off.
        #
        # TEED TO A FILE because validation messages arrive as ordinary log lines interleaved with test names,
        # and that interleaving IS the diagnostic: a warning is only actionable next to the test that provoked
        # it. The job log holds the same bytes, but it expires sooner than an artifact and cannot be diffed
        # against last week's run. pipefail is set explicitly rather than relied on: it IS the default for
        # `shell: bash` here, and a gating command whose exit code depends on an implicit shell option is one
        # runner-image change away from a suite that fails green.
        run: |
          set -o pipefail
          mkdir -p TestResults
          dotnet test -c Release --no-build --filter "$KE_TEST_FILTER" --blame --results-directory TestResults $KE_TEST_LOGGER_ARGS $KE_TEST_EXTRA_ARGS 2>&1 | tee TestResults/suite-output.log
        shell: bash

      # WHAT THE BOOT'S GPU ACTUALLY WAS (#614), on the macOS leg. That issue's whole difficulty is that a red
      # run tells you the name of a test and nothing about the machine it failed on: the metal-native leg fails
      # roughly one varying GPU test per boot on the hosted Apple Paravirtual device, bit-identically wrong when
      # it is wrong, while the same commit passes on real Metal locally. The runner image version is already
      # known to be identical across green and red attempts, so the next readings worth having are the
      # device's own. The incumbent Metal leg that used to run beside it as a same-boot control is deleted
      # (18.0.0), so the control is now this leg's own green runs.
      #
      # ALWAYS RATHER THAN failure(), WHICH IS THE POINT OF THE INSTRUMENT. The question is what DIFFERS between
      # a red boot and a green one, and a failure-only capture has nothing to difference against: it would
      # produce a red boot's facts and no baseline anywhere. That matters more now than it did with a control
      # leg beside it, because a green run of THIS leg is the only baseline left.
      #
      # IT CANNOT RED A GREEN LEG. continue-on-error plus `|| true` on every command, for the reason the Vulkan
      # diagnostics step above carries it: this is evidence, and a diagnostic that can fail the thing it is
      # diagnosing would be the second flake this issue does not need.
      #
      # AFTER the suite rather than before it, because the facts wanted are the ones from the boot that just ran
      # the tests, and because the log tail below does not exist until then. Seconds: system_profiler is one
      # call, and the engine's own facts come from a filtered --no-build run of three device-reading rows.
      # The macOS pin is the leg table's `os` key, exactly as the lavapipe steps pin ubuntu-latest.
      - name: Collect device evidence
        if: always() && matrix.os == 'macos-26'
        continue-on-error: true
        env:
          KE_GPU_TESTS: '1'
          KE_GRAPHICS_BACKEND: ${{ matrix.backend }}
          KE_METAL_MSL_CACHE: ${{ env.GPU_DISK_CACHE }}
        run: |
          mkdir -p device-evidence
          {
            echo "leg: ${{ matrix.backend }} on ${{ matrix.runner }}"
            echo "run: ${{ github.run_id }} attempt ${{ github.run_attempt }} (${{ github.sha }})"
            echo "image: ${ImageVersion:-unknown}"
            echo "gpu disk caches: ${KE_METAL_MSL_CACHE:-(default location)}"
            sw_vers || true
            uname -mrs || true
            # THE HOST BEHIND THE VM, which is #614's live hypothesis and the reading system_profiler does not
            # give here: hw.model and the CPU brand are the closest thing to "which machine in the pool did this
            # boot land on", and the paravirtual GPU's own name is identical on every one of them.
            sysctl -n hw.model machdep.cpu.brand_string hw.ncpu hw.memsize 2>/dev/null || true
          } > device-evidence/host.txt 2>&1 || true
          # BOTH DATA TYPES, because the displays one is EMPTY on this runner. Measured on run 31581572414: a
          # headless VM has no display, so SPDisplaysDataType writes a zero-byte file and the artifact's headline
          # reading is nothing at all. SPHardwareDataType answers on the same call and is the one that describes
          # the machine. The displays view is kept for a real Mac, where it is the GPU's own entry.
          system_profiler SPDisplaysDataType SPHardwareDataType > device-evidence/system-profiler.txt 2>&1 || true
          # THE ENGINE'S OWN VIEW OF THE SAME DEVICE, which system_profiler cannot give: the Metal probe's four
          # reads (name, highest Apple family, Mac2 / Common1, buffer-offset alignment and its selector, sample
          # count 1), the capability set the backend reports, and the adapter description the device answers
          # with. Those rows already print all of it through ITestOutputHelper, and detailed verbosity is what
          # forwards a PASSING test's output at all, so this needs no new code. They read the system default
          # device rather than the selected backend's, so they answer on any macOS leg.
          dotnet test KhaozEngine.Render.Tests/KhaozEngine.Render.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~MetalBackendPackageTests.TheFourReads_AnswerOnARealDevice|FullyQualifiedName~GpuCapabilitiesDiagTests.LiveDeviceReportsNameAndSamplerFeatures|FullyQualifiedName~GpuDeviceDiagnosticsGpuTests.AdapterDescription_IsTheDeviceNameTheBackendReports" \
            --logger "console;verbosity=detailed" > device-evidence/engine-device-facts.txt 2>&1 || true
          tail -n 200 TestResults/suite-output.log > device-evidence/suite-output.tail.txt 2>&1 || true
          # THE NAMED-LINE DETECTOR (https://github.com/APKiwiOrg/KhaozEngine/issues/614), and it is READ-ONLY
          # DIAGNOSIS RATHER THAN A GATE. It never fails the step and the step is continue-on-error anyway: the
          # leg's own test failure is already the gate, and a diagnostic that can red a leg is the second flake
          # this issue does not need. What it does is answer, from the artifact alone and without downloading a
          # 1.5MB log, the two questions every #614 boot has had to be re-read by hand to answer.
          #
          # FIRST, WAS THE INSTRUMENT ARMED. The sink announcement proves the test host configured a Metal sink at
          # all, and the device-class readings prove which Objective-C class actually held the device. Those are
          # not the same question as "which variables were set", which is the whole lesson of this change: an
          # MTL_DEBUG_LAYER=1 run whose device is a CaptureMTLDevice is not validated. ZERO METAL LINES IS
          # AMBIGUOUS without the announcement (a clean run and a lost producer look identical), which is why the
          # absence is reported as an absence rather than as a clean bill.
          #
          # SECOND, DID THE DEVICE GO. MetalDeviceLossLatch logs a failed command buffer with its
          # MTLCommandBufferError code, the driver's own description and the site that first saw it, and then
          # fails nothing: it flips liveness, every later release is a no-op, drains return immediately, and every
          # draw after it renders nothing. That is the faster-and-blank shape #617 diagnosed and #614's live
          # candidate mechanism, and until now it could be firing on every frame with the artifact looking
          # identical. A latch line appears NOWHERE in a clean run, which is what makes the category worth
          # grepping at all.
          #
          # THE EXCLUSIONS ARE NAMED RATHER THAN FILTERED OUT, because a detector that silently drops lines is how
          # a reader learns to distrust it. Measured locally at detailed verbosity on a green 6210-row run: two
          # MetalTimeline dead-device lines at timeline values 1 and 9999 (rows that assert draining a dead device
          # on purpose) and one MetalCompletionHandler error from a deliberately throwing test sink. Anything
          # beyond those is new.
          {
            echo "==== #614 named-line detector: ${{ matrix.backend }}, run ${{ github.run_id }} attempt ${{ github.run_attempt }} ===="
            log=TestResults/suite-output.log
            if [ ! -f "$log" ]; then
              echo "DEVICE-LOSS: UNREADABLE. $log does not exist, so this run never reached the suite step's tee"
              echo "and the detector scanned nothing at all. Do not read this as a clean run."
            else
              sink=$(grep -c 'MetalValidationLogHost' "$log" 2>/dev/null || true)
              if [ "${sink:-0}" -gt 0 ]; then
                echo "SINK: configured, the Metal categories reach this log."
                grep -m1 'MetalValidationLogHost' "$log" || true
              else
                echo "SINK: NOT CONFIGURED on this run, so no engine-side Metal line could have reached the log"
                echo "whatever happened on the device. Every reading below is inconclusive by construction."
              fi
              echo "--- device class held by this boot ---"
              grep -o 'The device class is [A-Za-z0-9_]*' "$log" 2>/dev/null | sort | uniq -c || true
              armedwarn=$(grep -c 'rather than MTLDebugDevice' "$log" 2>/dev/null || true)
              echo "debug-device disambiguation warnings: ${armedwarn:-0} (non-zero means the layer is NOT holding the device)"
              grep -m1 'rather than MTLDebugDevice' "$log" || true
              echo "--- MetalDeviceLossLatch ---"
              # MATCHED ON THE CATEGORY TAG rather than on the bare type name, and the announcement line is
              # excluded explicitly, because the first draft of this detector reported DEVICE-LOSS-OBSERVED on a
              # green local run: MetalValidationConsoleLogging's announcement NAMES both the type and the message
              # in its own prose ("every failed command buffer from MetalDeviceLossLatch ('A native Metal command
              # buffer FAILED')"), so a word-level grep matches the line that says the sink is working. A detector
              # that fires on every armed run is worth less than no detector, so it is pinned to the shape the
              # latch actually logs: the category in brackets, and the message with the comma that continues it
              # into "first noticed at <site>".
              hits=$(mktemp)
              grep -n -E '\[MetalDeviceLossLatch\]|A native Metal command buffer FAILED,' "$log" 2>/dev/null \
                | grep -v 'MetalValidationLogHost' > "$hits" 2>/dev/null || true
              latch=$(wc -l < "$hits" 2>/dev/null | tr -d ' ')
              if [ "${latch:-0}" -gt 0 ]; then
                echo "########## DEVICE-LOSS-OBSERVED: ${latch} line(s) ##########"
                echo "A command buffer FAILED on this boot. Everything after it renders nothing and fails no row."
                head -n 40 "$hits" || true
              else
                echo "DEVICE-LOSS: none. No MetalDeviceLossLatch line in this run's log."
              fi
              rm -f "$hits" || true
              echo "--- MetalCompletionHandler errors (one is expected: the deliberately throwing test sink) ---"
              ch=$(grep -c -E '\[ERROR\] \[MetalCompletionHandler\]' "$log" 2>/dev/null || true)
              echo "count: ${ch:-0}"
              grep -n -E '\[ERROR\] \[MetalCompletionHandler\]' "$log" | head -n 20 || true
              echo "--- MetalTimeline dead-device drains (two are expected, at timeline values 1 and 9999) ---"
              tl=$(grep -c 'because the device is dead' "$log" 2>/dev/null || true)
              echo "count: ${tl:-0}"
              grep -n 'because the device is dead' "$log" | head -n 20 || true
              echo "--- what the Metal runtime itself said (debug layer, aborts, GPU faults) ---"
              rt=$(grep -c -E '\-\[MTLDebug|failed assertion|was aborted due to an error|IOAF code|GPU Hang' "$log" 2>/dev/null || true)
              echo "count: ${rt:-0}"
              grep -n -E '\-\[MTLDebug|failed assertion|was aborted due to an error|IOAF code|GPU Hang' "$log" | head -n 40 || true
            fi
          } > device-evidence/device-loss.txt 2>&1 || true
          # Echoed into the job log too, so the reading is visible without downloading an artifact. Kilobytes.
          cat device-evidence/device-loss.txt || true
          ls -la device-evidence || true
        shell: bash

      # Uploaded on always() for the reason the step above runs on always(): a green boot's readings are the
      # baseline the red boot's are read against, and half of a difference is not one. Kilobytes of text.
      - name: Upload device evidence
        if: always() && matrix.os == 'macos-26'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: device-evidence-${{ matrix.backend }}
          path: device-evidence/
          if-no-files-found: ignore

      # TIER ONE'S EVIDENCE, on always(), and only where a tier was actually ARMED. A `strict` run that passes
      # still logs every warning and performance message the layer emitted, and those are exactly the readings
      # that are never allowed to fail a leg, so a failure-only upload would discard the entire non-fatal half of
      # what the tier produces. Named for the tier rather than the leg so it sits beside the sync job's artifact.
      #
      # ARMED, not "the leg has a column", which is the same distinction the layer install now makes and for a
      # sharper reason here: gated on the column alone this uploaded on the push path too, producing an
      # artifact called vulkan-validation-strict-vulkan-native whose contents are a golden-subset run taken with
      # validation OFF. An artifact whose NAME is false is worse than a missing one, because the name is what a
      # reader trusts when they go looking for a tier's evidence weeks later. It exists only when it is true now.
      - name: Upload validation log (strict tier)
        if: always() && env.VULKAN_VALIDATION_ARMED != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vulkan-validation-strict-${{ matrix.backend }}
          path: TestResults/suite-output.log
          if-no-files-found: ignore

      # METAL'S TIERS' EVIDENCE, on always() and for the same reason as the Vulkan artifact above: the debug
      # layer reports on stderr interleaved with the test names, that interleaving IS the diagnostic, and a run
      # that passes still carries every non-fatal line the layer emitted.
      #
      # THE NAME CARRIES THE TIER RATHER THAN THE LEG, read off the same expression that arms the tier, because
      # an artifact whose name is false is worse than a missing one: the name is what a reader trusts when they
      # go looking for a tier's evidence weeks later. `debug-layer` is API validation alone, `shader-validation`
      # is that plus in-shader bounds checking, and the two never both exist for one run.
      #
      # NO SCAN STEP, unlike the Vulkan sync job, and the difference is worth naming. That job scans because
      # KE_VULKAN_VALIDATION=sync deliberately does not latch, so an error-severity line would otherwise land in
      # an artifact under a green job. Metal's debug layer is not a message stream the engine pumps: it reports
      # through the runtime itself, and it runs at its default assert error mode, so an API objection aborts the
      # host rather than passing quietly.
      #
      # AND A COMMAND-BUFFER FAILURE IS NOT A TEST FAILURE, which this comment used to claim it was. #617
      # (https://github.com/APKiwiOrg/KhaozEngine/issues/617) is where that cost something. MetalDeviceLossLatch
      # LOGS the failure and flips the device's liveness, and nothing in it fails a row, so a leg can be red for
      # 186 unrelated-looking golden reasons with the actual fault sitting unread in a log line. Since 56c8ceec
      # that line exists at all, and the detailed logger above is what carries it into this artifact. A scan step
      # is the obvious next move if the next armed run shows the latch firing, and it is deliberately not being
      # added blind: nobody has yet seen a Metal artifact with the sink configured.
      #
      # ITS EXCLUSION LIST IS ALREADY KNOWN, THOUGH, so whoever adds that step does not have to discover it as a
      # pile of false positives. Measured locally on this commit, metal-native under MTL_DEBUG_LAYER=1 at
      # detailed verbosity, 6210 rows all green: above Info the whole log holds FIVE lines, of three kinds, and
      # every one of them is a test doing its job.
      #   * [WARN] [MetalTimeline] "WaitForIdle stopped waiting for timeline value N because the device is
      #     dead", twice, at values 1 and 9999. Draining a dead device is the behaviour those rows assert.
      #   * [WARN] [MetalGpuDevice] "KE_METAL_DEVICE=... Taking the first device that meets the requirements",
      #     twice: the selector's two negative probes, a device name this machine does not have and index 99.
      #   * [ERROR] [MetalCompletionHandler] "swallowed an exception on the completion path", once, from
      #     MetalCompletionHandlerTests' deliberately throwing sink.
      # Everything else in the log is Info: roughly 650 MetalGpuDevice lines, one set per device created, plus
      # the single MetalValidationLogHost announcement. A MetalDeviceLossLatch line appears NOWHERE in a clean
      # run, which is exactly what makes that category the thing a scan step should be looking for.
      #
      # THE NAME HAS THREE CASES, and every one of them is read off the expression that arms the thing it names,
      # because #614 is the bill for a name that was false. `debug-layer` was this artifact's
      # name on every unattended run while MTL_CAPTURE_ENABLED was displacing the debug device, so a reader who
      # went looking for the layer's evidence found a file named for an instrument that was not holding the
      # device. The cases:
      #   * shader-validation - the deep dispatch.
      #   * capture           - `tier=capture`, where the device is a CaptureMTLDevice and the layer is NOT the
      #                         live instrument. Named for what it is rather than for what is merely set.
      #   * debug-layer       - every unattended trigger, and true again as of #614.
      # A fourth case, the #617 control on the incumbent Metal leg, went with that leg in 18.0.0.
      - name: Upload Metal validation log
        if: always() && matrix.backend == 'metal-native'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: metal-validation-${{ env.METAL_DEEP_TIER != '' && 'shader-validation' || (env.METAL_CAPTURE_TIER != '' && 'capture' || 'debug-layer') }}-${{ matrix.backend }}
          path: TestResults/suite-output.log
          if-no-files-found: ignore

      # On a host crash: surface the --blame Sequence.xml (names the last-started test on the dead host).
      # Kilobytes, failure-only, no dumps.
      - name: Upload crash-sequence evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crash-sequence-${{ matrix.backend }}
          path: TestResults/**/Sequence_*.xml
          if-no-files-found: ignore

      # On a verify FAILURE: upload the got/want/diff evidence PNGs the golden compare wrote, so the visual
      # regression can be eyeballed from the run without re-running. ignore = no spurious failure when a leg
      # failed for a non-golden reason and wrote no evidence.
      - name: Upload golden failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-evidence-${{ matrix.backend }}
          path: KhaozEngine.Render.Tests/Gpu/goldens-evidence/
          if-no-files-found: ignore

      # Every golden compare appends its worst-cell delta to goldens-evidence/golden-deltas.<backend>.txt, on a
      # PASS as well as a fail, which is why this uploads on always() rather than failure(). Rollout gate 1 of
      # #460 is "all 36 goldens green with the observed worst-cell delta RECORDED", and a failure-only artifact
      # can only ever show the number after something broke, which is the one reading that gate cannot use.
      # Kilobytes of text. ignore = no spurious failure on a leg that ran no golden compares at all.
      - name: Upload golden delta records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-deltas-${{ matrix.backend }}
          path: KhaozEngine.Render.Tests/Gpu/goldens-evidence/golden-deltas.*.txt
          if-no-files-found: ignore

      # On an HLSL byte-equality FAILURE: upload the emitted HLSL the pinned hashes no longer match (decision
      # S3). Without the text there are two indistinguishable explanations, a deliberate shader edit that was
      # not re-baked and a cross-compile option drift, and with it they are one diff apart. Kilobytes,
      # failure-only. ignore = no spurious failure on a leg that failed for another reason.
      - name: Upload emitted-HLSL evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hlsl-evidence-${{ matrix.backend }}
          path: KhaozEngine.Render.Tests/Gpu/hlsl-evidence/
          if-no-files-found: ignore

      # When baking: upload the freshly written per-backend goldens so they can be downloaded and committed,
      # plus the bake evidence PNGs (full-res captures) so the baked scenes are viewable. always() so a leg that
      # wrote some goldens before erroring still surfaces them; ignore = no spurious failure on a leg that wrote
      # none.
      - name: Upload baked goldens
        # Every leg since 17.41.0, the three native ones included: each owns the family it just wrote. The
        # guest-leg exclusion that used to sit here went with the goldenGuest column.
        if: always() && github.event_name == 'workflow_dispatch' && inputs.bake
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: goldens-${{ matrix.backend }}
          path: |
            KhaozEngine.Render.Tests/Gpu/goldens/*.${{ matrix.backend }}.txt
            KhaozEngine.Render.Tests/Gpu/goldens-evidence/*.${{ matrix.backend }}.bake.png
          if-no-files-found: ignore

  # TIER TWO OF THE VALIDATION GATE (decision V-T4): core validation PLUS synchronisation validation, over the
  # golden subset plus the compute suite, on the native Vulkan backend and lavapipe.
  #
  # THE GATE IS THIS JOB'S, NOT THE ENGINE'S, and the split is deliberate rather than an oversight.
  # VulkanValidationMode.Sync does NOT latch: VulkanValidation.ThrowsOnError is true for the strict rung alone,
  # so a sync run logs an error-severity hazard and still exits 0. Engine-side latching stays strict-only BY
  # DESIGN, because the two rungs want opposite things from an error. strict exists to stop at the first one,
  # and sync exists to finish the sweep and report every hazard it found, which is what makes its log the
  # triage artifact. What that combination leaves behind is a tier that cannot go red, while rollout gate 3
  # and MV6's VMA decline are both read off this job being green. So the JOB gates instead: the scan step
  # below reads the log this job already tees and uploads, and exits 1 when it holds an error-severity
  # validation line. The engine is untouched, and the tier can fail.
  #
  # WHY THIS EXISTS AT ALL, because it is the load-bearing instrument in this program's net and nothing else in
  # CI can do its job. A hand-written Vulkan backend's characteristic failure is a missing barrier or a wrong
  # image layout, and both are INVISIBLE on lavapipe: a software rasterizer executes with far stronger implicit
  # ordering than a real GPU, so the golden passes here and the same command stream corrupts on the field GPU,
  # on the one machine that is not in CI. Core validation does not catch it either. Two other decisions are
  # written as CONDITIONAL on this job existing: MV6 declines VMA for an engine-owned allocator, and MV5's
  # resting-layout barrier model has this as half its exit criterion.
  #
  # WHY A SEPARATE JOB rather than a sixth matrix leg. It runs a different SUITE for a different reason.
  # Synchronisation validation tracks every access and is slow, so it buys a subset where the barrier machinery
  # actually lives instead of the serialised full suite, and it wants its own name in the checks list so a red
  # here reads as "a hazard was found" rather than as "a golden moved". The cost of the split is that the setup
  # steps below are a copy of the matrix job's. That copy is deliberate and it fails LOUDLY rather than
  # silently if it ever drifts: the ICD discovery and the layer check both exit 1 with a message when the
  # runner does not look the way they expect.
  #
  # WHEN IT RUNS, and one deliberate departure from the design's wording. The design says "on the schedule
  # only". This adds workflow_dispatch, because a job that can only ever be started by the cron would take its
  # first run unattended at 18:00 on a Sunday and could not be re-run against a fix without waiting a week.
  # MV5 and MV6 are both read off this job, so an instrument nobody can aim is not one. A BAKE DISPATCH IS
  # STILL EXCLUDED, and the reason survived row 2 of #683 even though the guest-leg reason it used to borrow did
  # not: this job is a validation instrument over a subset, not a producer of references, and the vulkan-native
  # matrix leg is the one that bakes that family. Running it on a bake would verify a subset against grids being
  # rewritten beside it and could contribute nothing either way.
  gpu-vulkan-sync:
    needs: legs
    name: ubuntu-latest / vulkan-native (sync validation)
    runs-on: ubuntu-latest
    if: |
      needs.legs.outputs.vulkan_native == 'true'
      && (github.event_name == 'schedule'
          || (github.event_name == 'workflow_dispatch' && !inputs.bake))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      # local-feed is git-ignored (dev inner-loop), so create it for the nuget.config 'local' source to resolve.
      - run: mkdir -p local-feed
        shell: bash

      - run: dotnet restore

      - run: dotnet build -c Release --no-restore

      # The same lavapipe install and the same runtime ICD discovery as the matrix job, for the same reasons.
      - name: Install software Vulkan (lavapipe)
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
          echo "--- ICD manifests on disk ---"
          ls -la /usr/share/vulkan/icd.d/ /etc/vulkan/icd.d/ 2>/dev/null || true

      - name: Point Vulkan loader at lavapipe
        run: |
          set -x
          icd=$(find /usr /etc -name 'lvp_icd*.json' 2>/dev/null | head -1)
          if [ -z "$icd" ]; then
            echo "::error::lavapipe ICD manifest not found after installing mesa-vulkan-drivers"
            find /usr /etc -name '*_icd*.json' 2>/dev/null || true
            exit 1
          fi
          echo "lavapipe ICD: $icd"
          { echo "VK_ICD_FILENAMES=$icd"; echo "VK_DRIVER_FILES=$icd"; } >> "$GITHUB_ENV"

      # The layer check matters more here than anywhere: this whole job IS the layer. Without it the run would
      # be a second, slower copy of the golden subset, passing and proving nothing.
      - name: Install the Khronos validation layer
        run: |
          set -x
          sudo apt-get install -y vulkan-validationlayers
          layer=$(grep -rl VK_LAYER_KHRONOS_validation /usr/share/vulkan /etc/vulkan 2>/dev/null | head -1)
          if [ -z "$layer" ]; then
            echo "::error::VK_LAYER_KHRONOS_validation is not on this runner after installing vulkan-validationlayers, so this job would run the golden subset a second time and validate nothing"
            exit 1
          fi
          echo "Khronos validation layer manifest: $layer"

      # THE SUBSET IS THE GOLDEN FAMILY PLUS THE COMPUTE SUITE, and the naming contract is what selects it
      # (design section 15). `FullyQualifiedName~Golden` is the same substring the matrix job's push path uses,
      # so every scene that renders under the barrier model is here. `FullyQualifiedName~Compute` adds the
      # dispatch paths, which is where the compute rule 1 image transition and the dependent-dispatch barrier
      # live, and those two are the exact shapes synchronisation validation was installed to judge.
      #
      # NO KE_UPDATE_GOLDENS on any trigger. It used to be refused by design, because this job's backend was a
      # guest in the vulkan family. Since 17.41.0 vulkan-native owns its family and a bake here WOULD write, so
      # the exclusion above is what keeps this job off a bake dispatch and this variable is not set at all
      # rather than set empty, because there is no trigger on which this job wants it.
      - name: Run the golden and compute suite under synchronisation validation
        # Named, because the gate step below runs exactly when THIS step ran, pass or fail, and not when an
        # earlier step took the job down before any log existed.
        id: suite
        env:
          KE_GPU_TESTS: '1'
          KE_GRAPHICS_BACKEND: vulkan-native
          KE_VULKAN_DEVICE: llvmpipe
          KE_VULKAN_REQUIRED: '1'
          KE_VULKAN_VALIDATION: sync
          # THE SAME ONE VALUE THE MATRIX LEGS READ (#614). This job is part of the run, so a cacheless dispatch
          # that left it caching would make the dispatch's own description false, which is the same objection
          # this file already records against an artifact whose name is false. Only the Vulkan variable can do
          # anything here, and it is the pipeline cache the native backend writes.
          KE_VULKAN_PIPELINE_CACHE: ${{ env.GPU_DISK_CACHE }}
          # The in-memory front-end memo, off on the same terms as the matrix legs (#640).
          KE_SPIRV_CACHE: ${{ env.GPU_DISK_CACHE }}
        # pipefail explicitly, for the reason the matrix job's test step states: this is a gating command and
        # its exit code must not depend on an implicit shell option.
        #
        # DETAILED CONSOLE VERBOSITY, unconditionally here because this job is armed on every trigger that runs
        # it at all (#565). The test host configures a console sink when KE_VULKAN_VALIDATION arms a rung, and
        # vstest forwards the test host's stdout only at this verbosity, so at the default the engine's own
        # formatted validation lines are written into a stream the runner discards and the gate step below
        # scans a log that structurally cannot contain them. It also prints one `Passed <TestName>` line per
        # test, which is what puts each message next to the test that provoked it.
        run: |
          set -o pipefail
          mkdir -p TestResults
          dotnet test -c Release --no-build --filter "FullyQualifiedName~Golden|FullyQualifiedName~Compute" --blame --results-directory TestResults --logger "console;verbosity=detailed" 2>&1 | tee TestResults/sync-validation.log
        shell: bash

      # WHAT MAKES TIER TWO A GATE. The engine does not fail a sync run on an error (the job header says why,
      # and it is deliberate), so without this step an error-severity hazard lands in the artifact and the job
      # reports green, which is the reading rollout gate 3 and MV6's VMA decline would then be taken from.
      #
      # TWO SHAPES ARE MATCHED, because two producers can put an error-severity line in this log and neither is
      # guaranteed to be the one that speaks first.
      #   * `Vulkan validation [Error]` is the ENGINE's, exactly. VulkanValidationPump.Format writes every
      #     message it logs as `Vulkan validation [<Severity>] <VUID>: <text>`, with the severity spelled by
      #     VulkanValidationSeverity, so the Error rung is that literal and the Warning rung cannot collide
      #     with it. This arm could not fire at all before #565: the pump logged through a facade nothing in
      #     the test process had configured, so it wrote to a no-op logger on every leg. It is a real arm now.
      #   * `Validation Error:` is the LAYER's own, and it is the more important of the two here. The Khronos
      #     layer reports on its own account as well as through the application messenger, and its message body
      #     opens with `Validation Error:` at error severity and `Validation Warning:` at warning severity. The
      #     same prefix also sits INSIDE the engine's formatted line, because the text the pump formats IS the
      #     layer's pMessage, so this arm covers both producers and the first arm covers the case where the
      #     engine's own formatting is all that reached the log.
      #
      # A SCAN THAT SEES NOTHING SAYS SO OUT LOUD, which is the property #423 is about. A gate whose pattern
      # quietly stops matching looks identical to a clean run, so the total number of validation lines at ANY
      # severity is printed on every run and a total of zero prints a notice naming both shapes. Zero is not
      # evidence of a clean sweep on its own: it is equally what this scan looks like after it loses its
      # producer, and the two have to be tellable apart from the log alone.
      #
      # The artifact upload below stays on always(), so a run this step reds still keeps the log that explains
      # why. That ordering is the whole point: the gate goes red and the triage evidence survives it.
      - name: Gate on error-severity validation messages
        if: always() && steps.suite.conclusion != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          log=TestResults/sync-validation.log
          if [ ! -f "$log" ]; then
            echo "::error::$log does not exist, so tier two scanned nothing at all. The suite step tees it, so a missing file means the run never reached the tee and this job's validation gate proved nothing."
            exit 1
          fi

          # grep -c exits 1 on zero matches, which set -e would take as a failure, so each count absorbs it and
          # keeps the printed 0.
          errors=$(grep -cE 'Vulkan validation \[Error\]|Validation Error:' "$log" || true)
          total=$(grep -cE 'Vulkan validation \[(Error|Warning)\]|Validation (Error|Warning):' "$log" || true)
          echo "validation lines in $log: $total at any severity, $errors at error severity"

          if [ "$total" -eq 0 ]; then
            echo "::notice::No validation line of any severity was found in $log. On a genuinely clean sweep that is the right answer, but it is also exactly what this scan looks like if it lost its producer, so treat it as a reading to confirm rather than as a pass. The shapes it looks for are 'Vulkan validation [<Severity>]' (the engine pump's format) and 'Validation Error:' or 'Validation Warning:' (the Khronos layer's own message body). To tell the two cases apart, grep the log for 'VulkanValidationLogHost': that line is written once per armed run by the test host that configures the sink the engine pump writes to, so its ABSENCE means the engine half could not have reported anything whatever the layer saw (#565)."
          fi

          if [ "$errors" -gt 0 ]; then
            echo "::error::Synchronisation validation reported $errors error-severity line(s). KE_VULKAN_VALIDATION=sync does not latch or throw by design, so the suite passed and this gate is what fails the job. The full interleaving with test names is in the vulkan-validation-sync artifact, which uploads on always() and is where each hazard reads next to the test that provoked it."
            grep -nE 'Vulkan validation \[Error\]|Validation Error:' "$log" | head -20
            exit 1
          fi

      # always(), because the non-fatal half of what this job produces is the half worth keeping: warning and
      # performance severities never fail a run, and a hazard the layer reports as a warning is still the thing
      # this job was installed to find.
      - name: Upload validation log (sync tier)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vulkan-validation-sync
          path: TestResults/sync-validation.log
          if-no-files-found: ignore

      - name: Upload crash-sequence evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crash-sequence-vulkan-native-sync
          path: TestResults/**/Sequence_*.xml
          if-no-files-found: ignore

      - name: Upload golden failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-evidence-vulkan-native-sync
          path: KhaozEngine.Render.Tests/Gpu/goldens-evidence/
          if-no-files-found: ignore
