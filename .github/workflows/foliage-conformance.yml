name: foliage-conformance
# Native foliage platform conformance. Every hosted leg builds the two area test projects and runs the committed
# public pins once: FoliagePlatformPinsTests over the invented MapDoc fixture and GroundCoverTraceTests over the
# released ground cover kernel. Each leg checks the same source literals. Nothing is regenerated per operating system.
#
# The repository is public, so the three legs run on GitHub-hosted runners only. No leg uses a self-hosted label,
# the dev machine's build-slot, a private harness, a secret or a repeat loop. Exact keys, decisions, models and the
# scale and rank bits compare exactly. Positions compare within 0.00001 m and orientations within 0.000001 rad.
#
# A leg passes only when both result files exist and report a nonzero total with every test executed and passed. A
# skipped xunit fact leaves executed below total, so a run that skipped anything fails here too. A filter that matches
# nothing reports a zero total and fails.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foliage-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26, windows-latest]
    env:
      RESULTS: TestResults/foliage-conformance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # local-feed is git-ignored. Creating it lets the nuget.config local source resolve. No KhaozEngine package is
      # restored here, since every engine edge of these projects is a ProjectReference.
      - name: Create the local feed
        shell: bash
        run: mkdir -p local-feed

      - name: Restore and build the area test projects
        shell: bash
        run: |
          for project in KhaozEngine.MapDoc.Tests/KhaozEngine.MapDoc.Tests.csproj KhaozEngine.Render.Tests/KhaozEngine.Render.Tests.csproj; do
            dotnet restore "$project"
            dotnet build "$project" -c Release --no-restore
          done

      - name: Run the platform pins and the ground cover trace once
        shell: bash
        run: |
          dotnet test KhaozEngine.MapDoc.Tests/KhaozEngine.MapDoc.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~FoliagePlatformPinsTests" \
            --logger "trx;LogFileName=foliage-platform-pins.trx" --results-directory "$RESULTS"
          dotnet test KhaozEngine.Render.Tests/KhaozEngine.Render.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~GroundCoverTraceTests" \
            --logger "trx;LogFileName=ground-cover-trace.trx" --results-directory "$RESULTS"

      - name: Require nonzero tests with none skipped
        shell: bash
        run: |
          for name in foliage-platform-pins ground-cover-trace; do
            trx="$RESULTS/$name.trx"
            if [ ! -f "$trx" ]; then
              echo "$name: no result file at $trx"
              exit 1
            fi
            counters=$(grep -o '<Counters [^/]*' "$trx" | head -1 || true)
            total=$(printf '%s' "$counters" | grep -o ' total="[0-9]*"' | grep -o '[0-9]*' || true)
            executed=$(printf '%s' "$counters" | grep -o ' executed="[0-9]*"' | grep -o '[0-9]*' || true)
            passed=$(printf '%s' "$counters" | grep -o ' passed="[0-9]*"' | grep -o '[0-9]*' || true)
            echo "$name: passed ${passed:-unknown}, executed ${executed:-unknown} of ${total:-unknown}"
            # Every condition is checked as one group, so a failure in any file fails the step. A bare && chain inside the
            # loop would let errexit ignore every failure but its last test.
            if ! { test -n "$total" && test "$total" -gt 0 && test "$executed" = "$total" && test "$passed" = "$total"; }; then
              echo "$name: requires a nonzero total with every test executed and passed"
              exit 1
            fi
          done

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foliage-conformance-${{ matrix.runner }}
          path: TestResults/foliage-conformance/*.trx
          if-no-files-found: error
