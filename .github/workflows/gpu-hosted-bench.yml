# gpu-hosted-bench runs hardware benches on hosted NVIDIA T4 runners and the correctness-only renderer rehearsal
# on standard Ubuntu lavapipe. The filtered hardware slice of KhaozEngine.Render.Tests shows
# how the engine behaves and what it costs on real desktop hardware: Windows Direct3D 11, Windows Vulkan and Linux
# Vulkan. The Windows and Linux legs of cross-platform-gpu.yml run on software rasterizers (WARP and lavapipe), so
# they prove output and never speed.
#
# BILLING: GPU runners are larger runners, billed per minute even on this public repo. So this workflow runs on
# workflow_dispatch only, each runner is capped at one machine, and the org runner group `gpu-bench` admits this
# file on main and nothing else. A dispatch names the ref to test, so the file never has to live on a branch.
#
# THE ADAPTER IS PINNED to the NVIDIA device on both APIs, and Vulkan is required on the Vulkan legs
# (KE_VULKAN_REQUIRED). Direct3D 11 takes a name substring, and its adapter is named "NVIDIA Tesla T4". Vulkan's
# device is named "Tesla T4" with no vendor in it, so a name pin of NVIDIA matched nothing and silently took the
# first eligible device, and the Linux runner also carries llvmpipe. Vulkan is pinned by type (discrete) instead.
# An unmet pin still falls back on both APIs, which on a machine without a graphics driver is the Microsoft Basic
# Render Driver or llvmpipe, so every leg first runs the device report and fails unless it names the NVIDIA GPU.
# Software rehearsal durations are diagnostic only and never performance evidence.
#
# THE WINDOWS IMAGE SHIPS THE T4 IN TCC, the driver model that offers compute only (first probe, run 36380480461:
# datacenter driver 471.11, Direct3D 11 on the Basic Render Driver, no Vulkan device). Direct3D and Vulkan need
# WDDM, and that driver refuses the switch (`nvidia-smi -dm 0` answers Not Supported, run 36382124195). So the
# Windows legs install Microsoft's Azure GRID driver for the T4 silently, without the reboot its docs recommend,
# and the device report says whether it took.
#
# Example: gh workflow run gpu-hosted-bench.yml -f ref=main -f filter=FullyQualifiedName~GpuCapabilitiesDiagTests
name: gpu-hosted-bench

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to test
        required: true
        default: main
      filter:
        description: dotnet test filter for KhaozEngine.Render.Tests
        required: true
        default: FullyQualifiedName~GpuCapabilitiesDiagTests
      legs:
        description: Which legs to run
        type: choice
        options: [all, windows-d3d11, windows-vulkan, linux-vulkan]
        default: all
      renderer-perf-unit:
        description: Exact separately approved renderer unit, empty keeps existing modes
        required: false
        default: ''
        type: string
      renderer-perf-manifest-sha256:
        description: SHA-256 of the exact renderer manifest bytes
        required: false
        default: ''
        type: string
      renderer-perf-workload-sha:
        description: Measured workload parent of the immutable authorization ref
        required: false
        default: ''
        type: string
      coverage-perf-unit:
        description: Exact separately approved performance unit, empty keeps the filtered bench
        required: false
        default: ''
        type: string
      coverage-perf-manifest-sha256:
        description: SHA-256 of the approved manifest bytes, 64 lowercase hex
        required: false
        default: ''
        type: string
      coverage-perf-workload-sha:
        description: Measured workload commit, the single parent of ref's authorization commit, 40 lowercase hex
        required: false
        default: ''
        type: string

permissions:
  contents: read

# No concurrency group. A group keeps one run pending and cancels any older pending run when a newer one queues,
# which dropped a dispatched run (36553965942). Each GPU runner is capped at one machine, so jobs already queue for a
# free runner, and every dispatch runs in turn.

jobs:
  legs:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Checkout trusted renderer admission implementation
        if: inputs.renderer-perf-unit != '' || inputs.renderer-perf-manifest-sha256 != '' || inputs.renderer-perf-workload-sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: renderer-perf-trusted
          persist-credentials: false
      - name: Checkout renderer authorization for hosted CPU admission
        if: inputs.renderer-perf-unit != '' || inputs.renderer-perf-manifest-sha256 != '' || inputs.renderer-perf-workload-sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2
          path: renderer-perf-requested
          persist-credentials: false
      - id: pick
        shell: bash
        env:
          LEGS: ${{ inputs.legs }}
          FILTER: ${{ inputs.filter }}
          COVERAGE_PERF_UNIT: ${{ inputs.coverage-perf-unit }}
          COVERAGE_PERF_MANIFEST_SHA256: ${{ inputs.coverage-perf-manifest-sha256 }}
          COVERAGE_PERF_WORKLOAD_SHA: ${{ inputs.coverage-perf-workload-sha }}
          RENDERER_PERF_UNIT: ${{ inputs.renderer-perf-unit }}
          RENDERER_PERF_MANIFEST_SHA256: ${{ inputs.renderer-perf-manifest-sha256 }}
          RENDERER_PERF_WORKLOAD_SHA: ${{ inputs.renderer-perf-workload-sha }}
          TESTED_REF: ${{ inputs.ref }}
          KE_RENDERER_PERF_REPORTS: ${{ runner.temp }}/renderer-admission
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          LC_ALL: C
        run: |
          if [ -n "$RENDERER_PERF_UNIT$RENDERER_PERF_MANIFEST_SHA256$RENDERER_PERF_WORKLOAD_SHA" ]; then
            cd "$GITHUB_WORKSPACE/renderer-perf-requested"
            admission="$GITHUB_WORKSPACE/renderer-perf-trusted/scripts/renderer-perf-workflow.ps1"
            pwsh -NoProfile -File "$admission" -Mode Authorize
            pwsh -NoProfile -File "$admission" -Mode Select >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$COVERAGE_PERF_UNIT" ]; then
            if [ "$WORKFLOW_RUN_ATTEMPT" != '1' ]; then
              echo "::error::coverage performance requires github.run_attempt 1, a re-run cannot reuse an approval"; exit 1
            fi
            case "$LEGS" in windows-d3d11|windows-vulkan|linux-vulkan) ;; *) echo "::error::coverage performance requires one named GPU leg, never all"; exit 1 ;; esac
            if [ "$FILTER" != 'FullyQualifiedName~GpuCapabilitiesDiagTests' ]; then
              echo "::error::coverage performance refuses a non-default free-form filter"; exit 1
            fi
            if ! [[ "$COVERAGE_PERF_UNIT" =~ ^[a-z0-9-]{1,64}$ ]]; then
              echo "::error::coverage-perf-unit must be 1 to 64 lowercase ASCII letters, digits or hyphens"; exit 1
            fi
            if ! [[ "$COVERAGE_PERF_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::coverage-perf-manifest-sha256 must be 64 lowercase hex characters"; exit 1
            fi
            if ! [[ "$COVERAGE_PERF_WORKLOAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::coverage-perf-workload-sha must be 40 lowercase hex characters"; exit 1
            fi
          elif [ -n "$COVERAGE_PERF_MANIFEST_SHA256$COVERAGE_PERF_WORKLOAD_SHA" ]; then
            echo "::error::coverage performance hashes require a selected unit"; exit 1
          fi
          all='[{"leg":"windows-d3d11","runner":"gpu-t4-windows","backend":"direct3d11-native"},{"leg":"windows-vulkan","runner":"gpu-t4-windows","backend":"vulkan-native"},{"leg":"linux-vulkan","runner":"gpu-t4-linux","backend":"vulkan-native"}]'
          if [ "$LEGS" = "all" ]; then picked="$all"; else picked=$(echo "$all" | jq -c --arg l "$LEGS" '[.[] | select(.leg == $l)]'); fi
          echo "matrix={\"include\":$picked}" >> "$GITHUB_OUTPUT"

  bench:
    needs: legs
    # Re-running only failed jobs reuses the legs result, so a measurement re-run is refused here, before a runner.
    if: inputs.renderer-perf-unit == '' && inputs.renderer-perf-manifest-sha256 == '' && inputs.renderer-perf-workload-sha == '' && (inputs.coverage-perf-unit == '' || github.run_attempt == 1)
    name: ${{ matrix.leg }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.coverage-perf-unit != '' && 30 || 60 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.legs.outputs.matrix) }}
    env:
      KE_GPU_TESTS: '1'
      KE_GRAPHICS_BACKEND: ${{ matrix.backend }}
      KE_D3D11_ADAPTER: NVIDIA
      KE_VULKAN_DEVICE: discrete
      KE_VULKAN_REQUIRED: ${{ matrix.backend == 'vulkan-native' && '1' || '' }}
      FILTER: ${{ inputs.filter }}
      KE_COVERAGE_PERF_UNIT: ${{ inputs.coverage-perf-unit }}
      KE_COVERAGE_PERF_MANIFEST_SHA256: ${{ inputs.coverage-perf-manifest-sha256 }}
      KE_COVERAGE_PERF_WORKLOAD_SHA: ${{ inputs.coverage-perf-workload-sha }}
      KE_COVERAGE_PERF_LEG: ${{ matrix.leg }}
      DEVICE_REPORT: FullyQualifiedName~GpuCapabilitiesDiagTests.LiveDeviceReportsNameAndSamplerFeatures
    steps:
      # A coverage dispatch checks out the authorization commit, whose single parent is the measured workload
      # commit. Depth 2 makes that parent present. An empty unit keeps the default depth 1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.coverage-perf-unit != '' && 2 || 1 }}

      # The partner GPU images ship no PowerShell 7, which every coverage step uses. Measurement mode installs one
      # pinned release, checks its published SHA-256 and puts it first on PATH. Ordinary benches skip both steps.
      - name: Install PowerShell for coverage measurement (Linux)
        if: inputs.coverage-perf-unit != '' && runner.os == 'Linux'
        shell: bash
        env:
          PWSH_URL: https://github.com/PowerShell/PowerShell/releases/download/v7.6.7/powershell-7.6.7-linux-x64.tar.gz
          PWSH_SHA256: 6896f9e3a6b0a354bf470835a96da76d2f801cd50dcf047ad7c4563bf93bf431
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pwsh"
          archive="$RUNNER_TEMP/pwsh.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$archive" "$PWSH_URL"
          echo "$PWSH_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$dir"
          chmod +x "$dir/pwsh"
          "$dir/pwsh" -NoProfile -Command "\$PSVersionTable.PSVersion.ToString()"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Install PowerShell for coverage measurement (Windows)
        if: inputs.coverage-perf-unit != '' && runner.os == 'Windows'
        shell: powershell
        env:
          PWSH_URL: https://github.com/PowerShell/PowerShell/releases/download/v7.6.7/PowerShell-7.6.7-win-x64.zip
          PWSH_SHA256: d2f952ebdbf24386cb8923553aa58e41a846db35a6155ea04c58142a4b16dbb7
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $dir = Join-Path $env:RUNNER_TEMP 'pwsh'
          $archive = Join-Path $env:RUNNER_TEMP 'pwsh.zip'
          Invoke-WebRequest -Uri $env:PWSH_URL -OutFile $archive -UseBasicParsing
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:PWSH_SHA256) { throw "PowerShell archive SHA-256 $actual does not match $env:PWSH_SHA256" }
          Expand-Archive -Path $archive -DestinationPath $dir -Force
          & (Join-Path $dir 'pwsh.exe') -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # An explicit BOM-free UTF-8 append, rather than Windows PowerShell 5.1 Out-File, keeps the file byte-exact.
          [IO.File]::AppendAllText($env:GITHUB_PATH, $dir + [Environment]::NewLine)

      - name: Verify coverage authorization commit
        if: inputs.coverage-perf-unit != ''
        shell: pwsh
        env:
          KE_COVERAGE_PERF_REPORTS: ${{ runner.temp }}/coverage-perf/${{ matrix.leg }}
        run: |
          "KE_COVERAGE_PERF_REPORTS=$env:KE_COVERAGE_PERF_REPORTS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force $env:KE_COVERAGE_PERF_REPORTS | Out-Null
          $env:KE_COVERAGE_PERF_WORKLOAD_SHA | Set-Content (Join-Path $env:KE_COVERAGE_PERF_REPORTS 'workload-sha.txt')
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the checked-out authorization commit' }
          $head | Set-Content (Join-Path $env:KE_COVERAGE_PERF_REPORTS 'authorization-sha.txt')
          if ($head -ceq $env:KE_COVERAGE_PERF_WORKLOAD_SHA) { throw 'ref is the workload commit, dispatch its authorization commit' }
          $parents = @((& git rev-list --parents -n 1 HEAD).Trim() -split ' ')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the authorization commit parents' }
          if ($parents.Count -ne 2 -or $parents[1] -cne $env:KE_COVERAGE_PERF_WORKLOAD_SHA) { throw 'Authorization commit must have exactly one parent, equal to coverage-perf-workload-sha' }
          $manifest = "tools/EquipmentCoverage.Perf.Tests/authorized/$($env:KE_COVERAGE_PERF_UNIT).json"
          $changes = @(& git diff --name-status --no-renames $env:KE_COVERAGE_PERF_WORKLOAD_SHA HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compare the authorization commit with its workload parent' }
          if ($changes.Count -ne 1 -or $changes[0] -cne "A`t$manifest") { throw "Authorization commit must add only $manifest" }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: GPU, driver model and the GRID driver (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        env:
          # Microsoft's redistribution for NCasT4_v3 on Windows Server 2022 (vGPU 20.2), licensed for Azure. From
          # learn.microsoft.com/azure/virtual-machines/windows/n-series-driver-setup.
          GRID_URL: https://download.microsoft.com/download/0f21fd13-2390-4c79-876a-87ae3dc724c6/596.86_grid_win10_win11_server2022_server2025_dch_64bit_international_azure_swl.exe
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'
          Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion, Status
          & nvidia-smi
          $model = (& nvidia-smi --query-gpu=driver_model.current --format=csv,noheader) -join ''
          Write-Host "driver model: $model"
          if ($model -match 'TCC') {
            $exe = Join-Path $env:RUNNER_TEMP 'grid.exe'
            Invoke-WebRequest -Uri $env:GRID_URL -OutFile $exe -UseBasicParsing
            $p = Start-Process -FilePath $exe -ArgumentList '-s', '-noreboot', '-clean', '-noeula' -Wait -PassThru
            Write-Host "GRID installer exit code: $($p.ExitCode)"
            Start-Sleep -Seconds 15
            & nvidia-smi
            Write-Host "after the install: $((& nvidia-smi --query-gpu=driver_model.current,driver_model.pending --format=csv,noheader) -join '')"
            Get-CimInstance Win32_VideoController | Format-List Name, Status
          }

      - name: GPU, driver and Vulkan devices (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          nvidia-smi || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 vulkan-tools
          ls -la /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2>/dev/null || true
          vulkaninfo --summary 2>&1 | head -60 || true

      # The runner also carries Mesa's llvmpipe, and a Vulkan device request that cannot be honoured falls back to
      # it without failing (#1200): late in one run the T4 stopped being chosen and two cost facts ran on llvmpipe.
      # Loading only the NVIDIA driver turns that into a failure instead of a skipped measurement.
      - name: Load only the NVIDIA Vulkan driver (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # One of the two directories is usually absent, and ls then exits 2, which the step's pipefail would
          # turn into a failure, so the first existing manifest is found with a glob instead.
          icd=""
          for f in /usr/share/vulkan/icd.d/nvidia_icd*.json /etc/vulkan/icd.d/nvidia_icd*.json; do
            if [ -f "$f" ]; then icd="$f"; break; fi
          done
          if [ -z "$icd" ]; then echo "::error::no NVIDIA Vulkan ICD manifest on this runner"; exit 1; fi
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$icd" VK_ICD_FILENAMES="$icd" vulkaninfo --summary 2>&1 | grep -E "deviceName|deviceType" || true

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force local-feed | Out-Null
          & dotnet build KhaozEngine.Render.Tests/KhaozEngine.Render.Tests.csproj -c Release
          exit $LASTEXITCODE

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p local-feed
          dotnet build KhaozEngine.Render.Tests/KhaozEngine.Render.Tests.csproj -c Release

      - name: Confirm the NVIDIA adapter (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $report = & dotnet test KhaozEngine.Render.Tests/KhaozEngine.Render.Tests.csproj -c Release --no-build --filter "$env:DEVICE_REPORT" --logger "console;verbosity=detailed" *>&1
          $report | Out-Host
          $line = ($report | Select-String "device='" | Select-Object -First 1)
          if (-not ("$line" -match 'NVIDIA|Tesla')) { Write-Host "::error::$env:KE_GRAPHICS_BACKEND is not on the NVIDIA GPU: $line"; exit 1 }

      - name: Confirm the NVIDIA adapter (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          report=$(dotnet test KhaozEngine.Render.Tests/KhaozEngine.Render.Tests.csproj -c Release --no-build --filter "$DEVICE_REPORT" --logger "console;verbosity=detailed" 2>&1 || true)
          echo "$report"
          line=$(echo "$report" | grep -m1 "device='" || true)
          if ! echo "$line" | grep -Eq 'NVIDIA|Tesla'; then echo "::error::$KE_GRAPHICS_BACKEND is not on the NVIDIA GPU: $line"; exit 1; fi

      - name: Record coverage native identity
        if: inputs.coverage-perf-unit != ''
        shell: pwsh
        run: |
          & nvidia-smi --query-gpu=name,pci.device_id,driver_version --format=csv 2>&1 | Tee-Object -FilePath (Join-Path $env:KE_COVERAGE_PERF_REPORTS 'nvidia-smi.log')
          if ($LASTEXITCODE -ne 0) { throw 'nvidia-smi identity failed' }
          & dotnet test KhaozEngine.Render.Tests/KhaozEngine.Render.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName=KhaozEngine.Tests.Gpu.CoveragePerfDeviceFactsGpuTests.Hosted_device_reports_native_T4_identity_and_timestamp_capability' --logger 'console;verbosity=detailed' --logger 'trx;LogFileName=device.trx' --results-directory $env:KE_COVERAGE_PERF_REPORTS 2>&1 | Tee-Object -FilePath (Join-Path $env:KE_COVERAGE_PERF_REPORTS 'device-report.log')
          if ($LASTEXITCODE -ne 0) { throw 'Native device identity or capability check failed' }
          [xml]$trx = Get-Content -Raw (Join-Path $env:KE_COVERAGE_PERF_REPORTS 'device.trx')
          $counts = $trx.TestRun.ResultSummary.Counters
          if ($counts.total -ne '1' -or $counts.executed -ne '1' -or $counts.passed -ne '1' -or $counts.failed -ne '0' -or $counts.notExecuted -ne '0') { throw 'Native capability check must execute exactly once with zero skips' }

      - name: Build coverage performance project
        if: inputs.coverage-perf-unit != ''
        shell: pwsh
        run: |
          & dotnet build tools/EquipmentCoverage.Perf.Tests/EquipmentCoverage.Perf.Tests.csproj -c Release 2>&1 | Tee-Object -FilePath (Join-Path $env:KE_COVERAGE_PERF_REPORTS 'build.log')
          if ($LASTEXITCODE -ne 0) { throw 'Performance project build failed' }

      - name: Measure authorized coverage unit
        if: inputs.coverage-perf-unit != ''
        shell: pwsh
        run: |
          $fixedFilter = 'FullyQualifiedName=EquipmentCoverage.Perf.Tests.CoveragePerfTests.Measure_authorized_unit&Category=CoveragePerformance'
          & dotnet test tools/EquipmentCoverage.Perf.Tests/EquipmentCoverage.Perf.Tests.csproj -c Release --no-build --filter $fixedFilter --logger 'console;verbosity=detailed' --logger 'trx;LogFileName=measurement.trx' --results-directory $env:KE_COVERAGE_PERF_REPORTS 2>&1 | Tee-Object -FilePath (Join-Path $env:KE_COVERAGE_PERF_REPORTS 'measurement.log')
          if ($LASTEXITCODE -ne 0) { throw 'Coverage measurement test failed' }
          [xml]$trx = Get-Content -Raw (Join-Path $env:KE_COVERAGE_PERF_REPORTS 'measurement.trx')
          $counters = @($trx.SelectNodes('//*[local-name()="Counters"]'))
          if ($counters.Count -ne 1) { throw 'TRX requires exactly one Counters element' }
          $counts = $counters[0]
          if ($counts.total -ne '1' -or $counts.executed -ne '1' -or $counts.passed -ne '1' -or $counts.failed -ne '0' -or $counts.notExecuted -ne '0') { throw 'Measurement requires exactly one passed executed test and zero skips' }
          $tests = @($trx.SelectNodes('//*[local-name()="UnitTestResult"]'))
          if ($tests.Count -ne 1 -or $tests[0].outcome -ne 'Passed') { throw 'TRX requires exactly one Passed result' }
          $json = Join-Path $env:KE_COVERAGE_PERF_REPORTS ($env:KE_COVERAGE_PERF_UNIT + '.json')
          $markdown = Join-Path $env:KE_COVERAGE_PERF_REPORTS ($env:KE_COVERAGE_PERF_UNIT + '.md')
          if (!(Test-Path $json -PathType Leaf) -or (Get-Item $json).Length -eq 0) { throw 'Final JSON is missing or empty' }
          if (!(Test-Path $markdown -PathType Leaf) -or (Get-Item $markdown).Length -eq 0) { throw 'Final Markdown is missing or empty' }
          $document = Get-Content -Raw $json | ConvertFrom-Json -ErrorAction Stop
          if ($document.schema -cne 'khaozengine.coverage-perf-report/1' -or $document.report.identity.unitId -cne $env:KE_COVERAGE_PERF_UNIT -or $document.report.returnedByRun -ne $true -or $document.report.finalUnitPublished -ne $true -or $document.report.status -cne 'Completed') { throw 'Coverage report is unfinalized or does not match the approved unit' }
          if ($document.report.manifestSha256 -cne $env:KE_COVERAGE_PERF_MANIFEST_SHA256 -or $document.report.identity.workloadSha -cne $env:KE_COVERAGE_PERF_WORKLOAD_SHA) { throw 'Final report hashes differ from the dispatch' }
          $authorization = (Get-Content -Raw (Join-Path $env:KE_COVERAGE_PERF_REPORTS 'authorization-sha.txt')).Trim()
          if ($document.report.identity.authorizationCommitSha -cne $authorization) { throw 'Final report authorization commit differs from the checkout' }

      - name: Test (Windows)
        if: inputs.coverage-perf-unit == '' && runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & dotnet test KhaozEngine.Render.Tests/KhaozEngine.Render.Tests.csproj -c Release --no-build --filter "$env:FILTER" --logger "console;verbosity=detailed" *>&1 | Tee-Object -FilePath bench-output.log
          exit $LASTEXITCODE

      - name: Test (Linux)
        if: inputs.coverage-perf-unit == '' && runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          dotnet test KhaozEngine.Render.Tests/KhaozEngine.Render.Tests.csproj -c Release --no-build --filter "$FILTER" --logger "console;verbosity=detailed" 2>&1 | tee bench-output.log

      # Two uploads keep an ordinary bench's artifact identical to before: a second search path, even an absent one,
      # would move bench-output.log out of the archive root.
      - name: Upload the output
        if: always() && inputs.coverage-perf-unit == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpu-hosted-bench-${{ matrix.leg }}
          path: bench-output.log
          if-no-files-found: warn

      - name: Upload the coverage evidence
        if: always() && inputs.coverage-perf-unit != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpu-hosted-bench-${{ matrix.leg }}
          path: ${{ runner.temp }}/coverage-perf
          if-no-files-found: warn

  renderer-bench:
    needs: legs
    if: inputs.renderer-perf-unit != '' && github.run_attempt == 1
    name: renderer / ${{ matrix.leg }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.jobMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.legs.outputs.matrix) }}
    env:
      KE_GPU_TESTS: '1'
      KE_GRAPHICS_BACKEND: ${{ matrix.backend }}
      KE_D3D11_ADAPTER: ${{ matrix.d3dAdapter }}
      KE_VULKAN_DEVICE: ${{ matrix.vulkanDevice }}
      KE_VULKAN_REQUIRED: ${{ matrix.backend == 'vulkan-native' && '1' || '' }}
      KE_RENDERER_PERF_UNIT: ${{ inputs.renderer-perf-unit }}
      RENDERER_PERF_UNIT: ${{ inputs.renderer-perf-unit }}
      RENDERER_PERF_MANIFEST_SHA256: ${{ inputs.renderer-perf-manifest-sha256 }}
      RENDERER_PERF_WORKLOAD_SHA: ${{ inputs.renderer-perf-workload-sha }}
      COVERAGE_PERF_UNIT: ${{ inputs.coverage-perf-unit }}
      COVERAGE_PERF_MANIFEST_SHA256: ${{ inputs.coverage-perf-manifest-sha256 }}
      COVERAGE_PERF_WORKLOAD_SHA: ${{ inputs.coverage-perf-workload-sha }}
      TESTED_REF: ${{ inputs.ref }}
      LEGS: ${{ matrix.leg }}
      FILTER: ${{ inputs.filter }}
      WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      DOTNET_TieredCompilation: '1'
      DOTNET_gcServer: '0'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2
      - name: Checkout trusted renderer admission implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: renderer-perf-trusted
          persist-credentials: false
      - name: Install PowerShell for renderer measurement (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          PWSH_URL: https://github.com/PowerShell/PowerShell/releases/download/v7.6.7/powershell-7.6.7-linux-x64.tar.gz
          PWSH_SHA256: 6896f9e3a6b0a354bf470835a96da76d2f801cd50dcf047ad7c4563bf93bf431
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pwsh"
          archive="$RUNNER_TEMP/pwsh.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$archive" "$PWSH_URL"
          echo "$PWSH_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$dir"
          chmod +x "$dir/pwsh"
          "$dir/pwsh" -NoProfile -Command "\$PSVersionTable.PSVersion.ToString()"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Install PowerShell for renderer measurement (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          PWSH_URL: https://github.com/PowerShell/PowerShell/releases/download/v7.6.7/PowerShell-7.6.7-win-x64.zip
          PWSH_SHA256: d2f952ebdbf24386cb8923553aa58e41a846db35a6155ea04c58142a4b16dbb7
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $dir = Join-Path $env:RUNNER_TEMP 'pwsh'
          $archive = Join-Path $env:RUNNER_TEMP 'pwsh.zip'
          Invoke-WebRequest -Uri $env:PWSH_URL -OutFile $archive -UseBasicParsing
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:PWSH_SHA256) { throw "PowerShell archive SHA-256 $actual does not match $env:PWSH_SHA256" }
          Expand-Archive -Path $archive -DestinationPath $dir -Force
          & (Join-Path $dir 'pwsh.exe') -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # An explicit BOM-free UTF-8 append, rather than Windows PowerShell 5.1 Out-File, keeps the file byte-exact.
          [IO.File]::AppendAllText($env:GITHUB_PATH, $dir + [Environment]::NewLine)


      - name: Admit renderer authorization on hosted hardware
        shell: pwsh
        env:
          KE_RENDERER_PERF_REPORTS: ${{ runner.temp }}/renderer-perf/${{ matrix.leg }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'KhaozEngine is public, hosted runners are required' }
          "KE_RENDERER_PERF_REPORTS=$env:KE_RENDERER_PERF_REPORTS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $env:GITHUB_WORKSPACE 'renderer-perf-trusted/scripts/renderer-perf-workflow.ps1') -Mode Authorize
          if ($LASTEXITCODE -ne 0) { throw 'Renderer authorization failed' }

      # SDK 10.0.402 includes runtime 10.0.13. SHA-512 values come from Microsoft's 10.0 releases.json.
      - name: Install isolated renderer SDK (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          DOTNET_URL: https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.402/dotnet-sdk-10.0.402-linux-x64.tar.gz
          DOTNET_SHA512: 1904a98dda2db34ba78ba3c4fb1b224455329af91c341d83547843c1839e112b04ae699ee92fa2449a8f62249196a938723078c0c60b9f65c88539d5687729c2
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/renderer-dotnet"
          archive="$RUNNER_TEMP/renderer-dotnet.tar.gz"
          mkdir "$dir"
          curl -fsSL --retry 3 -o "$archive" "$DOTNET_URL"
          echo "$DOTNET_SHA512  $archive" | sha512sum -c -
          tar -xzf "$archive" -C "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          {
            echo "DOTNET_ROOT=$dir"
            echo "DOTNET_ROOT_X64=$dir"
            echo "DOTNET_HOST_PATH=$dir/dotnet"
          } >> "$GITHUB_ENV"

      - name: Install isolated renderer SDK (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          DOTNET_URL: https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.402/dotnet-sdk-10.0.402-win-x64.zip
          DOTNET_SHA512: ae4fd528cb7e9f6af6aaf7de36715a69f761f183744f1bb3025d19f5a92447090ec561410e46266c1d10a63781ed6f3de771760bc76c876d87daabc367b898cd
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $dir = Join-Path $env:RUNNER_TEMP 'renderer-dotnet'
          $archive = Join-Path $env:RUNNER_TEMP 'renderer-dotnet.zip'
          if (Test-Path -LiteralPath $dir) { throw 'Renderer dotnet root must be absent before installation' }
          New-Item -ItemType Directory -Path $dir | Out-Null
          Invoke-WebRequest -Uri $env:DOTNET_URL -OutFile $archive -UseBasicParsing
          $actual = (Get-FileHash -Algorithm SHA512 $archive).Hash.ToLowerInvariant()
          if ($actual -cne $env:DOTNET_SHA512) { throw "Renderer SDK archive SHA-512 $actual does not match $env:DOTNET_SHA512" }
          Expand-Archive -Path $archive -DestinationPath $dir
          $hostPath = Join-Path $dir 'dotnet.exe'
          [IO.File]::AppendAllText($env:GITHUB_PATH, $dir + [Environment]::NewLine)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "DOTNET_ROOT=$dir" + [Environment]::NewLine)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "DOTNET_ROOT_X64=$dir" + [Environment]::NewLine)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "DOTNET_HOST_PATH=$hostPath" + [Environment]::NewLine)

      - name: Check exact renderer SDK and runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = & dotnet --version
          if ($LASTEXITCODE -ne 0 -or $sdk -cne '10.0.402') { throw "Expected renderer SDK 10.0.402, observed '$sdk' (exit $LASTEXITCODE)" }
          $runtimes = @(& dotnet --list-runtimes)
          if ($LASTEXITCODE -ne 0) { throw 'Renderer runtime listing failed' }
          $runtimes | Out-Host
          $core = @($runtimes | Where-Object { $_ -cmatch '^Microsoft\.NETCore\.App ' })
          if ($core.Count -ne 1 -or $core[0] -cnotmatch '^Microsoft\.NETCore\.App 10\.0\.13 \[') { throw "Expected exactly Microsoft.NETCore.App 10.0.13, observed: $($runtimes -join ', ')" }

      - name: GPU, driver model and the GRID driver (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        env:
          # Microsoft's redistribution for NCasT4_v3 on Windows Server 2022 (vGPU 20.2), licensed for Azure. From
          # learn.microsoft.com/azure/virtual-machines/windows/n-series-driver-setup.
          GRID_URL: https://download.microsoft.com/download/0f21fd13-2390-4c79-876a-87ae3dc724c6/596.86_grid_win10_win11_server2022_server2025_dch_64bit_international_azure_swl.exe
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'
          Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion, Status
          & nvidia-smi
          $model = (& nvidia-smi --query-gpu=driver_model.current --format=csv,noheader) -join ''
          Write-Host "driver model: $model"
          if ($model -match 'TCC') {
            $exe = Join-Path $env:RUNNER_TEMP 'grid.exe'
            Invoke-WebRequest -Uri $env:GRID_URL -OutFile $exe -UseBasicParsing
            $p = Start-Process -FilePath $exe -ArgumentList '-s', '-noreboot', '-clean', '-noeula' -Wait -PassThru
            Write-Host "GRID installer exit code: $($p.ExitCode)"
            Start-Sleep -Seconds 15
            & nvidia-smi
            Write-Host "after the install: $((& nvidia-smi --query-gpu=driver_model.current,driver_model.pending --format=csv,noheader) -join '')"
            Get-CimInstance Win32_VideoController | Format-List Name, Status
          }

      - name: GPU, driver and Vulkan devices (Linux)
        if: runner.os == 'Linux' && matrix.executionClass != 'rehearsal'
        continue-on-error: true
        shell: bash
        run: |
          nvidia-smi || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 vulkan-tools
          ls -la /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2>/dev/null || true
          vulkaninfo --summary 2>&1 | head -60 || true

      - name: Install renderer rehearsal lavapipe
        if: runner.os == 'Linux' && matrix.executionClass == 'rehearsal'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-tools libvulkan1
          dpkg -L mesa-vulkan-drivers | grep -Ei 'icd|lvp|\.so' || true
          icd=$(dpkg -L mesa-vulkan-drivers | grep -E '/lvp_icd[^/]*\.json$' | head -1)
          if [ -z "$icd" ] || [ ! -f "$icd" ]; then
            echo "::error::lavapipe ICD manifest not found in the mesa-vulkan-drivers file list"
            exit 1
          fi
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      # The runner also carries Mesa's llvmpipe, and a Vulkan device request that cannot be honoured falls back to
      # it without failing (#1200): late in one run the T4 stopped being chosen and two cost facts ran on llvmpipe.
      # Loading only the NVIDIA driver turns that into a failure instead of a skipped measurement.
      - name: Load only the NVIDIA Vulkan driver (Linux)
        if: runner.os == 'Linux' && matrix.executionClass != 'rehearsal'
        shell: bash
        run: |
          # One of the two directories is usually absent, and ls then exits 2, which the step's pipefail would
          # turn into a failure, so the first existing manifest is found with a glob instead.
          icd=""
          for f in /usr/share/vulkan/icd.d/nvidia_icd*.json /etc/vulkan/icd.d/nvidia_icd*.json; do
            if [ -f "$f" ]; then icd="$f"; break; fi
          done
          if [ -z "$icd" ]; then echo "::error::no NVIDIA Vulkan ICD manifest on this runner"; exit 1; fi
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$icd" VK_ICD_FILENAMES="$icd" vulkaninfo --summary 2>&1 | grep -E "deviceName|deviceType" || true


      - name: Build isolated renderer performance project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force local-feed | Out-Null
          & dotnet build tools/Renderer.Perf.Tests/Renderer.Perf.Tests.csproj -c Release 2>&1 | Tee-Object -FilePath (Join-Path $env:KE_RENDERER_PERF_REPORTS 'build.log')
          if ($LASTEXITCODE -ne 0) { throw 'Renderer performance build failed' }
          $trusted = Join-Path $env:GITHUB_WORKSPACE 'renderer-perf-trusted'
          New-Item -ItemType Directory -Force (Join-Path $trusted 'local-feed') | Out-Null
          & dotnet build (Join-Path $trusted 'tools/Renderer.Perf.Verify/Renderer.Perf.Verify.csproj') -c Release 2>&1 | Tee-Object -FilePath (Join-Path $env:KE_RENDERER_PERF_REPORTS 'verifier-build.log')
          if ($LASTEXITCODE -ne 0) { throw 'Trusted renderer verifier build failed' }

      - name: Measure exactly one authorized renderer unit
        shell: pwsh
        run: |
          $fixedFilter = 'FullyQualifiedName=Renderer.Perf.Tests.RendererPerfTests.Measure_authorized_unit&Category=RendererPerformance'
          & dotnet test tools/Renderer.Perf.Tests/Renderer.Perf.Tests.csproj -c Release --no-build --filter $fixedFilter --logger 'console;verbosity=detailed' --logger 'trx;LogFileName=measurement.trx' --results-directory $env:KE_RENDERER_PERF_REPORTS 2>&1 | Tee-Object -FilePath (Join-Path $env:KE_RENDERER_PERF_REPORTS 'measurement.log')
          if ($LASTEXITCODE -ne 0) { throw 'Renderer measurement failed, retain partial evidence and request fresh approval' }

      - name: Verify paid renderer performance evidence
        if: matrix.executionClass == 'performance'
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'renderer-perf-trusted/scripts/renderer-perf-workflow.ps1') -Mode Verify
          if ($LASTEXITCODE -ne 0) { throw 'Renderer final evidence was refused' }

      - name: Verify renderer rehearsal correctness
        if: matrix.executionClass == 'rehearsal'
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'renderer-perf-trusted/scripts/renderer-perf-workflow.ps1') -Mode VerifyRehearsal
          if ($LASTEXITCODE -ne 0) { throw 'Renderer rehearsal correctness evidence was refused' }

      - name: Upload renderer evidence including partial failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderer-perf-${{ matrix.leg }}
          path: ${{ runner.temp }}/renderer-perf
          if-no-files-found: warn
