# Separate CPU timing diagnostic. No push or PR trigger and no dependency from the merge/release gates.
# The public repository uses a standard GitHub-hosted runner. Timing never runs on the dev Mac.
name: physics-rebase-perf

on:
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebase-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Checkout takes no explicit ref. The run measures the commit its event selected, so a dispatch measures the ref it was started on
      # and a schedule measures main, and the summary always describes the run's own commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build the isolated timing project
        run: |
          mkdir -p local-feed
          dotnet build tools/Physics.Rebase.Perf.Tests/Physics.Rebase.Perf.Tests.csproj -c Release

      - name: Measure five interleaved samples and report the median ratio
        # The fact writes GITHUB_STEP_SUMMARY before asserting its 3x bound. A regression fails this job.
        run: |
          dotnet test tools/Physics.Rebase.Perf.Tests/Physics.Rebase.Perf.Tests.csproj -c Release --no-build \
            --filter FullyQualifiedName=KhaozEngine.Tests.Physics.PhysicsRebasePerfTests.Rebase_StaysWithinThreeSteps \
            --logger 'trx;LogFileName=physics-rebase-perf.trx' --results-directory TestResults/physics-rebase-perf

      - name: Require the single measurement to have executed
        if: always()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          root = ET.parse('TestResults/physics-rebase-perf/physics-rebase-perf.trx').getroot()
          counters = root.find('.//{*}Counters').attrib
          assert counters['total'] == '1' and counters['executed'] == '1', counters
          assert counters['passed'] == '1', counters
          PYTHON

      - name: Upload measurement results including regressions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: physics-rebase-perf
          path: TestResults/physics-rebase-perf/*.trx
          if-no-files-found: error
