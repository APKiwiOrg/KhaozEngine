name: stress-test

# The engine's caller of the org's shared stress workflow. The engine is not a game-template adopter, so this
# caller is owned here and follows game-template's by hand, adding the packages token its nuget.config needs.
#
# A thin caller of the org's ONE stress workflow, APKiwiOrg/ci-workflows (see its README). Every run happens on
# a GitHub-hosted runner, never on the dev Mac or the self-hosted fleet (docs/CONTRIBUTOR-RULES.md, "Build and
# CI"). A load or stress run needs the owner's explicit permission before it starts. Then:
#
#   gh workflow run stress-test.yml --ref <branch> \
#     -f project=KhaozEngine.Server.Tests/KhaozEngine.Server.Tests.csproj -f filter="FullyQualifiedName~<Name>" -f iterations=50 -f load=4
#
# A coverage cost run builds only its project and keeps each run's reports, logs and TRX as stress-artifacts.
# It still needs an owner-approved manifest and the owner's permission for the run:
#
#   gh workflow run stress-test.yml --ref <branch> \
#     -f project=tools/EquipmentCoverage.Cost.Tests/EquipmentCoverage.Cost.Tests.csproj \
#     -f build-target=tools/EquipmentCoverage.Cost.Tests/EquipmentCoverage.Cost.Tests.csproj \
#     -f filter='FullyQualifiedName=KhaozEngine.Tests.CoverageCost.CoverageCostTests.Measure_authorized_case&DisplayName~<unit>' \
#     -f iterations=1 -f load=0 -f configuration=Release -f artifact-env=KE_COVERAGE_COST_REPORTS
on:
  workflow_dispatch:
    inputs:
      project:
        description: Test project to build and run (path to its .csproj)
        required: true
        type: string
      filter:
        description: dotnet test --filter expression selecting the tests to repeat
        required: true
        type: string
      iterations:
        description: How many times to run the selection, 1 to 200
        required: false
        default: '20'
        type: string
      load:
        description: Busy-loop processes kept running during every run to add contention, 0 to 16 (0 is none)
        required: false
        default: '0'
        type: string
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: choice
        options:
          - Release
          - Debug
      support-cost:
        description: Record fixed-compilation support cost artifacts, requires Release and load=0
        required: false
        default: false
        type: boolean
      build-target:
        description: Solution or project to build before the runs, empty builds KhaozEngine.slnx
        required: false
        default: ''
        type: string
      artifact-env:
        description: Environment variable naming each run's retained directory, empty for none
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  stress:
    uses: APKiwiOrg/ci-workflows/.github/workflows/stress-test.yml@1a176109d8598a9991de98101d6d29b51d4331c9 # per-run artifact directories
    with:
      project: ${{ inputs.project }}
      filter: ${{ inputs.filter }}
      iterations: ${{ inputs.iterations }}
      load: ${{ inputs.load }}
      configuration: ${{ inputs.configuration }}
      support-cost: ${{ inputs.support-cost }}
      build-target: ${{ inputs.build-target }}
      artifact-env: ${{ inputs.artifact-env }}
    secrets:
      packages-token: ${{ secrets.GITHUB_TOKEN }}
