name: Terrain format portability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrain-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Load the committed Mac bake and reconstruct its terrain certificates
        shell: bash
        run: |
          mkdir -p local-feed
          dotnet test KhaozEngine.TileWorld.Physics.Tests/KhaozEngine.TileWorld.Physics.Tests.csproj -c Release --filter FullyQualifiedName~ContactTerrainGoldenTests --logger 'trx;LogFileName=terrain-format.trx' --results-directory terrain-format-results
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          result = ET.parse(next(pathlib.Path('terrain-format-results').glob('*.trx')))
          counters = next(node for node in result.iter() if node.tag.endswith('Counters'))
          assert counters.attrib['total'] == counters.attrib['passed'] == '1', counters.attrib
          PY
