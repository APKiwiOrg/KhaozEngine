name: Terrain format portability

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '34 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && github.run_attempt == 1 &&
        format('terrain-format-pr-{0}', github.event.pull_request.number) ||
        format('terrain-format-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      selected: ${{ steps.scope.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/native-ci-scope/
            /.github/ci-scope.txt
          sparse-checkout-cone-mode: false
      - id: scope
        uses: ./.github/actions/native-ci-scope
        with:
          segments: '["tile-world-physics"]'

  golden:
    needs: scope
    if: needs.scope.outputs.selected == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        shell: bash
        run: |
          mkdir -p local-feed
          dotnet build KhaozEngine.TileWorld.Physics.Tests/KhaozEngine.TileWorld.Physics.Tests.csproj -c Release

      - name: 'Test: terrain-format'
        shell: bash
        run: |
          dotnet test KhaozEngine.TileWorld.Physics.Tests/KhaozEngine.TileWorld.Physics.Tests.csproj -c Release --no-build --filter FullyQualifiedName~ContactTerrainGoldenTests --logger 'trx;LogFileName=terrain-format.trx' --results-directory terrain-format-results
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          result = ET.parse(next(pathlib.Path('terrain-format-results').glob('*.trx')))
          counters = next(node for node in result.iter() if node.tag.endswith('Counters'))
          assert counters.attrib['total'] == counters.attrib['passed'] == '1', counters.attrib
          PY
