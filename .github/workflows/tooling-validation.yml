      - 'KhaozEngine.Render.Tests/AllocSensitiveCollection.cs'
      - 'KhaozEngine.Render.Tests/Gpu/GpuBackendProvidersCollection.cs'
  workflow_dispatch:
    inputs:
      suite:
        description: Explicit tooling suite
        type: choice
        options: [renderer, items, nav]
        default: renderer
  workflow_call:
    inputs:
      suite:
        type: string
        required: true
      ref:
        description: Immutable requested authorization SHA
        type: string
        required: true
      trusted-ref:
        description: Immutable trusted workflow implementation SHA
        type: string
        required: true

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      renderer: ${{ steps.select.outputs.renderer }}
      items-matrix: ${{ steps.select.outputs.items-matrix }}
      items: ${{ steps.select.outputs.items }}
      nav-matrix: ${{ steps.select.outputs.nav-matrix }}
      nav: ${{ steps.select.outputs.nav }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: select
        shell: bash
        env:
          SELECTION_EVENT: ${{ (inputs.ref != '' || inputs.trusted-ref != '') && 'workflow_call' || github.event_name }}
          SUITE: ${{ inputs.suite || 'renderer' }}
          REQUESTED_SHA: ${{ github.sha }}
          CALL_SHA: ${{ inputs.ref }}
          TRUSTED_SHA: ${{ inputs.trusted-ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          case "$SUITE" in renderer|items|nav) ;; *) echo 'Unknown tooling suite' >&2; exit 1 ;; esac
          if [[ "$SELECTION_EVENT" == workflow_call ]]; then REQUESTED_SHA=$CALL_SHA; fi
          args=(--event "$SELECTION_EVENT" --ref "$REQUESTED_SHA" --trusted-ref "$TRUSTED_SHA")
          if [[ "$SELECTION_EVENT" == push || "$SELECTION_EVENT" == pull_request ]]; then
            if [[ -z "$BASE_SHA" ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              args+=(--unknown-diff)
            else
              git diff --name-only "$BASE_SHA" "$REQUESTED_SHA" > "$RUNNER_TEMP/tooling-changed.txt"
              args+=(--changed-file "$RUNNER_TEMP/tooling-changed.txt")
            fi
          fi
          for suite in renderer items nav; do
            matrix='{"include":[]}'
            if [[ "$SELECTION_EVENT" == push || "$SELECTION_EVENT" == pull_request || "$SUITE" == "$suite" ]]; then
              matrix=$(python3 scripts/renderer-tooling-selection.py "${args[@]}" --suite "$suite")
            fi
            key=matrix
            if [[ "$suite" != renderer ]]; then key=$suite-matrix; fi
            echo "$key=$matrix" >> "$GITHUB_OUTPUT"
            echo "$suite=$(python3 -c 'import json,sys; print(str(bool(json.loads(sys.argv[1])["include"])).lower())' "$matrix")" >> "$GITHUB_OUTPUT"
          done

  renderer:
    needs: select
    if: needs.select.outputs.renderer == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      KE_GRAPHICS_BACKEND: ${{ matrix.backend }}
      KE_D3D11_ADAPTER: warp
      KE_VULKAN_DEVICE: llvmpipe
      KE_VULKAN_REQUIRED: ${{ matrix.backend == 'vulkan-native' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Check process-fixture tools
        shell: bash
        run: |
          git --version
          python3 --version
          pwsh -NoProfile -Command "\$PSVersionTable.PSVersion.ToString()"
          bash --version
      - name: Install software Vulkan
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-tools libvulkan1
          icd=$(dpkg -L mesa-vulkan-drivers | grep -E '/lvp_icd[^/]*\.json$' | head -1)
          test -n "$icd" && test -f "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Build renderer tooling and offline verifier
        shell: bash
        run: |
          mkdir -p local-feed
          sh scripts/build-release-tests.sh tools/Renderer.Perf.Tooling.Tests/Renderer.Perf.Tooling.Tests.csproj
      - name: Run complete headless renderer tooling suite
        shell: pwsh
        run: |
          Remove-Item Env:KE_GPU_TESTS, Env:KE_RENDERER_PERF_UNIT -ErrorAction SilentlyContinue
          & dotnet test tools/Renderer.Perf.Tooling.Tests/Renderer.Perf.Tooling.Tests.csproj -c Release --no-build --logger 'trx;LogFileName=headless.trx' --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run free native FFT bound correctness fact with no skips
        shell: pwsh
        run: |
          Remove-Item Env:KE_RENDERER_PERF_UNIT -ErrorAction SilentlyContinue
          $env:KE_GPU_TESTS = '1'
          & dotnet test tools/Renderer.Perf.Tooling.Tests/Renderer.Perf.Tooling.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName=KhaozEngine.Tests.Gpu.RendererPerf.RendererPerfWaterOpticsRecipeTests.Fft_surface_stays_within_its_bound' --logger 'trx;LogFileName=fft-bound.trx' --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$trx = Get-Content -Raw TestResults/fft-bound.trx
          $counts = @($trx.SelectNodes('//*[local-name()="Counters"]'))
          if ($counts.Count -ne 1 -or $counts[0].total -ne '1' -or $counts[0].passed -ne '1' -or $counts[0].notExecuted -ne '0' -or $counts[0].failed -ne '0') { throw 'Free FFT correctness requires exactly one pass and zero skips' }
      - name: Upload tooling test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderer-tooling-${{ matrix.os }}-${{ matrix.ref }}
          path: TestResults/*.trx
          if-no-files-found: warn

  items:
    needs: select
    if: needs.select.outputs.items == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.items-matrix) }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build Items benchmark acceptance
        shell: bash
        run: |
          mkdir -p local-feed
          sh scripts/build-release-tests.sh tools/Items.Benchmark.Tests/Items.Benchmark.Tests.csproj
      - name: Run Items benchmark acceptance in its own process
        shell: pwsh
        run: |
          & dotnet test tools/Items.Benchmark.Tests/Items.Benchmark.Tests.csproj -c Release --no-build --logger 'trx;LogFileName=items.trx' --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require named Items acceptance pass
        shell: pwsh
        run: |
          [xml]$trx = Get-Content -Raw TestResults/items.trx
          $counts = @($trx.SelectNodes('//*[local-name()="Counters"]'))
          $results = @($trx.SelectNodes('//*[local-name()="UnitTestResult"]'))
          $name = 'KhaozEngine.Tests.Benchmarks.ItemsBenchmarkAcceptanceTests.A_quick_run_measures_every_budget_and_coalesces_the_crafts_into_ONE_commit'
          if ($counts.Count -ne 1 -or $counts[0].total -ne '1' -or $counts[0].passed -ne '1' -or $counts[0].notExecuted -ne '0' -or $counts[0].failed -ne '0') { throw 'Items acceptance requires exactly one pass and zero skips' }
          if ($results.Count -ne 1 -or $results[0].testName -ne $name -or $results[0].outcome -ne 'Passed') { throw 'The named Items acceptance fact must pass' }
      - name: Upload Items acceptance result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: items-benchmark-${{ matrix.ref }}
          path: TestResults/items.trx
          if-no-files-found: warn

  nav:
    needs: select
    if: needs.select.outputs.nav == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.nav-matrix) }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build navigation capture research
        shell: bash
        run: |
          mkdir -p local-feed
          sh scripts/build-release-tests.sh tools/NavCapture.Research.Tests/NavCapture.Research.Tests.csproj
      - name: Run synthetic navigation research fixtures
        shell: pwsh
        run: |
          & dotnet test tools/NavCapture.Research.Tests/NavCapture.Research.Tests.csproj -c Release --no-build --logger 'trx;LogFileName=nav.trx' --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require named navigation research passes
        shell: pwsh
        run: |
          [xml]$trx = Get-Content -Raw TestResults/nav.trx
          $counts = @($trx.SelectNodes('//*[local-name()="Counters"]'))
          $results = @($trx.SelectNodes('//*[local-name()="UnitTestResult"]'))
          $names = @(
            'KhaozEngine.Tests.Movement.Research.NavCaptureResearchTests.OneCapturePreservesFixtureColumnsAndSeparatesStages'
            'KhaozEngine.Tests.Movement.Research.NavCaptureSnapshotTests.RestoredSnapshotRetainsEveryBitWithoutSamplingPhysics'
            'KhaozEngine.Tests.Movement.Research.NavCaptureSnapshotTests.RestoredFixtureBuildsTheSameCanonicalBakeAsFreshCapture'
          )
          if ($counts.Count -ne 1 -or $counts[0].total -ne '3' -or $counts[0].passed -ne '3' -or $counts[0].notExecuted -ne '0' -or $counts[0].failed -ne '0') { throw 'Navigation research requires exactly three passes and zero skips' }
          if ($results.Count -ne 3) { throw 'All three named navigation research facts must pass' }
          foreach ($name in $names) {
            $matching = @($results | Where-Object { $_.testName -eq $name -and $_.outcome -eq 'Passed' })
            if ($matching.Count -ne 1) { throw "Navigation research fact must pass once, $name" }
          }
      - name: Upload navigation research results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nav-capture-research-${{ matrix.ref }}
          path: TestResults/nav.trx
          if-no-files-found: warn

  renderer-result:
    needs: [select, renderer]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Require completed tooling validation
        shell: bash
        env:
          REQUIRED: ${{ (inputs.suite == 'renderer' && (github.event_name == 'workflow_dispatch' || inputs.trusted-ref != '')) || needs.select.outputs.renderer == 'true' }}
          SELECT_RESULT: ${{ needs.select.result }}
          RENDERER_RESULT: ${{ needs.renderer.result }}
        run: |
          test "$SELECT_RESULT" = success
          if [ "$REQUIRED" = true ]; then
            test "$RENDERER_RESULT" = success
          fi
