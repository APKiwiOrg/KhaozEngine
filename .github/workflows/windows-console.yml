name: Windows console regression

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '51 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && github.run_attempt == 1 &&
        format('windows-console-pr-{0}', github.event.pull_request.number) ||
        format('windows-console-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      selected: ${{ steps.scope.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/native-ci-scope/
            /.github/ci-scope.txt
          sparse-checkout-cone-mode: false
      - id: scope
        uses: ./.github/actions/native-ci-scope
        with:
          segments: '["compile-windows-console-driver", "compile-windows-console-probe"]'

  native-console:
    needs: scope
    if: needs.scope.outputs.selected == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: 'Test: windows-console'
        shell: pwsh
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/windows-console-nuget-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./scripts/tests/windows-console-smoke.ps1 -EvidenceDirectory "$env:RUNNER_TEMP/windows-console-evidence"
      - name: Upload native evidence and build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-console-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-console-evidence/**/*.json
            ${{ runner.temp }}/windows-console-evidence/**/*.txt
            ${{ runner.temp }}/windows-console-evidence/**/*.cmd
            ${{ runner.temp }}/windows-console-evidence/*.log
            ${{ runner.temp }}/windows-console-evidence/*.md
          if-no-files-found: warn
          retention-days: 14
