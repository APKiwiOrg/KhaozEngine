name: Windows console regression

on:
  push:
    branches: [main, fix/windows-console-1322]
    paths: &console-paths
      - 'tools/WindowsConsoleProbe/**'
      - 'scripts/tests/windows-console-smoke.ps1'
      - '.github/workflows/windows-console.yml'
      - 'KhaozEngine.Platform/**'
      - 'KhaozEngine.Foundation.Tests/Platform/WindowsConsole*.cs'
      - 'KhaozEngine.CodeHealth.Analyzers/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - '.filesize-baseline'
  pull_request:
    paths: *console-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-console:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Native WinExe console regression
        shell: pwsh
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/windows-console-nuget-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./scripts/tests/windows-console-smoke.ps1 -EvidenceDirectory "$env:RUNNER_TEMP/windows-console-evidence"
      - name: Upload native evidence and build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-console-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-console-evidence/**/*.json
            ${{ runner.temp }}/windows-console-evidence/**/*.txt
            ${{ runner.temp }}/windows-console-evidence/**/*.cmd
            ${{ runner.temp }}/windows-console-evidence/*.log
            ${{ runner.temp }}/windows-console-evidence/*.md
          if-no-files-found: warn
          retention-days: 14
